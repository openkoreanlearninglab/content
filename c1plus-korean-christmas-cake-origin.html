            "A1": { title: "Novice", desc: "Can use and understand very simple everyday expressions. Can introduce themselves, ask and answer basic questions (name, age, where they live, etc.)." },
            "A1+": { title: "Pre-Beginner", desc: "Still beginner, but can handle slightly more than A1: simple short conversations about familiar topics if the other person speaks slowly and clearly." },
            "A2": { title: "Beginner", desc: "Can understand frequently used sentences (family, shopping, work, hobbies). Can handle simple routine tasks and short social exchanges." },
            "A2+": { title: "Upper Beginner", desc: "Between A2 and B1. Can speak a bit more smoothly about daily life, give simple opinions, and manage short conversations with some support." },
            "B1": { title: "Pre-Intermediate", desc: "Can understand the main points of clear standard speech or texts on familiar topics (school, work, leisure). Can describe experiences, plans, and briefly explain opinions." },
            "B1+": { title: "Lower Intermediate", desc: "Stronger B1. More comfortable carrying conversations, handling some unexpected situations, and linking ideas more coherently, but still with gaps." },
            "B2": { title: "Intermediate", desc: "Can understand the main ideas of complex texts, interact quite fluently with natives, and produce clear, detailed speech and writing on many topics." },
            "B2+": { title: "Upper Intermediate", desc: "Near C1. Can argue a point logically, follow more abstract discussions, and use a wide range of vocabulary with fewer mistakes, though not fully “advanced”." },
            "C1": { title: "Advanced", desc: "Can understand long, demanding texts and implied meanings; express ideas fluently and spontaneously; use language flexibly in academic, professional, and social settings." },
            "C1+": { title: "Upper Advanced", desc: "Very strong C1, approaching native-like flexibility. Still occasional non-native patterns, but can operate comfortably in almost all situations." },
            "C2": { title: "Proficient", desc: "Can understand virtually everything heard or read; express themselves very precisely, subtly, and naturally, even in complex, nuanced situations." }
        };

            if (code === 'A1') return 'lime';

            if (code === 'B1') return 'sky';

            { id: 's34', speaker: '유나', kor: '네, 후지 리네몬(藤井林右衛門, Fujii Rinemon)이라는 제과업자가 1910년에 요코하마에서 빵집을 열었어요.', time: [135.167, 141.367], eng: 'Yes, a confectioner named Fujii Rinemon opened a bakery in Yokohama in 1910.' },
            { id: 's35', speaker: '유나', kor: '당시 요코하마가 개항장이어서 외국인들이 많았는데, 주로 그들을 대상으로 영국식 과일 케이크를 팔았다고 해요.', time: [141.968, 150.101], eng: 'Yokohama was an open port at the time, so there were many foreigners, and it is said that he mainly sold British fruit cakes to them.' },
            { id: 's36', speaker: '민호', kor: '아, 시작은 우리가 아는 그 딸기 생크림 케이크가 아니었군요.', time: [150.167, 154.301], eng: 'Ah, so the start wasn\'t the strawberry whipped cream cake we know.' },
            { id: 's37', speaker: '민호', kor: '그냥 서양식 과일 케이크였네요.', time: [154.401, 156.462], eng: 'It was just a Western-style fruit cake.' },
            { id: 's38', speaker: '유나', kor: '네, 그랬죠.', time: [156.468, 157.534], eng: 'Yes, it was.' },
            { id: 's39', speaker: '유나', kor: '그런데 이 사람이 1921년에 미국 제과 산업을 시찰하고 돌아오면서 모든 게 바뀝니다.', time: [157.568, 164.768], eng: 'But everything changes when he returns from inspecting the US confectionery industry in 1921.' },
            { id: 's40', speaker: '민호', kor: '아, 어떤 전환점이 있었군요.', time: [164.834, 166.701], eng: 'Ah, there was a turning point.' },
            { id: 's41', speaker: '유나', kor: '네, 1922년 그는 도쿄의 최고 부유층 상업지구인 긴자에 완전히 새로운 스타일의 케이크를 선보여요.', time: [166.701, 175.067], eng: 'Yes, in 1922, he introduced a completely new style of cake in Ginza, Tokyo\'s wealthiest commercial district.' },
            { id: 's42', speaker: '유나', kor: '부드러운 스펀지 케이크에 눈처럼 하얀 생크림을 바르고, 그 위에 보석처럼 새빨간 딸기를 올린 케이크.', time: [175.201, 183.568], eng: 'A cake with soft sponge cake covered in snow-white whipped cream, topped with jewel-like red strawberries.' },
            { id: 's43', speaker: '민호', kor: '아, 그게 바로 지금 우리가 아는 크리스마스 케이크의 원형이 탄생한 순간이군요.', time: [183.634, 188.935], eng: 'Ah, that was the moment the prototype of the Christmas cake we know now was born.' },
            { id: 's44', speaker: '유나', kor: '바로 그 순간이죠.', time: [188.968, 190.285], eng: 'That very moment.' },
            { id: 's45', speaker: '민호', kor: '1922년이면 벌써 100년도 더 전이네요.', time: [190.367, 193.587], eng: '1922 was already over 100 years ago.' },
            { id: 's46', speaker: '민호', kor: '그런데 왜 하필 스펀지, 생크림, 딸기 조합이었을까요?', time: [193.634, 197.935], eng: 'But why the combination of sponge, whipped cream, and strawberries?' },
            { id: 's47', speaker: '민호', kor: '미국에서 그걸 보고 온 건가요?', time: [198.134, 199.634], eng: 'Did he see that in the US?' },
            { id: 's48', speaker: '유나', kor: '그게 아니라는 점이 중요해요.', time: [199.668, 201.601], eng: 'It\'s important that that wasn\'t the case.' },
            { id: 's49', speaker: '유나', kor: '이건 단순한 모방이 아니라 뭐랄까 창조에 가까웠어요.', time: [201.668, 205.434], eng: 'This wasn\'t simple imitation, it was closer to creation.' },
            { id: 's50', speaker: '유나', kor: '당시 이 케이크는 그냥 맛있는 디저트 그 이상의 의미를 담고 있었거든요.', time: [205.634, 211.301], eng: 'At the time, this cake contained meaning beyond just a delicious dessert.' },
            { id: 's51', speaker: '민호', kor: '더 큰 의미요?', time: [211.434, 212.401], eng: 'Bigger meaning?' },
            { id: 's52', speaker: '유나', kor: '네, 당시 일본 사회를 관통하던 시대정신 바로 \'탈아입구(脱亜入欧)\', 즉 아시아를 벗어나 서구를 지향하자는 근대화의 상징과도 같았던 거죠.', time: [212.434, 223.110], eng: 'Yes, it was like a symbol of modernization, the zeitgeist penetrating Japanese society at the time, \'Datsu-A Nyu-O\', meaning leaving Asia and entering Europe.' },
            { id: 's53', speaker: '민호', kor: '케이크 하나에 그렇게 거창한 의미가 담겨 있었다니.', time: [223.201, 226.101], eng: 'To think such a grand meaning was contained in a single cake.' },
            { id: 's54', speaker: '민호', kor: '그런데 그 하얗고 빨간 케이크가 어떻게 근대화의 상징이 될 수 있었는지 그게 바로 와닿지는 않는데요.', time: [226.234, 232.468], eng: 'But it doesn\'t immediately click how that white and red cake could be a symbol of modernization.' },
            { id: 's55', speaker: '유나', kor: '와세다 대학의 고나가야 히데요(小長谷 英代, Hideyo Konagaya) 교수의 분석을 들어보면 "아하" 하게 돼요.', time: [232.601, 237.534], eng: 'If you listen to the analysis of Professor Hideyo Konagaya of Waseda University, you\'ll have an "aha" moment.' },
            { id: 's56', speaker: '유나', kor: '그는 이 케이크를 일본의 전통 축하 음식인 ‘홍백모찌’, 그러니까 붉고 흰 찹쌀떡의 현대적 변용으로 해석해요.', time: [237.568, 247.029], eng: 'He interprets this cake as a modern variation of \'Kohaku Mochi\', red and white rice cakes, which are traditional Japanese celebratory food.' },
            { id: 's57', speaker: '민호', kor: '아, 떡의 변형이요?', time: [247.134, 248.935], eng: 'Ah, a variation of rice cake?' },
            { id: 's58', speaker: '유나', kor: '네, 겉모습은 서구적이지만 그 색의 조합이나 축하의 의미는 지극히 일본적인 맥락 위에 있다는 거죠.', time: [249.000, 257.501], eng: 'Yes, while the appearance is Western, the color combination and the meaning of celebration are based on a very Japanese context.' },
            { id: 's59', speaker: '유나', kor: '전통적인 형식은 유지하되 내용물은 서구적인 것으로 채워서 우리 식의 근대화를 이루었다는 상징물로 본 거예요.', time: [257.568, 265.601], eng: 'It was seen as a symbol of achieving our own style of modernization by maintaining traditional forms but filling the content with Western things.' },
            { id: 's60', speaker: '민호', kor: '아, 그렇게 연결되는군요.', time: [265.668, 267.568], eng: 'Ah, so that\'s how it connects.' },
            { id: 's61', speaker: '민호', kor: '전통적인 것과 서구적인 것의 결합.', time: [267.601, 270.233], eng: 'The combination of the traditional and the Western.' },
            { id: 's62', speaker: '민호', kor: '그런데 여전히 궁금한 점이 있어요.', time: [270.468, 272.468], eng: 'But I still have a question.' },
            { id: 's63', speaker: '민호', kor: '크리스마스는 한겨울인데 1920년대에 어떻게 딸기를 구했을까요?', time: [272.868, 277.834], eng: 'Christmas is in midwinter, how did they get strawberries in the 1920s?' },
            { id: 's64', speaker: '민호', kor: '지금도 겨울 딸기는 비싸잖아요.', time: [277.968, 280.434], eng: 'Even now, winter strawberries are expensive.' },
            { id: 's65', speaker: '유나', kor: '바로 그게 핵심이에요.', time: [280.600, 282.000], eng: 'That is exactly the point.' },
            { id: 's66', speaker: '유나', kor: '당시로써는 최첨단 기술인 온실 재배가 있어야만 겨울에 딸기를 생산할 수 있었죠.', time: [282.067, 287.700], eng: 'At the time, winter strawberries could only be produced with greenhouse cultivation, which was cutting-edge technology.' },
            { id: 's67', speaker: '민호', kor: '아~!', time: [287.801, 288.501], eng: 'Ah~!' },
            { id: 's68', speaker: '유나', kor: '즉, 이 케이크 위에 올라간 겨울 딸기는 단순한 과일이 아니라, 우리는 서양처럼 이런 것도 할 수 있다는 기술적 근대성을 과시하는 상징이었던 거예요.', time: [288.700, 299.256], eng: 'In other words, the winter strawberries on this cake were not just fruit, but a symbol showing off technological modernity, saying "we can do this like the West".' },
            { id: 's69', speaker: '민호', kor: '부와 기술의 징표였던 셈이네요.', time: [299.334, 301.601], eng: 'It was a mark of wealth and technology.' },
            { id: 's70', speaker: '민호', kor: '아무나 흉내 낼 수 없는.', time: [301.634, 303.267], eng: 'Something no one could imitate.' },
            { id: 's71', speaker: '유나', kor: '맞아요. 먹음직스러운 케이크가 실은 당시 일본 사회의 욕망과 기술력을 집약해서 보여주는 상징물이었던 셈이죠.', time: [303.334, 311.134], eng: 'That\'s right. The delicious cake was actually a symbol that concentrated the desires and technological power of Japanese society at the time.' },
            { id: 's72', speaker: '유나', kor: '긴자의 부유층만이 누릴 수 있는 아주 특별한 경험이었겠어요.', time: [311.147, 315.701], eng: 'It must have been a very special experience that only the wealthy in Ginza could enjoy.' },
            { id: 's73', speaker: '민호', kor: '그렇죠. 그런데 이 특별한 경험이 어떻게 일본 전역의 평범한 사람들이 공유하는 보편적인 문화가 될 수 있었을까요?', time: [315.734, 323.056], eng: 'Right. But how did this special experience become a universal culture shared by ordinary people all over Japan?' },
            { id: 's74', speaker: '유나', kor: '아무래도 기술의 발전과 경제 성장이 뒷받침되어야 했겠죠.', time: [323.134, 327.101], eng: 'Technological development and economic growth must have supported it.' },
            { id: 's75', speaker: '민호', kor: '네, 욕망은 이미 만들어졌으니 그걸 실현할 수단이 필요했을 테니까요.', time: [327.134, 331.541], eng: 'Yes, since the desire was already created, means to realize it were needed.' },
            { id: 's76', speaker: '유나', kor: '정확해요. 두 가지 결정적인 조건이 충족되어야 했어요.', time: [331.701, 335.460], eng: 'Exactly. Two decisive conditions had to be met.' },
            { id: 's77', speaker: '유나', kor: '첫 번째는 기술의 발전, 바로 냉장 쇼케이스의 등장이었습니다.', time: [335.734, 340.303], eng: 'The first was technological development, the emergence of the refrigerated showcase.' },
            { id: 's78', speaker: '민호', kor: '아 냉장 기술이요.', time: [340.334, 342.000], eng: 'Ah, refrigeration technology.' },
            { id: 's79', speaker: '유나', kor: '네, 1950년대에 이게 발명되면서 신선도가 생명인 생크림 케이크를 상할 걱정 없이 대량으로 진열하고 판매할 수 있게 된 거죠.', time: [342.034, 352.413], eng: 'Yes, with its invention in the 1950s, whipped cream cakes, where freshness is vital, could be displayed and sold in large quantities without worrying about spoiling.' },
            { id: 's80', speaker: '민호', kor: '생각해보니 정말 결정적이네요.', time: [352.734, 355.067], eng: 'Thinking about it, it\'s really decisive.' },
            { id: 's81', speaker: '민호', kor: '그게 없으면, 생크림 케이크는 동네 빵집에서 주문 제작하는 것 외에는 방법이 없었을 테니까요.', time: [355.167, 360.986], eng: 'Without it, there would have been no way other than ordering custom-made whipped cream cakes at local bakeries.' },
            { id: 's82', speaker: '민호', kor: '대량 생산과 유통의 전제 조건이 마련된 거군요.', time: [361.334, 364.089], eng: 'The prerequisites for mass production and distribution were established.' },
            { id: 's83', speaker: '유나', kor: '그렇죠. 그리고 두 번째는 경제적 조건입니다.', time: [364.122, 367.768], eng: 'Right. And the second is economic conditions.' },
            { id: 's84', speaker: '유나', kor: '1960년대 일본이 전후 경제 호황기를 맞으면서 탄탄한 중산층이 형성되고 사람들의 소비력이 폭발적으로 커졌어요.', time: [367.901, 377.132], eng: 'As Japan entered the post-war economic boom in the 1960s, a solid middle class was formed and people\'s purchasing power exploded.' },
            { id: 's85', speaker: '민호', kor: '아, 살 수 있는 사람들이 많아졌다는 거군요.', time: [377.301, 379.634], eng: 'Ah, so more people could buy it.' },
            { id: 's86', speaker: '유나', kor: '네, 덕분에 크리스마스 케이크는 더 이상 소수의 사치품이 아니라, 우리 집도 이 정도는 즐길 수 있다는 중산층의 상징적인 소비재로 자리 잡게 됩니다.', time: [379.668, 389.501], eng: 'Yes, thanks to that, Christmas cake was no longer a luxury for the few, but established itself as a symbolic consumer good of the middle class, saying "our family can enjoy this much".' },
            { id: 's87', speaker: '민호', kor: '욕망의 탄생, 기술의 보급, 그리고 경제력의 확대.', time: [389.601, 393.868], eng: 'Birth of desire, spread of technology, and expansion of economic power.' },
            { id: 's88', speaker: '민호', kor: '이 세 박자가 완벽하게 맞아떨어진 결과군요.', time: [394.134, 396.468], eng: 'It\'s the result of these three factors fitting together perfectly.' },
            { id: 's89', speaker: '유나', kor: '맞습니다. 일본이라는 나라 안에서 하나의 문화가 탄생하고 정착하는 과정이 명확하게 보이네요.', time: [396.500, 403.367], eng: 'Correct. The process of a culture being born and settled within the country of Japan is clearly visible.' },
            { id: 's90', speaker: '민호', kor: '자, 이렇게 일본에서 하나의 전통이 완성되었어요.', time: [403.568, 406.568], eng: 'So, a tradition was completed in Japan like this.' },
            { id: 's91', speaker: '민호', kor: '그럼 이제 이 문화가 어떻게 바다를 건너 한국으로 넘어왔을까요?', time: [406.868, 410.526], eng: 'Then how did this culture cross the sea to Korea?' },
            { id: 's92', speaker: '유나', kor: '여기서부터는 정말 흩어진 퍼즐 조각들을 세심하게 맞춰야 합니다.', time: [410.634, 414.468], eng: 'From here on, we really have to carefully piece together scattered puzzle pieces.' },
            { id: 's93', speaker: '유나', kor: '명확한 기록이 없기 때문에 각 사료는 그 시점에 이런 현상이 존재했다는 \'존재 증거\'로만 봐주시면 좋겠어요.', time: [414.634, 422.301], eng: 'Since there are no clear records, please look at each historical material only as \'evidence of existence\' that such a phenomenon existed at that time.' },
            { id: 's94', speaker: '민호', kor: '좋습니다. 가장 오래던 증거는 언제 발견되나요?', time: [422.367, 425.901], eng: 'Good. When is the oldest evidence found?' },
            { id: 's95', speaker: '유나', kor: '가장 오래된 조각은 1897년으로 거슬러 올라가요.', time: [425.968, 429.834], eng: 'The oldest piece goes back to 1897.' },
            { id: 's96', speaker: '유나', kor: '유진 벨(Eugene Bell)이라는 미국인 선교사가 고향에 보낸 편지인데요.', time: [429.901, 434.134], eng: 'It\'s a letter sent by an American missionary named Eugene Bell to his hometown.' },
            { id: 's97', speaker: '민호', kor: '1900세기 말이네요.', time: [434.234, 435.701], eng: 'It\'s the end of the 19th century.' },
            { id: 's98', speaker: '유나', kor: '네, 크리스마스 저녁 식사 메뉴를 아주 상세히 적어놨어요.', time: [435.734, 439.834], eng: 'Yes, he wrote down the Christmas dinner menu in great detail.' },
            { id: 's99', speaker: '유나', kor: '거위 요리, 샐러드와 함께 초코 케이크와 과일 케이크, 그리고 일본산 오렌지를 먹었다는 기록이 있어요.', time: [439.901, 447.567], eng: 'There is a record that they ate goose, salad, chocolate cake, fruit cake, and Japanese oranges.' },
            { id: 's100', speaker: '민호', kor: '와, 19세기 말에 이미 한반도에서 크리스마스에 케이크를 먹고 있었군요.', time: [447.668, 453.226], eng: 'Wow, they were already eating cake on Christmas on the Korean peninsula in the late 19th century.' },
            { id: 's101', speaker: '민호', kor: '물론 우리가 아는 그 케이크는 아니지만, 크리스마스에는 케이크라는 공식의 씨앗은 이미 뿌려져 있었다고 볼 수 있겠네요.', time: [453.367, 461.601], eng: 'Of course, it\'s not the cake we know, but we can see that the seeds of the formula "Christmas means cake" were already sown.' },
            { id: 's102', speaker: '유나', kor: '그렇죠. 하지만 이건 선교사라는 특정 집단 내부의 문화였겠죠.', time: [461.801, 466.768], eng: 'Right. But this was likely a culture within the specific group of missionaries.' },
            { id: 's103', speaker: '민호', kor: '맞아요. 그럼 이게 어떻게 한국 사회로 퍼져나갔을까요?', time: [466.935, 470.434], eng: 'Right. Then how did this spread to Korean society?' },
            { id: 's104', speaker: '유나', kor: '그 단서를 1930년대의 여러 목소리들에서 찾을 수 있어요.', time: [470.534, 474.934], eng: 'We can find clues in various voices from the 1930s.' },
            { id: 's105', speaker: '유나', kor: '이 시기가 되면 크리스마스가 더 이상 종교 영역에만 머물지 않고, 하나의 사회 현상이 되었음을 보여주는 증거들이 나타나기 시작합니다.', time: [475.101, 483.868], eng: 'By this time, evidence begins to appear showing that Christmas no longer stayed in the religious realm but became a social phenomenon.' },
            { id: 's106', speaker: '민호', kor: '1930년대면 일제강점기인데 어떤 목소리들이 있었죠?', time: [483.958, 488.768], eng: 'The 1930s was the Japanese colonial period, what kind of voices were there?' },
            { id: 's107', speaker: '유나', kor: '첫 번째 증거는 1930년 불교계에 우려 섞인 목소리예요.', time: [488.834, 493.134], eng: 'The first evidence is a concerned voice from the Buddhist community in 1930.' },
            { id: 's108', speaker: '유나', kor: '신문에 크리스마스가 부처님 오신 날보다 인기가 많다는 불평이 실릴 정도였죠.', time: [493.167, 498.834], eng: 'There were even complaints in newspapers that Christmas was more popular than Buddha\'s Birthday.' },
            { id: 's109', speaker: '민호', kor: '와! 불교계에서 공식적으로 반응할 정도였다면, 크리스마스가 이미 기독교인들만의 행사가 아니라 대중적으로 상당히 확산되고 있었다는 강력한 방증이 되겠네요.', time: [498.901, 509.167], eng: 'Wow! If the Buddhist community officially responded, it would be strong corroboration that Christmas was already spreading widely to the public, not just as an event for Christians.' },
            { id: 's110', speaker: '유나', kor: '바로 그거죠.', time: [509.201, 510.000], eng: 'Exactly.' },
            { id: 's111', speaker: '유나', kor: '두 번째 증거는 1933년 지식인 윤치호의 일기입니다.', time: [510.201, 514.601], eng: 'The second evidence is the diary of intellectual Yun Chi-ho from 1933.' },
            { id: 's112', speaker: '유나', kor: '그는 여성들이 크리스마스를 쇼핑의 핑계로 삼는다고 비판적인 시각으로 기록했어요.', time: [514.834, 520.267], eng: 'He recorded with a critical view that women use Christmas as an excuse for shopping.' },
            { id: 's113', speaker: '민호', kor: '상업화가 진행되고 있었다는 뜻이군요.', time: [520.367, 522.501], eng: 'It means commercialization was progressing.' },
            { id: 's114', speaker: '유나', kor: '네, 그리고 1936년 매일신보 기사에서는 아예 크리스마스가 기독교인에게서 상인에게로 넘어갔다고 풍자하기도 합니다.', time: [522.534, 531.234], eng: 'Yes, and a 1936 article in Maeil Sinbo even satirized that Christmas had passed from Christians to merchants.' },
            { id: 's115', speaker: '민호', kor: '다들 상당히 비판적인 목소리들이네요.', time: [531.300, 533.768], eng: 'They are all quite critical voices.' },
            { id: 's116', speaker: '유나', kor: '그렇죠? 그런데 이 비판들이 역설적으로 무엇을 증명하는 걸까요?', time: [533.868, 538.560], eng: 'Right? But what do these criticisms paradoxically prove?' },
            { id: 's117', speaker: '민호', kor: '음...비판의 대상이 될 만큼 이미 크리스마스라는 문화가 사회에 깊숙이 퍼져 있었다는 뜻이 아닐까요?', time: [538.634, 545.801], eng: 'Hmm... Doesn\'t it mean that the culture of Christmas was already deeply spread in society enough to be a target of criticism?' },
            { id: 's118', speaker: '유나', kor: '정확해요.', time: [545.868, 546.601], eng: 'Exactly.' },
            { id: 's119', speaker: '유나', kor: '비판은 그 현상의 확산을 가장 확실하게 증명하는 증거가 되기도 하죠.', time: [546.801, 551.668], eng: 'Criticism can be the surest evidence proving the spread of the phenomenon.' },
            { id: 's120', speaker: '유나', kor: '여기서 역사학자 에릭 홉스봄(Eric Hobsbawm)이 말한 ‘만들어진 전통’이라는 개념을 떠올려 보면 아주 흥미로워요.', time: [551.868, 558.543], eng: 'Here, it\'s very interesting to recall the concept of \'invented tradition\' by historian Eric Hobsbawm.' },
            { id: 's121', speaker: '민호', kor: '우리가 아주 오래되었다고 믿는 전통 중 상당수가 사실은 비교적 최근에 특정 목적을 위해 만들어진 것이라고 주장하는 그 개념이요?', time: [558.576, 568.067], eng: 'The concept that claims many of the traditions we believe to be very old were actually created relatively recently for specific purposes?' },
            { id: 's122', speaker: '유나', kor: '맞습니다.', time: [568.134, 568.935], eng: 'That\'s correct.' },
            { id: 's123', speaker: '유나', kor: '크리스마스 문화의 확산도 그와 비슷한 맥락으로 볼 수 있어요.', time: [569.167, 573.000], eng: 'The spread of Christmas culture can be seen in a similar context.' },
            { id: 's124', speaker: '유나', kor: '종교적 의미로 시작된 의례가 제조업자나 상인들의 상업적 이해관계와 맞물리면서 훨씬 더 빠르고 넓게 그리고 세속적인 형태로 확산되는 과정을 보여주는 거죠.', time: [573.334, 583.901], eng: 'It shows the process where a ritual started with religious meaning interlocks with the commercial interests of manufacturers or merchants, spreading much faster, wider, and in a secular form.' },
            { id: 's125', speaker: '민호', kor: '1930년대의 비판들이 바로 그 과정을 생생하게 증언하고 있는 셈이군요.', time: [584.034, 588.834], eng: 'The criticisms of the 1930s are vividly testifying to that process.' },
            { id: 's126', speaker: '유나', kor: '그렇죠. 그렇다면 우리가 찾는 딸기 생크림 케이크, 즉 크리스마스 케이크라는 구체적인 단어는 대체 언제 처음으로 등장할까요?', time: [588.935, 598.801], eng: 'Right. Then when does the specific word strawberry whipped cream cake, or Christmas cake, first appear?' },
            { id: 's127', speaker: '민호', kor: '드디어 그 단어가 나오는군요.', time: [598.868, 600.634], eng: 'Finally that word comes out.' },
            { id: 's128', speaker: '유나', kor: '네, 현재까지 확인된 바로는 1952년 12월 21일자, 동아일보 기사에서 처음 등장해요.', time: [600.701, 608.101], eng: 'Yes, as far as confirmed, it first appears in a Dong-A Ilbo article on December 21, 1952.' },
            { id: 's129', speaker: '유나', kor: '그런데 그 내용이 정말 드라마틱합니다.', time: [608.534, 611.134], eng: 'But the content is really dramatic.' },
            { id: 's130', speaker: '민호', kor: '1952년이면 한국전쟁이 한창일 때잖아요.', time: [611.201, 615.034], eng: '1952 was when the Korean War was in full swing.' },
            { id: 's131', speaker: '민호', kor: '그런 상황에서 케이크라니 상상이 잘 안 되는데요.', time: [615.201, 618.367], eng: 'I can\'t really imagine cake in such a situation.' },
            { id: 's132', speaker: '유나', kor: '바로 그 점이 이 증거를 결정적으로 만들어요.', time: [618.617, 621.784], eng: 'That very point makes this evidence decisive.' },
            { id: 's133', speaker: '유나', kor: '기사의 논조는 당연히 비판적입니다.', time: [621.784, 624.701], eng: 'The tone of the article is naturally critical.' },
            { id: 's134', speaker: '유나', kor: '전쟁 중인데도 일부 부유층이 값비싼 외래품이나 크리스마스 케이크 같은 사치품을 사들인다고 지적하는 내용이거든요.', time: [625.000, 632.935], eng: 'It points out that despite the war, some wealthy people are buying expensive foreign goods or luxury items like Christmas cakes.' },
            { id: 's135', speaker: '민호', kor: '와!', time: [632.968, 633.532], eng: 'Wow!' },
            { id: 's136', speaker: '유나', kor: '심지어 기사에는 이런 묘사도 등장해요.', time: [633.568, 636.234], eng: 'There is even this description in the article.' },
            { id: 's137', speaker: '유나', kor: '"시골 할머니들이 저것도 먹는 것이냐며 경탄하는 크리스마스 케이크. "', time: [636.634, 641.167], eng: '"Christmas cakes that countryside grandmothers marvel at, asking if they are edible."' },
            { id: 's138', speaker: '민호', kor: '와, 전쟁의 참상 속에서 누군가는 케이크를 사 먹는다고 비판하는 기사가 크리스마스 케이크의 존재를 증명하는 최초의 증거라니 정말 역설적이네요.', time: [641.201, 651.301], eng: 'Wow, it\'s truly paradoxical that an article criticizing someone for buying and eating cake amidst the horrors of war is the first evidence proving the existence of Christmas cake.' },
            { id: 's139', speaker: '유나', kor: '그렇죠.', time: [651.334, 652.034], eng: 'Right.' },
            { id: 's140', speaker: '민호', kor: '이건 단순히 케이크가 존재했다는 사실 이상의 것을 말해주는 것 같아요.', time: [652.134, 656.134], eng: 'This seems to say more than just the fact that the cake existed.' },
            { id: 's141', speaker: '유나', kor: '어떤 점이죠?', time: [656.167, 656.935], eng: 'What point?' },
            { id: 's142', speaker: '민호', kor: '이 기사가 쓰였다는 것 자체가 당시 서울에서 크리스마스 케이크라는 상품이 사회적 비판의 대상이 될 만큼 이미 널리 알려지고 소비되고 있었다는 뜻이잖아요.', time: [656.968, 665.834], eng: 'The fact that this article was written means that the product called Christmas cake was already widely known and consumed in Seoul at the time enough to be a subject of social criticism.' },
            { id: 's143', speaker: '민호', kor: '그게 없었다면 비판도 불가능했을 테니까요.', time: [666.234, 668.568], eng: 'Without that, criticism would have been impossible.' },
            { id: 's144', speaker: '유나', kor: '정말 예리한 분석이에요.', time: [668.701, 670.601], eng: 'That\'s a really sharp analysis.' },
            { id: 's145', speaker: '유나', kor: '전쟁이라는 극한 상황이 오히려 그 존재감을 더 뚜렷하게 증명해주는 셈이네요.', time: [670.701, 676.534], eng: 'The extreme situation of war rather proves its presence more clearly.' },
            { id: 's146', speaker: '민호', kor: '맞아요. 이 기사는 크리스마스 케이크 소비가 우리 사회에 이미 꽤 퍼져 있었다는 가장 강력한 증거인 셈이죠.', time: [676.634, 684.568], eng: 'That\'s right. This article is the strongest evidence that Christmas cake consumption was already quite widespread in our society.' },
            { id: 's147', speaker: '유나', kor: '그러고 보면 일본은 기독교 인구가 전체의 1% 남짓인데도 크리스마스 케이크 시장이 엄청나게 크잖아요.', time: [684.801, 692.634], eng: 'Come to think of it, Japan has a huge Christmas cake market even though the Christian population is only about 1%.' },
            { id: 's148', speaker: '유나', kor: '한국도 그렇고요.', time: [692.801, 693.701], eng: 'Korea too.' },
            { id: 's149', speaker: '민호', kor: '맞아요. 그건 크리스마스가 더 이상 특정 종교의 기념일이 아니라 종교와 상관없이 모두가 즐기는 하나의 문화 현상이자 중요한 소비 시즌이 되었음을 보여주는 거죠.', time: [693.861, 704.935], eng: 'Right. That shows that Christmas is no longer a holiday for a specific religion, but a cultural phenomenon and important consumption season enjoyed by everyone regardless of religion.' },
            { id: 's150', speaker: '유나', kor: '그리고 케이크는 그 현상의 중심에 있는 가장 상징적인 상품이고요.', time: [705.167, 709.534], eng: 'And cake is the most symbolic product at the center of that phenomenon.' },
            { id: 's151', speaker: '민호', kor: '그렇죠.', time: [709.634, 710.134], eng: 'Right.' },
            { id: 's152', speaker: '유나', kor: '자, 그럼 지금까지 우리가 모은 조각들을 테이블 위에 전부 펼쳐 놓고, 전체 그림을 한번 완성해 볼까요?', time: [710.201, 717.067], eng: 'Now, shall we spread all the pieces we\'ve gathered on the table and complete the whole picture?' },
            { id: 's153', speaker: '유나', kor: '한국의 크리스마스 케이크 문화는 크게 3단계의 \'변용된 문화 동화\' 과정을 거쳤다고 볼 수 있겠네요.', time: [717.134, 724.000], eng: 'The Korean Christmas cake culture can be seen as having gone through three stages of \'transformed cultural assimilation\'.' },
            { id: 's154', speaker: '민호', kor: '첫 단계는 1920년대 일본에서 서양의 케이크를 근대성의 상징으로 받아들인 시기였죠.', time: [724.034, 731.134], eng: 'The first stage was when Western cakes were accepted as a symbol of modernity in Japan in the 1920s.' },
            { id: 's155', speaker: '민호', kor: '단순한 음식이 아니라 시대정신을 담은 매개체로요.', time: [731.167, 735.000], eng: 'Not as simple food, but as a medium containing the zeitgeist.' },
            { id: 's156', speaker: '유나', kor: '네, 그리고 2단계는 1922년 이후 단순한 모방을 넘어 스펀지 케이크와 생크림 딸기라는 조합의 독자적인 일본식 케이크로 변형되는 과정이고요.', time: [735.067, 746.801], eng: 'Yes, and the second stage is the process of transforming into a unique Japanese-style cake with a combination of sponge cake, whipped cream, and strawberries beyond simple imitation after 1922.' },
            { id: 's157', speaker: '민호', kor: '여기에 기술과 경제 성장이 더해져 대중문화로 자리 잡았고요.', time: [746.834, 750.901], eng: 'Added to this were technology and economic growth, establishing it as popular culture.' },
            { id: 's158', speaker: '유나', kor: '그리고 마지막 3단계가 이 변용된 문화가 한국으로 들어와 우리만의 맥락 속에서 자리 잡는 과정이군요.', time: [750.935, 757.568], eng: 'And the last third stage is the process of this transformed culture entering Korea and settling within our own context.' },
            { id: 's159', speaker: '민호', kor: '네, 1950년대 한국전쟁 중에도 존재했고, 이후 한국의 근대화 상업화 과정 속에서 때로는 비판의 대상이 되면서도 꾸준히 수용되고 확산되어 오늘날 우리가 아는 당연한 전통이 된 거고요.', time: [757.601, 771.434], eng: 'Yes, it existed even during the Korean War in the 1950s, and later in the process of Korea\'s modernization and commercialization, it was consistently accepted and spread, sometimes becoming a target of criticism, becoming the natural tradition we know today.' },
            { id: 's160', speaker: '유나', kor: '맞습니다. 결국 한순간에 생겨난 게 아니라 거의 100년에 가까운 시간 동안 일본과 한국이라는 각기 다른 시공간 속에서 여러 사회적, 기술적, 경제적 요인이 복잡하게 결합해서 구성된 문화 현상인 거예요.', time: [771.601, 787.201], eng: 'Correct. In the end, it is a cultural phenomenon constructed by the complex combination of various social, technological, and economic factors in the different time and space of Japan and Korea for nearly 100 years, not created in an instant.' },
            { id: 's161', speaker: '민호', kor: '에릭 홉스봄(Eric Hobsbawm)의 \'만들어진 전통\'이라는 말이 다시 한번 실감나네요.', time: [787.234, 792.234], eng: 'Eric Hobsbawm\'s term \'invented tradition\' feels real once again.' },
            { id: 's162', speaker: '민호', kor: '우리가 아주 오래되었다고 믿는 전통 중 상당수는 사실 비교적 최근에 만들어졌다는 것.', time: [792.267, 798.768], eng: 'That many of the traditions we believe to be very old were actually created relatively recently.' },
            { id: 's163', speaker: '민호', kor: '크리스마스 케이크야말로 그 대표적인 사례라고 할 수 있겠어요.', time: [798.968, 802.503], eng: 'Christmas cake can be said to be a representative example.' },
            { id: 's164', speaker: '유나', kor: '그렇죠. 우리가 원래 그랬다고 생각하는 것들 중 상당수는 사실 누군가에 의해 어떤 시대적 배경 속에서 만들어지고 선택된 결과물인 경우가 많아요.', time: [802.536, 813.301], eng: 'Right. Many of the things we think were originally so are often the result of being created and selected by someone within a certain historical background.' },
            { id: 's165', speaker: '민호', kor: '그렇다면 문득 이런 질문이 드네요.', time: [813.334, 815.776], eng: 'Then suddenly this question comes to mind.' },
            { id: 's166', speaker: '민호', kor: '이 케이크는 이제 누구의 것이라고 해야 할까요?', time: [815.801, 818.701], eng: 'Whose cake should we say this is now?' },
            { id: 's167', speaker: '민호', kor: '서양에서 시작됐으니 서양 건가요?', time: [818.734, 821.101], eng: 'Is it Western since it started in the West?' },
            { id: 's168', speaker: '민호', kor: '지금의 형태로 완성한 일본 건가요?', time: [821.134, 823.834], eng: 'Is it Japanese since they completed it in its current form?' },
            { id: 's169', speaker: '민호', kor: '아니면 이걸 100년 가까이 우리만의 방식으로 즐겨온 한국 건가요?', time: [823.868, 828.334], eng: 'Or is it Korean since we have enjoyed it in our own way for nearly 100 years?' },
            { id: 's170', speaker: '유나', kor: '정말 좋은 질문이에요.', time: [828.367, 830.167], eng: 'That\'s a really good question.' },
            { id: 's171', speaker: '유나', kor: '어쩌면 이젠 더 이상 특정 누군가의 것이 아니면서 동시에 이 문화를 각자의 방식으로 즐기는 모두의 것이라고 할 수 있지 않을까요?', time: [830.201, 839.250], eng: 'Maybe we can say it\'s no longer anyone\'s specifically, but at the same time everyone\'s who enjoys this culture in their own way?' },
            { id: 's172', speaker: '민호', kor: '기원을 따지는 것보다 더 중요한 게 있을 수 있겠군요.', time: [839.267, 842.768], eng: 'There might be something more important than tracing the origin.' },

                document.body

        const LearnView = ({ updateProgress, themeColor, autoScroll, showVocab, playbackRate }) => {
            const [player, setPlayer] = useState(null);
            const playerRef = useRef(null); 
            const [currentTime, setCurrentTime] = useState(0);
            const [activeLine, setActiveLine] = useState(null);
            const [translations, setTranslations] = useState({});
            const [popup, setPopup] = useState({ show: false, fixed: false, data: null, x: 0, y: 0 });
            
            const [activeVocabTerm, setActiveVocabTerm] = useState(null);
            const sidebarVocabRefs = useRef({});

            const scriptRefs = useRef({});
            const intervalRef = useRef(null);

            useEffect(() => {
                const loadVideo = () => {
                    if (window.YT && window.YT.Player) {
                        new window.YT.Player('youtube-player', {
                            videoId: 'YoIbPhMETD8',
                            width: '100%',
                            height: '100%',
                            playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0 },
                            events: {
                                'onReady': (event) => {
                                    playerRef.current = event.target;
                                    setPlayer(event.target);
                                },
                                'onStateChange': (event) => {
                                    if (event.data === window.YT.PlayerState.PLAYING) {
                                        startInterval();
                                        updateProgress('learn');
                                    } else stopInterval();
                                }
                            }
                        });
                    }
                };
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = "https://www.youtube.com/iframe_api";
                    const firstScriptTag = document.getElementsByTagName('script')[0];
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                    window.onYouTubeIframeAPIReady = loadVideo;
                } else {
                    loadVideo();
                }
                return () => stopInterval();
            }, []);

            useEffect(() => {
                if (player && player.setPlaybackRate) {
                    player.setPlaybackRate(playbackRate);
                }
            }, [playbackRate, player]);

            const handleGlobalClick = useCallback(() => {
                if (popup.fixed) {
                    setPopup(prev => ({ ...prev, show: false, fixed: false }));
                }
            }, [popup.fixed]);

            useEffect(() => {
                if (popup.fixed) {
                    window.addEventListener('click', handleGlobalClick);
                }
                return () => window.removeEventListener('click', handleGlobalClick);
            }, [popup.fixed, handleGlobalClick]);

            const startInterval = () => {
                stopInterval();
                intervalRef.current = setInterval(() => {
                    const p = playerRef.current;
                    if (p && p.getCurrentTime) {
                        const time = p.getCurrentTime();
                        setCurrentTime(time);
                        const currentLine = SCRIPT_DATA.find(line => time >= line.time[0] && time < line.time[1]);
                        if (currentLine) setActiveLine(currentLine.id);
                    }
                }, 200);
            };
            const stopInterval = () => clearInterval(intervalRef.current);

            useEffect(() => {
                if (popup.show) return;
                if (activeLine && autoScroll && scriptRefs.current[activeLine]) {
                    scriptRefs.current[activeLine].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [activeLine, autoScroll, popup.show]);

            const handleLineClick = (time) => {
                if (player) {
                    player.seekTo(time);
                    player.playVideo();
                }
            };

            const toggleTranslation = (id) => {
                setTranslations(prev => ({...prev, [id]: !prev[id]}));
            };

            const scrollToVocab = (term) => {
                const element = sidebarVocabRefs.current[term];
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            const handleVocabEnter = (e, wordData) => {
                if (popup.fixed) return; 
                const rect = e.target.getBoundingClientRect();
                setPopup({
                    show: true,
                    fixed: false,
                    data: wordData,
                    x: rect.left + rect.width / 2, 
                    y: rect.bottom
                });

                if (showVocab) {
                    setActiveVocabTerm(wordData.term);
                    scrollToVocab(wordData.term);
                }
            };

            const handleVocabLeave = () => {
                if (popup.fixed) return;
                setPopup(prev => ({ ...prev, show: false }));
            };

            const handleVocabClick = (e, wordData) => {
                e.stopPropagation(); 
                if (popup.fixed && popup.data && popup.data.term === wordData.term) {
                    setPopup(prev => ({ ...prev, show: false, fixed: false }));
                    return;
                }
                const rect = e.target.getBoundingClientRect();
                setPopup({
                    show: true,
                    fixed: true,
                    data: wordData,
                    x: rect.left + rect.width / 2,
                    y: rect.bottom
                });

                if (showVocab) {
                    setActiveVocabTerm(wordData.term);
                    scrollToVocab(wordData.term);
                }
            };

            // [Optimized] Pre-compute vocab map and regex pattern using useMemo
            // This ensures variants are processed once and reflected in the search logic.
            const { termMap, vocabRegex } = useMemo(() => {
                const map = {};
                VOCAB_DATA.forEach(vocab => {
                    map[vocab.term] = vocab;
                    if (vocab.variants) {
                        vocab.variants.forEach(v => map[v] = vocab);
                    }
                });
                // Sort by length descending to match longest phrases first (e.g. "결정 회피" over "회피")
                const patterns = Object.keys(map).sort((a, b) => b.length - a.length);
                if (patterns.length === 0) return { termMap: map, vocabRegex: null };

                // Escape special characters for regex
                const regex = new RegExp(`(${patterns.map(p => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'g');
                return { termMap: map, vocabRegex: regex };
            }, []); // Empty dependency array since VOCAB_DATA is static

            const renderTextWithVocab = (text) => {
                if (!vocabRegex) return [text];
                
                const parts = text.split(vocabRegex);
                
                return parts.map((part, index) => {
                    if (termMap[part]) {
                        const vocab = termMap[part];
                        const isActive = (popup.show && popup.data && popup.data.term === vocab.term) || (showVocab && activeVocabTerm === vocab.term);
                        return (
                            <span 
                                key={index}
                                className={`cursor-pointer border-b-2 transition-all duration-200 font-bold inline-block leading-tight
                                    ${isActive 
                                        ? `text-${themeColor}-700 border-${themeColor}-500 bg-${themeColor}-100 rounded-sm px-0.5 mx-0.5` 
                                        : `text-slate-900 border-dashed border-slate-400 hover:text-${themeColor}-600 hover:border-${themeColor}-400 hover:bg-${themeColor}-50`
                                    }`}
                                onMouseEnter={(e) => handleVocabEnter(e, vocab)}
                                onMouseLeave={handleVocabLeave}
                                onClick={(e) => handleVocabClick(e, vocab)}
                            >
                                {part}
                            </span>
                        );
                    }
                    return part;
                });
            };

            return (
                <div className="flex h-[calc(100vh-4rem)] gap-4 animate-fade-in overflow-hidden relative w-full mx-auto">
                    <VocabPopup popup={popup} themeColor={themeColor} onGlobalClick={handleGlobalClick} />

                    <div className={`bg-black rounded-xl overflow-hidden shadow-lg transition-all duration-300 ${showVocab ? 'w-5/12' : 'flex-1'}`}>
                            <div id="youtube-player" className="w-full h-full"></div>
                    </div>

                    <div 
                        className={`flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm transition-all duration-300 ${showVocab ? 'w-4/12' : 'w-5/12'}`}
                        style={{ fontSize: 'calc(var(--base-size) * 1.3)' }}
                    >
                        <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 rounded-xl">
                            {SCRIPT_DATA.map(line => {
                                const isActive = activeLine === line.id;
                                return (
                                    <div key={line.id} ref={el => scriptRefs.current[line.id] = el} className="flex flex-col">
                                        <div className="flex items-center gap-2 mb-1 ml-1">
                                            <span className="text-[0.75em] font-bold text-slate-600">{line.speaker}</span>
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); handleLineClick(line.time[0]); }} 
                                                className={`text-[0.625em] text-${themeColor}-600 hover:underline flex items-center gap-0.5`}
                                            >
                                                <PlayIconLine className="w-3 h-3 fill-current" /> 재생 (Play)
                                            </button>
                                        </div>
                                        <div 
                                            onClick={() => handleLineClick(line.time[0])}
                                            className={`p-5 rounded-2xl border transition-all duration-300 cursor-pointer relative group ${
                                                isActive 
                                                ? 'bg-yellow-100 border-yellow-400 shadow-md ring-1 ring-yellow-200 scale-[1.01]' 
                                                : 'bg-white border-slate-200 hover:border-slate-300'
                                            }`}
                                        >
                                            <p className="text-[1.375em] text-slate-800 leading-relaxed font-medium">
                                                {renderTextWithVocab(line.kor)}
                                            </p>
                                            
                                            <div className="my-3 border-t border-dashed border-slate-200"></div>
                                            {translations[line.id] ? (
                                                <p className="text-[1.125em] text-slate-500 animate-fade-in">{line.eng}</p>
                                            ) : (
                                                <TranslateButton 
                                                    onClick={() => toggleTranslation(line.id)}
                                                    isShowing={false} 
                                                />
                                            )}
                                            {translations[line.id] && (
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); toggleTranslation(line.id); }}
                                                    className="absolute bottom-4 right-4 text-[0.625em] text-slate-300 hover:text-slate-500"
                                                >
                                                    접기
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                            <div className="h-32"></div>
                        </div>
                    </div>

                    {showVocab && (
                        <div className="w-3/12 flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm animate-fade-in">
                            <div className="p-4 border-b border-slate-100 flex items-center gap-2 bg-white rounded-t-xl">
                                <VocabIcon className={`w-5 h-5 text-${themeColor}-600`} />

        const QuizSentence = ({ quiz, onAttempt, themeColor, onShuffle }) => {
            const [userInput, setUserInput] = useState('');
            const [result, setResult] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [showTranslation, setShowTranslation] = useState(false);

            const handleCheck = () => {
                const isCorrect = userInput.trim() === quiz.correct_word;
                setResult(isCorrect ? 'correct' : 'incorrect');
                setShowHint(false);
                
                if (onAttempt) {
                    onAttempt(quiz.id, isCorrect);
                }
                
                if (onShuffle) {
                    onShuffle();
                }
            };

            const handleShowAnswer = () => {
                setUserInput(quiz.correct_word);
                setResult(null); 
                setShowHint(false);
                
                if (onShuffle) {
                    onShuffle();
                }
            };

            const safeWidth = quiz.correct_word ? Math.max(80, quiz.correct_word.length * 20) : 80;

            const getCheckButtonClass = () => {
                const baseClass = "px-3 py-1.5 rounded-lg text-[0.75em] font-bold transition-colors shadow-sm";
                if (result === 'correct') return `${baseClass} bg-green-50 text-green-900 hover:bg-green-100`;
                if (result === 'incorrect') return `${baseClass} bg-red-50 text-red-900 hover:bg-red-100`;
                return `${baseClass} bg-yellow-50 text-yellow-900 hover:bg-yellow-100`;
            };

            const translationText = (result === 'correct' && quiz.translation_correct) 
                ? quiz.translation_correct

            return (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">

                        <span>{quiz.sentence_pre}</span>
                        <input 
                            type="text" 
                            value={userInput} 
                            onChange={(e) => { setUserInput(e.target.value); setResult(null); }}
                            className={`mx-1 px-3 py-0.5 border-b-2 font-bold text-center focus:outline-none transition-colors bg-transparent
                                ${result === 'correct' 
                                    ? 'border-green-500 text-green-700' 
                                    : result === 'incorrect' 
                                        ? 'border-red-500 text-red-700' 
                                        : `border-slate-300 text-${themeColor}-600 focus:border-${themeColor}-500`

                    {showTranslation && (
                        <p className="mt-2 mb-4 text-slate-600 text-[0.875em] font-medium pl-6 animate-fade-in border-l-2 border-slate-200">

                        <div className="mb-4 px-4 py-2 bg-yellow-50 text-yellow-800 rounded-lg text-[0.875em] font-medium border border-yellow-200">
                            💡 힌트: {quiz.hint}

                    )}

                            정답 보기

                        <button onClick={() => setShowHint(!showHint)} className="px-3 py-1.5 bg-slate-50 text-slate-600 rounded-lg text-[0.75em] font-bold hover:bg-slate-100 transition-colors">

                    </div>

        const QuizView = ({ updateProgress, themeColor }) => {

            // [Added] Calculate real-time score for display
            const totalQuestions = QUIZ_LIST.length;
            const correctCount = Object.values(attempts).filter(v => v).length;
            const currentScore = Math.round((correctCount / totalQuestions) * 100);

            useEffect(() => {
                const totalAttempts = Object.keys(attempts).length;
                if (totalAttempts === 0) return; 

                // Sync with parent progress
                updateProgress('quiz', currentScore);
            }, [attempts, currentScore, updateProgress]); 

            const handleAttempt = (quizId, isCorrect) => {
                setAttempts(prev => {
                    // [Logic Check] Only record the first attempt
                    // If quizId already exists in history, do not update (ignore subsequent attempts)
                    if (prev.hasOwnProperty(quizId)) return prev;
                    
                    const newAttempts = { ...prev, [quizId]: isCorrect };
                    return newAttempts;
                });
            };

            const shuffleChoices = useCallback(() => {
                setShuffledChoices(prev => {
                    const newArray = [...prev];
                    for (let i = newArray.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];

                    return newArray;

            }, []);

            return (

                                <div className="flex flex-wrap lg:flex-col gap-2 justify-center">

                                        <div key={idx} className={`bg-white px-2 py-2 rounded-lg text-center text-[0.875em] font-bold text-slate-600 shadow-sm border border-slate-100 hover:border-${themeColor}-400 hover:text-${themeColor}-600 transition-colors cursor-default select-all`}>
                                            {choice}
                                        </div>

                                    themeColor={themeColor}

                        </div>
                    </div>
                </div>
            );
        };

        const callGeminiWithBackoff = async (payload) => {
            const apiKey = ""; // Runtime provided
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000, 8000, 16000];
            
            for (let i = 0; i <= delays.length; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        if (response.status === 429 || response.status >= 500) {
                            throw new Error(`Server error: ${response.status}`);
                        }
                        throw new Error(`API error: ${response.statusText}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === delays.length) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        const FeedbackSection = ({ value, onChange, placeholder, question, keyPhrases, themeColor }) => {
            const [feedback, setFeedback] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);

            const checkSentence = async () => {
                if (!value || value.trim() === '') {
                    setError("문장을 입력해야 피드백을 받을 수 있어요.");
                    setFeedback(null);
                    return;
                }
                setIsLoading(true);
                setError(null);
                setFeedback(null);

                const systemPrompt = `You are an advanced Korean language tutor AI for A2 level learners. Analyze the user's sentence in response to a specific question.
The user's answer is in Korean.
Your goal is to provide feedback in ENGLISH to help the learner understand.

Instructions:
1. "feedback_message_eng": Write the feedback status or brief comment in English.
2. "explanation_eng": Explain the grammar or vocabulary mistake in English. You can quote Korean words but the explanation must be in English.
3. "corrected_sentence": Provide the natural and correct Korean sentence.
4. "relevance_feedback_eng": If the answer is irrelevant, explain why in English.

Question: "${question}"
User's Answer: "${value}"

Your response MUST be a JSON object with the specified schema.`;
                const payload = {
                    contents: [{ role: "user", parts: [{ text: systemPrompt }, { text: `Please provide feedback on my answer.\n\nQuestion: "${question}"\nUser's Answer: "${value}"` }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: { type: "OBJECT", properties: { "is_relevant": { "type": "BOOLEAN" }, "relevance_feedback_eng": { "type": "STRING", "nullable": true }, "is_correct": { "type": "BOOLEAN", "nullable": true }, "feedback_message_eng": { "type": "STRING", "nullable": true }, "corrected_sentence": { "type": "STRING", "nullable": true }, "explanation_eng": { "type": "STRING", "nullable": true }, "alternative_expressions": { "type": "ARRAY", "items": { "type": "OBJECT", "properties": { "expression_kor": { "type": "STRING" }, "expression_eng": { "type": "STRING" } }, "required": ["expression_kor", "expression_eng"] } } }, "required": ["is_relevant"] }
                    }
                };

                try {
                    const result = await callGeminiWithBackoff(payload);
                    if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                        const parsedJson = JSON.parse(result.candidates[0].content.parts[0].text);
                        setFeedback(parsedJson);
                    } else {
                        setError("AI의 응답을 처리하는 데 문제가 발생했어요.");
                    }
                } catch (err) {
                    console.error("Error checking sentence:", err);
                    setError("문장 검사에 실패했어요. 다시 시도해 주세요.");
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div>
                    {keyPhrases}
                    <div>
                        <h4 className="font-bold text-slate-900 mb-3 text-[1em]">핵심 표현을 사용해서 질문에 대답해 보세요.</h4>
                        <textarea 
                            value={value} 
                            onChange={onChange} 
                            placeholder={placeholder}
                            className={`w-full p-4 rounded-xl border border-slate-200 focus:border-${themeColor}-500 focus:ring-1 focus:ring-${themeColor}-500 outline-none min-h-[120px] resize-none text-[1em] text-slate-800 placeholder-slate-400 mb-3`}
                        ></textarea>
                        
                        <button
                            onClick={checkSentence}
                            disabled={!value.trim() || isLoading}
                            className={`flex items-center gap-2 px-5 py-[6px] text-[0.75em] leading-[12px] rounded-xl font-bold transition-all shadow-sm ${
                                !value.trim() || isLoading
                                ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                                : 'bg-indigo-600 text-white hover:bg-indigo-700 hover:shadow-md'
                            }`}
                        >
                            {isLoading ? (
                                <>
                                    <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                    <span>분석 중... (Analyzing)</span>
                                </>
                            ) : (
                                <>
                                    <SparklesIcon className="w-5 h-5" />
                                    <span>AI Feedback (피드백 받기)</span>
                                </>
                            )}
                        </button>

                        {error && (
                            <div className="mt-4 p-4 bg-red-50 text-red-600 rounded-xl border border-red-200 text-[0.875em] font-medium animate-fade-in">
                                {error}
                            </div>

                            <div className={`mt-6 rounded-2xl p-6 border animate-fade-in ${feedback.is_correct ? `bg-${themeColor}-50 border-${themeColor}-200` : 'bg-yellow-50 border-yellow-200'}`}>
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="text-2xl">🤖</span>
                                    <h4 className="font-extrabold text-slate-900 text-[1.125em]">AI Tutor Feedback</h4>
                                </div>
                                
                                <div className="mb-4">
                                    <span className={`font-black text-[0.875em] px-3 py-1 rounded-full bg-white border shadow-sm ${feedback.is_correct ? `text-${themeColor}-600 border-${themeColor}-200` : 'text-yellow-600 border-yellow-200'}`}>
                                        {feedback.is_correct ? '🎉 Great Job!' : '⚠️ Needs Improvement'}
                                    </span>
                                </div>

                                <div className="space-y-4">
                                    {feedback.feedback_message_eng && (
                                        <div className="flex flex-col sm:flex-row gap-1 sm:gap-4">
                                            <span className="font-bold text-slate-500 text-[0.875em] sm:w-24 shrink-0">Feedback</span>
                                            <p className="text-slate-800 text-[0.875em] font-medium leading-relaxed">{feedback.feedback_message_eng}</p>
                                        </div>
                                    )}
                                    {feedback.explanation_eng && (
                                        <div className="flex flex-col sm:flex-row gap-1 sm:gap-4">
                                            <span className="font-bold text-slate-500 text-[0.875em] sm:w-24 shrink-0">Explanation</span>
                                            <p className="text-slate-800 text-[0.875em] font-medium leading-relaxed">{feedback.explanation_eng}</p>
                                        </div>
                                    )}
                                    {feedback.corrected_sentence && (
                                        <div className="flex flex-col sm:flex-row gap-1 sm:gap-4">
                                            <span className="font-bold text-slate-500 text-[0.875em] sm:w-24 shrink-0">Correction</span>
                                            <p className="text-slate-900 text-[1.125em] font-black leading-relaxed">{feedback.corrected_sentence}</p>
                                        </div>

                                    {!feedback.is_relevant && (
                                        <div className="flex flex-col sm:flex-row gap-1 sm:gap-4">
                                            <span className="font-bold text-slate-500 text-[0.875em] sm:w-24 shrink-0">Relevance</span>
                                            <p className="text-slate-800 text-[0.875em] font-medium leading-relaxed">{feedback.relevance_feedback_eng || "This answer doesn't seem relevant to the question."}</p>
                                        </div>

                            </div>

        const DiscussView = ({ updateProgress, themeColor }) => {

            return (

                    <div className="flex items-center gap-4 mb-8">

                    </div>

                    <div className={`mb-8 p-4 rounded-2xl bg-${themeColor}-50 border border-${themeColor}-100`}>
                        <div className="text-slate-800 text-[0.875em] font-medium leading-relaxed">
                            <p>AI Feedback은 Gemini 웹페이지에서만 작용하기 때문에 Github 웹페이지에서 사용할 수 없어요.</p>
                            
                            <p className="flex flex-wrap items-center gap-1 mt-2">
                                AI Feedback 기능을 사용하기 원할 경우, 다음 링크를 클릭하세요: 
                                <a 
                                    href="https://gemini.google.com/share/1334d9620c23" 
                                    target="_blank" 
                                    rel="noopener noreferrer" 
                                    className={`font-bold text-${themeColor}-600 hover:underline inline-flex items-center gap-0.5`}

                                    Gemini AI Feedback

                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 md:p-10">

                                    question={q.questionKor}
                                    value={answers[q.id] || ''}
                                    onChange={(e) => setAnswers(prev => ({...prev, [q.id]: e.target.value}))}
                                    placeholder="여기에 답변을 입력하세요 (Type your response here)"
                                    keyPhrases={
                                        q.vocab && q.vocab.length > 0 ? (
                                            <div className="mb-10 space-y-4">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-red-500 text-lg">📍</span>
                                                    <h4 className="font-bold text-slate-900 text-[1.125em]">핵심 표현</h4>
                                                </div>
                                                <div className="space-y-4 pl-1">
                                                    {q.vocab.map((v, idx) => (
                                                        <div key={idx} className={`pl-4 border-l-4 border-${themeColor}-500`}>
                                                            <p className="text-slate-700">
                                                                <span className={`text-${themeColor}-600 font-bold text-[1.125em] mr-2`}>{v.term}:</span>
                                                                <span>{v.def}</span>
                                                            </p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ) : null
                                    }
                                />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
            const [userLevel] = useState("C1+"); // Default level fixed to B2+
            
            // --- State Lifted from LearnView ---
            const [autoScroll, setAutoScroll] = useState(true);
            const [showVocab, setShowVocab] = useState(false);
            const [playbackRate, setPlaybackRate] = useState(1.0);

            const [progress, setProgress] = useState({
                learn: false,
                vocab: false,
                quiz: 0,
                discuss: false
            });

            // Derive theme color from user level
            const themeColor = useMemo(() => getLevelTheme(userLevel), [userLevel]);

            const updateProgress = useCallback((key, value = true) => {
                setProgress(prev => {
                    if (prev[key] === value) return prev;
                    return { ...prev, [key]: value };
                });
            }, []);

            const handleSpeedChange = (e) => {
                const rate = parseFloat(e.target.value);
                setPlaybackRate(rate);
            };

            // Custom navigation handler for sidebar to control collapse state
            const handleSidebarNavigation = (tabId) => {
                setActiveTab(tabId);
                // "동영상 자료"(learn) 클릭 시 사이드바 접음
                if (tabId === 'learn') {
                    setIsSidebarCollapsed(true);
                } 
                // "시작 페이지", "핵심 어휘", "내용 확인 퀴즈", "생각해 보기" 클릭 시 사이드바 펼침
                else {
                    setIsSidebarCollapsed(false);
                }
            };

            // 탭별 패딩 설정 (Tab-specific padding settings)
            const mainPaddingClass = useMemo(() => {
                switch(activeTab) {
                    case 'home': return 'p-[20px]';    // 홈: 20px
                    case 'learn': return 'p-[2px]';    // 동영상 자료: 2px
                    case 'vocab': return 'p-[16px]';   // 핵심 어휘: 16px
                    case 'quiz': return 'p-[4px]';     // 내용 확인 퀴즈: 4px
                    case 'discuss': return 'p-[2px]';  // 생각해 보기: 2px
                    default: return 'p-[20px]';
                }
            }, [activeTab]);

            useEffect(() => {
                const handleResize = () => {
                    if (window.innerWidth < 1024) {
                        setIsSidebarCollapsed(true);
                    } else {
                        setIsSidebarCollapsed(false);
                    }
                };
                window.addEventListener('resize', handleResize);
                handleResize(); 
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const toggleSidebar = () => {
                setIsSidebarCollapsed(!isSidebarCollapsed);
            };

            const renderContent = () => {
                switch(activeTab) {
                    case 'home': return <HomeView setActiveTab={setActiveTab} progress={progress} userLevel={userLevel} themeColor={themeColor} />;
                    case 'learn': return <LearnView 
                                            updateProgress={updateProgress} 
                                            themeColor={themeColor}
                                            autoScroll={autoScroll}
                                            showVocab={showVocab}
                                            playbackRate={playbackRate}
                                            />;
                    case 'vocab': return <VocabView updateProgress={updateProgress} themeColor={themeColor} />;
                    case 'quiz': return <QuizView updateProgress={updateProgress} themeColor={themeColor} />;
                    case 'discuss': return <DiscussView updateProgress={updateProgress} themeColor={themeColor} />;
                    default: return <HomeView setActiveTab={setActiveTab} progress={progress} userLevel={userLevel} themeColor={themeColor} />;
                }
            };

            // 앱 바(Header) 렌더링 함수
            const renderHeader = () => {
                if (activeTab === 'learn') {
                    // Learn Tab Header (1.0x Scale)
                    const themeHex = LEVEL_THEMES[userLevel]?.hex || '#22c55e';
                    const headerStyle = {
                        fontSize: 'var(--base-size)',
                        height: '4rem' // h-16 equivalent
                    };

                    return (
                        <div className="flex items-center justify-between h-full px-6 border-b border-slate-100 bg-white/90 backdrop-blur" style={headerStyle}>
                            {/* Left: Title */}
                            <div className="flex items-center gap-3">
                                <div className={`p-2 rounded-lg bg-${themeColor}-50`}>
                                    <LearnIcon className={`w-5 h-5 text-${themeColor}-600`} />
                                </div>
                                <div className="flex flex-col">
                                    <h1 className="text-[1.125em] font-normal text-slate-900 font-surround leading-none">동영상 & 스크립트</h1>
                                </div>
                            </div>

                            {/* Right: Controls (Auto Scroll -> Speed -> Vocab) */}
                            <div className="flex items-center gap-4">
                                {/* 1. Auto Scroll */}
                                <div className="flex items-center gap-2 cursor-pointer group" onClick={() => setAutoScroll(!autoScroll)}>
                                    <div className={`w-9 h-5 rounded-full relative transition-colors duration-200 ease-in-out ${autoScroll ? `bg-${themeColor}-500` : 'bg-slate-300'}`}>
                                        <div className={`absolute top-1 w-3 h-3 bg-white rounded-full shadow-sm transition-transform duration-200 ${autoScroll ? 'left-5' : 'left-1'}`}></div>
                                    </div>
                                    <span className="text-[0.875em] font-bold text-slate-600 group-hover:text-slate-800 transition-colors whitespace-nowrap hidden sm:inline">자동 스크롤</span>
                                </div>

                                {/* 2. Speed Control */}
                                <div className="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                                    <SpeedSolidIcon className="w-4 h-4 text-slate-500" />
                                    <div className="flex items-center gap-2">
                                        <span className="text-[0.625em] font-medium text-slate-400">0.5x</span>
                                        <input 
                                            type="range" min="0.5" max="1.0" step="0.01" 
                                            value={playbackRate} onChange={handleSpeedChange}
                                            className="w-20 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                                            style={{ '--thumb-color': themeHex }} // 동적 색상 적용
                                        />
                                        <span className="text-[0.625em] font-medium text-slate-400">1.0x</span>
                                    </div>
                                    <span className={`text-[0.75em] font-bold text-${themeColor}-700 min-w-[2.5rem] text-center`}>{playbackRate.toFixed(2)}x</span>
                                </div>

                                {/* 3. Vocabulary Toggle */}
                                <button 
                                    onClick={() => setShowVocab(!showVocab)}
                                    className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border transition-all shadow-sm ${showVocab ? 'bg-slate-100 border-slate-300' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                                >
                                    <OpenBookSolidIcon className="w-4 h-4 text-slate-600" />
                                    <span className="text-[0.875em] font-bold text-slate-700 whitespace-nowrap hidden sm:inline">핵심 어휘</span>
                                </button>
                            </div>
                        </div>
                    );
                } else {
                    // Other Tabs Header (1.3x Scale)
                    const headerStyle = {
                        fontSize: 'calc(var(--base-size) * 1.3)',
                        height: 'calc(4rem * 1.3)'
                    };
                    return null;
                }
            };

            // Sidebar Width calculation for Main Content Margin
            const mainContentMarginStyle = {
                marginLeft: window.innerWidth >= 768 
                    ? (isSidebarCollapsed ? '88px' : 'calc(16rem * 1.15)') 
                    : '0'
            };

            // Header Height logic for layout wrapper
            const headerWrapperStyle = {
                height: activeTab === 'learn' ? '4rem' : 'calc(4rem * 1.3)'
            };

            return (
                <div className="flex min-h-screen bg-[#f9fafb]">
                    <Sidebar 
                        activeTab={activeTab} 
                        setActiveTab={handleSidebarNavigation} 
                        isCollapsed={isSidebarCollapsed} 
                        toggleSidebar={toggleSidebar}
                        userLevel={userLevel}
                        themeColor={themeColor}
                    />
                    <div 
                        className="flex-1 flex flex-col transition-all duration-300 ease-in-out"
                        style={mainContentMarginStyle}
                    >
                        <header 
                            className="bg-white sticky top-0 z-40 transition-all duration-300"
                            style={headerWrapperStyle}
                        >
                            {renderHeader()}
                        </header>
                        {/* Modified: Removed overflow-hidden so sticky works */}
                        <main className={`flex-1 ${mainPaddingClass} flex flex-col`}>{renderContent()}</main>
                    </div>
                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-3 z-50">
                        {['home','learn','vocab','quiz','discuss'].map(t=><button key={t} onClick={()=>setActiveTab(t)} className={`p-2 rounded-lg ${activeTab===t ? `text-${themeColor}-600 bg-${themeColor}-50` : 'text-slate-400'}`}>{t==='home'?<HomeIcon className="w-6 h-6"/>:t==='learn'?<LearnIcon className="w-6 h-6"/>:t==='vocab'?<VocabIcon className="w-6 h-6"/>:t==='quiz'?<QuizIcon className="w-6 h-6"/>:<DiscussIcon className="w-6 h-6"/>}</button>)}
                    </nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
