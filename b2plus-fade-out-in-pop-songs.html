    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #ffffff; color: #1a1a1a; }

        .font-serif { font-family: 'Noto Serif KR', serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; } 
        ::-webkit-scrollbar-track { background: transparent; } 
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 0px; } 
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        input[type=range] { -webkit-appearance: none; background: transparent; } 
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #000; cursor: pointer; margin-top: -7px; border: 2px solid white; box-shadow: 0 0 0 1px #e5e7eb; } 
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 2px; cursor: pointer; background: #e5e7eb; }

        .marker-red { background: linear-gradient(to top, rgba(252, 165, 165, 0.6) 50%, transparent 50%); box-decoration-break: clone; -webkit-box-decoration-break: clone; }

        ::selection { background-color: #f3f4f6; color: #000; }
        @page { size: auto; margin: 0mm; }
        @media print {
            html, body, #root, main, div { height: auto !important; max-height: none !important; overflow: visible !important; }

        const READING_DATA = [
            { 
                id: 1, 
                title: "팝송에서 '페이드 아웃'이 사라진 이유", 
                subtitle: "여운을 삭제한 시대 : '스킵(Skip)' 방지 버튼과 무한 루프의 경제학", 
                source: "https://brunch.co.kr/@soundfoundrynco/128", 
                content: [
                    { 
                        text: "1. 'Hey Jude'와 'Hotel California'의 공통점", 
                        trans: "1. The commonality between 'Hey Jude' and 'Hotel California'",
                        isHeading: true
                    },
                    { 
                        text: "올드 팝이나 8090 가요를 떠올려 봅시다. 비틀즈의 <Hey Jude> 후반부 \"Na~ na~ na~\" 떼창은 무려 4분 가까이 이어지며 서서히 소리가 작아집니다. 이글스의 <Hotel California> 역시 화려한 기타 솔로가 영원히 지속될 것처럼 울려 퍼지며 수평선 너머로 사라지듯 끝납니다.", 
                        trans: "Let's recall old pop or 80s/90s songs. The sing-along \"Na~ na~ na~\" in the latter half of The Beatles' <Hey Jude> continues for nearly 4 minutes as the sound gradually fades. The Eagles' <Hotel California> also ends with a flashy guitar solo echoing as if it will last forever, fading away beyond the horizon." 
                    },
                    { 
                        text: "이것이 바로 '페이드 아웃(Fade-out)' 기법입니다. 녹음 기술이 발전하면서 엔지니어들은 노래를 인위적으로 점점 작게 만들어, 마치 밴드가 저 멀리 떠나면서도 연주는 계속하는 듯한 낭만적인 여운을 남겼습니다. 80년대까지만 해도 빌보드 1위 곡의 거의 100%가 이 방식을 택했죠.", 
                        trans: "This is precisely the 'Fade-out' technique. As recording technology advanced, engineers artificially made the song gradually quieter, leaving a romantic lingering resonance as if the band was walking far away while continuing to play. Up until the 80s, almost 100% of Billboard #1 songs adopted this method." 
                    },
                    { 
                        text: "하지만 2020년대의 차트를 들어보세요. 빌리 아일리시, 뉴진스, 테일러 스위프트의 노래들은 다릅니다. 노래가 절정으로 치닫다가 갑자기 \"툭\" 하고 끊기거나, 딱 떨어지는 정박자에 악기들이 일제히 멈추며 끝납니다. 이를 '콜드 엔드(Cold End)'라고 부릅니다.", 
                        trans: "But listen to the charts in the 2020s. Songs by Billie Eilish, NewJeans, and Taylor Swift are different. The song reaches its climax and suddenly cuts off with a 'snap', or ends with instruments stopping in unison right on the exact beat. This is called a 'Cold End'." 
                    },
                    { 
                        text: "왜 현대 음악가들은 이 아름다운 여운을 포기하고, 냉정한 단절을 선택했을까요? 단순히 유행이 변해서일까요? 아닙니다. 여기에는 '돈'과 '알고리즘'이라는 아주 현실적인 이유가 숨어 있습니다.", 
                        trans: "Why did modern musicians abandon this beautiful lingering resonance and choose a cold disconnection? Is it simply because trends changed? No. Hidden here is a very realistic reason: 'money' and 'algorithms'." 
                    },
                    { 
                        text: "2. 범인은 '스킵(Skip)' 버튼이다 : 낭만보다 중요한 완청률", 
                        trans: "2. The culprit is the 'Skip' button: Completion rate is more important than romance",
                        isHeading: true
                    },
                    { 
                        text: "가장 큰 원인은 음악을 듣는 매체가 'LP/CD'에서 '스트리밍(Spotify, Apple Music, Melon)'으로 바뀌었기 때문입니다.", 
                        trans: "The biggest cause is that the medium for listening to music has shifted from 'LP/CD' to 'streaming (Spotify, Apple Music, Melon)'." 
                    },
                    { 
                        text: "과거 LP나 CD 시절에는 노래를 건너뛰려면 바늘을 옮기거나 버튼을 여러 번 눌러야 했습니다. 귀찮아서라도 끝까지 들었죠. 하지만 지금은 엄지손가락 하나로 1초 만에 다음 곡으로 넘어갈 수 있습니다.",

                        text: "데이터 분석 결과, 현대의 청취자들은 노래가 끝나갈 때 소리가 작아지기 시작하면(Fade-out), \"아, 이 노래 다 들었네\"라고 판단하고 즉시 '스킵(Skip)' 버튼을 누릅니다. 볼륨이 줄어드는 그 5~10초의 시간을 참지 못하는 것입니다.", 
                        trans: "According to data analysis, when the sound starts to decrease at the end of a song (Fade-out), modern listeners conclude, 'Ah, I've heard all of this song,' and immediately press the 'Skip' button. They cannot endure that 5~10 seconds of decreasing volume."

                        text: "문제는 스트리밍 플랫폼의 알고리즘입니다. 스킵은 곧 벌점 : 청취자가 노래를 끝까지 듣지 않고 넘기면, 알고리즘은 \"이 노래는 지루하구나\", \"만족도가 낮구나\"라고 판단하여 추천 리스트에서 제외해 버립니다.", 
                        trans: "The problem is the streaming platform's algorithm. Skip equals a penalty point: If a listener skips without listening to the end, the algorithm judges, 'This song is boring' or 'Satisfaction is low,' and removes it from the recommendation list." 
                    },
                    { 
                        text: "완청률(Completion Rate)의 중요성 : 뮤지션과 기획사 입장에서 노래가 차트에 오래 살아남으려면 '완청률'을 높여야 합니다.", 
                        trans: "Importance of Completion Rate: From the perspective of musicians and agencies, in order for a song to survive long on the charts, they must increase the 'completion rate'." 
                    },
                    { 
                        text: "그래서 그들은 청취자가 딴생각을 하거나 스킵 버튼을 누를 틈을 주지 않기 위해, 노래가 끝나는 0.1초까지 에너지를 꽉 채우고(Full Volume) 갑자기 끝내버리는 전략을 취하게 된 것입니다. 여운을 즐길 시간조차 아까운 '초스피드 소비 시대'의 단면입니다.", 
                        trans: "Thus, to prevent listeners from getting distracted or having time to press the skip button, they adopted a strategy of filling the energy to the brim (Full Volume) until the last 0.1 second and abruptly ending it. It is a cross-section of the 'ultra-fast consumption era' where even the time to enjoy a lingering feeling is considered a waste." 
                    },
                    { 
                        text: "3. 무한 루프(Infinite Loop)를 위한 설계", 
                        trans: "3. Design for an Infinite Loop",
                        isHeading: true
                    },
                    { 
                        text: "또 다른 이유는 '반복 청취'를 유도하기 위해서입니다. 요즘 노래들은 3분 미만, 심지어 2분대로 짧아지는 추세입니다. 틱톡(TikTok)이나 숏폼 콘텐츠에 익숙한 세대를 위한 것이기도 하지만, 짧은 노래를 여러 번 반복해서 듣게 하려는 의도도 있습니다.", 
                        trans: "Another reason is to induce 'repeated listening'. These days, songs are trending to be shorter, under 3 minutes or even in the 2-minute range. This is for the generation accustomed to TikTok or short-form content, but it also carries the intention of making them listen to a short song repeatedly." 
                    },
                    { 
                        text: "'콜드 엔드'는 노래가 끝나자마자 다음 곡(혹은 같은 곡)의 시작 부분으로 매끄럽게 이어지기에 유리합니다.", 
                        trans: "'Cold End' is advantageous because it smoothly transitions into the beginning of the next song (or the same song) as soon as the track ends." 
                    },
                    { 
                        text: "페이드 아웃 : 소리가 작아졌다가 다시 다음 곡의 인트로가 커지면, 그 사이에 '에너지의 공백(Silence)'이 생겨 흐름이 끊깁니다.", 
                        trans: "Fade-out: If the sound decreases and then the next song's intro gets louder again, an 'energy gap (Silence)' occurs in between, breaking the flow." 
                    },
                    { 
                        text: "콜드 엔드 : 뚝 끊기자마자 다시 \"쿵!\" 하고 비트가 시작되면, 청취자는 롤러코스터가 멈추지 않고 다시 출발하는 듯한 느낌을 받습니다.", 
                        trans: "Cold End: As soon as it abruptly cuts off, the beat starts again with a 'Boom!', giving the listener the sensation of a roller coaster restarting without coming to a stop." 
                    },
                    { 
                        text: "이런 구조는 청취자가 자신이 같은 노래를 몇 번이나 들었는지 모르게 만드는 '순환 구조(Circular Structure)'를 만듭니다. 노래 한 곡이 하나의 완결된 작품이 아니라, 무한히 반복되는 BGM이나 틱톡 배경음악처럼 소비되는 것이죠.",

                    },
                    { 
                        text: "4. 사라진 것은 소리가 아니라 '상상력'이다", 
                        trans: "4. What disappeared is not the sound, but 'imagination'",
                        isHeading: true
                    },
                    { 
                        text: "음악 평론가들은 페이드 아웃의 실종을 두고 \"음악이 '미스터리'를 잃었다\"고 표현합니다.", 
                        trans: "Music critics describe the disappearance of the fade-out by saying, 'Music has lost its mystery'." 
                    },
                    { 
                        text: "페이드 아웃은 청취자에게 상상력을 선물했습니다. 소리가 점점 작아져서 들리지 않게 되어도, 우리 머릿속에서는 그 밴드가 지평선 너머 어딘가에서 영원히 연주를 계속하고 있을 것 같은 느낌을 줍니다. 음악이 끝나지 않고 영원 속으로 확장되는 것이죠.",

                    },
                    { 
                        text: "오늘 당신의 플레이리스트에는 여운이 남아 있나요, 아니면 다음 곡을 향한 조급함만이 남아 있나요?", 
                        trans: "Today, does your playlist hold a lingering resonance, or is only the impatience for the next track left?" 
                    }
                ]
            }

            return (
                <div className="mb-16 group print:mb-6 print:break-inside-avoid">
                    <div className="flex items-center gap-4 mb-6 print:mb-2"><span className="text-4xl font-serif font-bold text-gray-200 group-hover:text-gray-900 transition-colors duration-300 print:text-[14px] print:text-gray-900 print:mr-1">{item.id < 10 ? `0${item.id}` : item.id}.</span><h3 className="text-xl font-serif font-bold text-gray-900 leading-normal print:text-[12px]">{formatQuestion(item.questionKor)}</h3></div>
                    <div className="pl-0 md:pl-14 print:pl-5">
                        {item.imageUrl && (<div className="mb-6 rounded-md overflow-hidden bg-gray-50 border border-gray-100 print:mb-2 print:border-none print:bg-transparent"><img src={item.imageUrl} alt={item.imageCaption || 'Question context image'} className="w-full h-auto object-contain max-h-[400px]" />{item.imageCaption && (<p className="text-xs text-center text-gray-500 p-2 font-sans print:text-[10px] print:p-1">{item.imageCaption}</p>)}</div>)}
                        <div className="flex gap-2 mb-4 print:hidden"><TranslateButton onClick={() => setShowTranslation(!showTranslation)} isShowing={showTranslation} />{showTranslation && (<p className="text-sm font-sans text-gray-500 animate-fade-in print:text-[10px]">{item.questionEng}</p>)}</div>
                        <div className="bg-gray-50 p-5 mb-6 border-l-2 border-black print:p-2 print:mb-2 print:border-gray-400 print:bg-transparent">
                            <span className="text-xs font-bold font-sans text-gray-400 uppercase mb-2 block print:text-[10px] print:mb-1 print:text-black">핵심 어휘</span>
                            <div className="space-y-3 print:space-y-1">{item.vocab.map((v, i) => (<div key={i}><p className="text-sm font-serif text-gray-700 print:text-[10px] print:text-black"><span className="font-bold text-black mr-2 print:text-[10px]">{v.term}</span>{v.def}</p>{showTranslation && v.termEng && (<p className="text-[13px] font-sans text-gray-500 mt-1 animate-fade-in print:text-[10px] print:mt-0 print:text-black"><span className="font-bold mr-2 print:text-[10px]">{v.termEng}</span>{v.defEng}</p>)}</div>))}</div>
                        </div>
                        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="여기에 생각을 적어보세요..." className="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300 print:hidden"></textarea>
                        <div className="flex justify-end print:hidden">
                            <button onClick={handleGetFeedback} disabled={!text.trim() || isLoading} className={`px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors flex items-center gap-2 ${(!text.trim() || isLoading) ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}`}>
                                {isLoading ? <div className="w-3 h-3 border-2 border-gray-300 border-t-white animate-spin rounded-full"></div> : null}{isLoading ? '분석 중...' : 'AI 피드백 받기'}
                            </button>
                        </div>
                        {feedback && !isLoading && (
                            <div className="mt-4 p-5 bg-blue-50 border border-blue-100 rounded-lg animate-fade-in print:hidden">
                                <div className="flex justify-between items-center mb-3">
                                    <div className="flex items-center gap-2">
                                        <SparklesIcon className="w-4 h-4 text-blue-600" />
                                        <h4 className="text-sm font-bold text-blue-900 font-sans uppercase tracking-tighter">AI 선생님의 피드백</h4>
                                    </div>
                                    <button 
                                        onClick={handleTranslateFeedback}
                                        className="text-[10px] text-blue-300 hover:text-blue-500 font-bold uppercase transition-colors"
                                        title="Translate feedback to English"
                                    >
                                        {isTranslating ? '...' : (showFeedbackTrans ? 'Hide' : 'Eng')}
                                    </button>
                                </div>
                                <div className="text-[15px] font-serif text-gray-800 leading-relaxed whitespace-pre-wrap">{feedback}</div>
                                {showFeedbackTrans && translatedFeedback && (
                                    <div className="mt-4 pt-4 border-t border-blue-200 text-sm font-sans text-blue-700 leading-relaxed animate-fade-in whitespace-pre-wrap">
                                        {translatedFeedback}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const DiscussView = ({ updateProgress }) => (
            <div className="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in print:py-0 print:px-0">
                <div className="mb-6 pb-6 text-center print:text-left print:mb-4 print:pb-2"><h2 className="text-3xl font-serif font-bold text-gray-900 mb-2 print:text-[18px]">생각해 보기</h2><p className="text-sm font-sans text-gray-500 print:text-[12px]">학습 자료에 대해 심층적으로 생각해 보세요.</p></div>
                <div className="bg-gray-50 border border-gray-200 p-4 mb-10 flex items-start gap-3 print:hidden"><div className="shrink-0 mt-0.5"><SparklesIcon className="w-4 h-4 text-gray-400" /></div><p className="text-xs font-sans text-gray-600 leading-relaxed">AI 피드백은 현재 Gemini 웹에서만 가능합니다. <a href="https://gemini.google.com/share/174766a87606" target="_blank" rel="noreferrer" className="underline decoration-gray-400 underline-offset-2 hover:text-black inline-flex items-center gap-1">Gemini에서 열기 <ExternalLinkIcon className="w-3 h-3"/></a></p></div>
                {DISCUSS_DATA.map((item) => (<DiscussQuestionItem key={item.id} item={item} />))}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home'); const [userLevel] = useState("B2+"); const [showVocab, setShowVocab] = useState(false); const [progress, setProgress] = useState({ learn: false, vocab: false, quiz: 0, discuss: false });
            const updateProgress = useCallback((key, value = true) => { setProgress(prev => { if (prev[key] === value) return prev; return { ...prev, [key]: value }; }); }, []);
            const renderContent = () => { switch(activeTab) { case 'home': return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; case 'reading': return <ReadingView updateProgress={updateProgress} showVocab={showVocab} setShowVocab={setShowVocab} userLevel={userLevel} />; case 'vocab': return <VocabView updateProgress={updateProgress} />; case 'quiz': return <QuizView updateProgress={updateProgress} />; case 'discuss': return <DiscussView updateProgress={updateProgress} />; default: return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; } };
            const isReadingTab = activeTab === 'reading';
            return (
                <div className={`flex flex-col bg-white text-gray-900 selection:bg-gray-200 selection:text-black font-sans ${isReadingTab ? 'h-screen overflow-hidden print:h-auto print:overflow-visible' : 'min-h-screen print:h-auto print:overflow-visible'}`}>
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} />
                    <div className="lg:hidden h-14 border-b border-gray-100 flex items-center justify-center sticky top-0 bg-white z-40 print:hidden"><span className="text-lg font-bold font-sans tracking-tighter">OpenKoreanLearningLab</span></div>
                    <main className={`flex-1 relative flex flex-col ${isReadingTab ? 'overflow-x-hidden lg:overflow-hidden lg:h-full print:overflow-visible print:h-auto print:block' : 'print:h-auto print:block'}`}>{renderContent()}</main>
                    <nav className="lg:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 z-50 print:hidden">{NAV_ITEMS.map((item) => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 ${activeTab === item.id ? 'text-black' : 'text-gray-300'}`}><item.icon className="w-6 h-6" /></button>))}</nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
