        const VocabPopup = ({ popup, themeColor, onGlobalClick }) => {
            const [showTrans, setShowTrans] = useState(false);
            const trans = popup.data?.translations?.en;

            // Using rem based calculation approx
            const popupWidth = 288; 
            const padding = 16;
            const windowWidth = window.innerWidth;

            let leftPos = popup.x - (popupWidth / 2);
            
            if (leftPos < padding) {
                leftPos = padding;
            } else if (leftPos + popupWidth > windowWidth - padding) {
                leftPos = windowWidth - popupWidth - padding;
            }

            const arrowLeft = popup.x - leftPos;

            useEffect(() => {
                setShowTrans(false);
            }, [popup.data]);

            if (!popup.show || !popup.data) return null;

            return createPortal(
                <div 
                    className={`fixed z-[9999] bg-white rounded-xl shadow-xl border border-slate-200 p-4 w-72 animate-fade-in ${!popup.fixed ? 'pointer-events-none' : ''}`}
                    style={{ 
                        left: leftPos, 
                        top: popup.y + 12,
                    }}
                    onClick={(e) => e.stopPropagation()}
                >
                    <div className="flex items-center justify-between mb-2">
                        <h3 className="text-[1.25em] font-ocarina text-slate-900 tracking-wide">{popup.data.term}</h3>
                        {popup.fixed && (
                            <TranslateButton onClick={() => setShowTrans(!showTrans)} isShowing={showTrans} />
                        )}
                    </div>
                    
                    <p className="text-[1.1875em] font-diary text-slate-700 font-medium mb-3 leading-snug">{popup.data.mainDef}</p>
                    {showTrans && popup.fixed && trans?.mainDef && (
                        <p className="text-[1em] font-gowoon text-slate-500 mb-3 animate-fade-in border-t border-slate-100 pt-2">{trans.mainDef}</p>
                    )}
                    
                    {popup.fixed && popup.data.subDefs && popup.data.subDefs.length > 0 && (
                        <div className="space-y-1 mt-2">
                            {popup.data.subDefs.map((sub, idx) => {
                                const subTrans = trans?.subDefs?.[idx];
                                return (
                                    <div key={idx} className={`bg-${themeColor}-50 rounded-lg p-2 border border-${themeColor}-100`}>
                                        <p className={`text-[1.125em] font-free text-${themeColor}-900 font-bold`}>{sub.subTerm}</p>
                                        <p className={`text-[1.0625em] font-dictation text-${themeColor}-700`}>{sub.subDef}</p>
                                        {showTrans && subTrans?.def && (
                                            <p className="text-[0.875em] font-gowoon text-slate-500 mt-0.5 animate-fade-in border-t border-slate-200/50 pt-1">{subTrans.def}</p>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                    
                    <div 
                        className="absolute top-0 -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-white border-l border-t border-slate-200 rotate-45"
                        style={{ left: arrowLeft }}
                    ></div>
                </div>,
                document.body
            );
        };

        const LearnView = ({ updateProgress, themeColor, autoScroll, showVocab, playbackRate }) => {
            const [player, setPlayer] = useState(null);
            const playerRef = useRef(null); 
            const [currentTime, setCurrentTime] = useState(0);
            const [activeLine, setActiveLine] = useState(null);
            const [translations, setTranslations] = useState({});
            const [popup, setPopup] = useState({ show: false, fixed: false, data: null, x: 0, y: 0 });
            const [activeVocabTerm, setActiveVocabTerm] = useState(null);
            const sidebarVocabRefs = useRef({});
            const scriptRefs = useRef({});
            const intervalRef = useRef(null);

            useEffect(() => {
                const loadVideo = () => {
                    if (window.YT && window.YT.Player) {
                        new window.YT.Player('youtube-player', {
                            videoId: 'nb-L3S8AFh8',
                            width: '100%',
                            height: '100%',
                            playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0 },
                            events: {
                                'onReady': (event) => {
                                    playerRef.current = event.target;
                                    setPlayer(event.target);
                                },
                                'onStateChange': (event) => {
                                    if (event.data === window.YT.PlayerState.PLAYING) {
                                        startInterval();
                                        updateProgress('learn');
                                    } else stopInterval();
                                }
                            }
                        });
                    }
                };
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = "https://www.youtube.com/iframe_api";
                    const firstScriptTag = document.getElementsByTagName('script')[0];
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                    window.onYouTubeIframeAPIReady = loadVideo;
                } else {
                    loadVideo();
                }
                return () => stopInterval();
            }, []);

            useEffect(() => {
                if (player && player.setPlaybackRate) {
                    player.setPlaybackRate(playbackRate);
                }
            }, [playbackRate, player]);

            const handleGlobalClick = useCallback(() => {
                if (popup.fixed) {
                    setPopup(prev => ({ ...prev, show: false, fixed: false }));
                }
            }, [popup.fixed]);

            useEffect(() => {
                if (popup.fixed) {
                    window.addEventListener('click', handleGlobalClick);
                }
                return () => window.removeEventListener('click', handleGlobalClick);
            }, [popup.fixed, handleGlobalClick]);

            const startInterval = () => {
                stopInterval();
                intervalRef.current = setInterval(() => {
                    const p = playerRef.current;
                    if (p && p.getCurrentTime) {
                        const time = p.getCurrentTime();
                        setCurrentTime(time);
                        const currentLine = SCRIPT_DATA.find(line => time >= line.time[0] && time < line.time[1]);
                        if (currentLine) setActiveLine(currentLine.id);
                    }
                }, 200);
            };
            const stopInterval = () => clearInterval(intervalRef.current);

            useEffect(() => {
                if (popup.show) return;
                if (activeLine && autoScroll && scriptRefs.current[activeLine]) {
                    scriptRefs.current[activeLine].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [activeLine, autoScroll, popup.show]);

            const handleLineClick = (time) => {
                if (player) {
                    player.seekTo(time);
                    player.playVideo();
                }
            };

            const toggleTranslation = (id) => {
                setTranslations(prev => ({...prev, [id]: !prev[id]}));
            };

            const scrollToVocab = (term) => {
                const element = sidebarVocabRefs.current[term];
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            const handleVocabEnter = (e, wordData) => {
                if (popup.fixed) return; 
                const rect = e.target.getBoundingClientRect();
                setPopup({
                    show: true,
                    fixed: false,
                    data: wordData,
                    x: rect.left + rect.width / 2, 
                    y: rect.bottom
                });

                if (showVocab) {
                    setActiveVocabTerm(wordData.term);
                    scrollToVocab(wordData.term);
                }
            };

            const handleVocabLeave = () => {
                if (popup.fixed) return;
                setPopup(prev => ({ ...prev, show: false }));
            };

            const handleVocabClick = (e, wordData) => {
                e.stopPropagation(); 
                if (popup.fixed && popup.data && popup.data.term === wordData.term) {
                    setPopup(prev => ({ ...prev, show: false, fixed: false }));
                    return;
                }
                const rect = e.target.getBoundingClientRect();
                setPopup({
                    show: true,
                    fixed: true,
                    data: wordData,
                    x: rect.left + rect.width / 2,
                    y: rect.bottom
                });

                if (showVocab) {
                    setActiveVocabTerm(wordData.term);
                    scrollToVocab(wordData.term);
                }
            };

            const { termMap, vocabRegex } = useMemo(() => {
                const map = {};
                VOCAB_DATA.forEach(vocab => {
                    map[vocab.term] = vocab;
                    if (vocab.variants) {
                        vocab.variants.forEach(v => map[v] = vocab);
                    }
                });
                const patterns = Object.keys(map).sort((a, b) => b.length - a.length);
                if (patterns.length === 0) return { termMap: map, vocabRegex: null };
                const regex = new RegExp(`(${patterns.map(p => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'g');
                return { termMap: map, vocabRegex: regex };
            }, []);

            const renderTextWithVocab = (text) => {
                if (!vocabRegex) return [text];
                const parts = text.split(vocabRegex);
                return parts.map((part, index) => {
                    if (termMap[part]) {
                        const vocab = termMap[part];
                        const isActive = (popup.show && popup.data && popup.data.term === vocab.term) || (showVocab && activeVocabTerm === vocab.term);
                        return (
                            <span 
                                key={index}
                                className={`cursor-pointer border-b-2 transition-all duration-200 font-bold inline-block leading-tight
                                    ${isActive 
                                        ? `text-${themeColor}-700 border-${themeColor}-500 bg-${themeColor}-100 rounded-sm px-0.5 mx-0.5` 
                                        : `text-slate-900 border-dashed border-slate-400 hover:text-${themeColor}-600 hover:border-${themeColor}-400 hover:bg-${themeColor}-50`
                                    }`}
                                onMouseEnter={(e) => handleVocabEnter(e, vocab)}
                                onMouseLeave={handleVocabLeave}
                                onClick={(e) => handleVocabClick(e, vocab)}
                            >
                                {part}
                            </span>
                        );
                    }
                    return part;
                });
            };

            return (
                <div className="flex h-[calc(100vh-4rem)] gap-4 animate-fade-in overflow-hidden relative w-full mx-auto max-w-full">
                    <VocabPopup popup={popup} themeColor={themeColor} onGlobalClick={handleGlobalClick} />

                    <div className={`bg-black rounded-xl overflow-hidden shadow-lg transition-all duration-300 ${showVocab ? 'w-5/12' : 'flex-1'}`}>
                            <div id="youtube-player" className="w-full h-full"></div>
                    </div>

                    <div 
                        className={`flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm transition-all duration-300 ${showVocab ? 'w-4/12' : 'w-5/12'}`}
                        style={{ fontSize: '1.3rem' }}
                    >
                        <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 rounded-xl">
                            {SCRIPT_DATA.map(line => {
                                const isActive = activeLine === line.id;
                                return (
                                    <div key={line.id} ref={el => scriptRefs.current[line.id] = el} className="flex flex-col">
                                        <div className="flex items-center gap-2 mb-1 ml-1">
                                            <span className="text-[0.75em] font-bold text-slate-600">{line.speaker}</span>
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); handleLineClick(line.time[0]); }} 
                                                className={`text-[0.625em] text-${themeColor}-600 hover:underline flex items-center gap-0.5`}
                                            >
                                                <PlayIconLine className="w-3 h-3 fill-current" /> 재생 (Play)
                                            </button>
                                        </div>
                                        <div 
                                            onClick={() => handleLineClick(line.time[0])}
                                            className={`p-5 rounded-2xl border transition-all duration-300 cursor-pointer relative group ${
                                                isActive 
                                                ? 'bg-yellow-100 border-yellow-400 shadow-md ring-1 ring-yellow-200 scale-[1.01]' 
                                                : 'bg-white border-slate-200 hover:border-slate-300'
                                            }`}
                                        >
                                            <p className="text-[1.375em] text-slate-800 leading-relaxed font-medium">
                                                {renderTextWithVocab(line.kor)}
                                            </p>
                                            
                                            <div className="my-3 border-t border-dashed border-slate-200"></div>
                                            {translations[line.id] ? (
                                                <p className="text-[1.125em] text-slate-500 animate-fade-in">{line.eng}</p>
                                            ) : (
                                                <TranslateButton 
                                                    onClick={() => toggleTranslation(line.id)}
                                                    isShowing={false} 
                                                />
                                            )}
                                            {translations[line.id] && (
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); toggleTranslation(line.id); }}
                                                    className="absolute bottom-4 right-4 text-[0.625em] text-slate-300 hover:text-slate-500"
                                                >
                                                    접기
                                                </button>

        const VocabView = ({ updateProgress, themeColor }) => {

        const QuizSentence = ({ quiz, onAttempt, themeColor, onShuffle }) => {
            const [userInput, setUserInput] = useState('');
            const [result, setResult] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [showTranslation, setShowTranslation] = useState(false);

            const handleCheck = () => {
                const isCorrect = userInput.trim() === quiz.answer; 
                setResult(isCorrect ? 'correct' : 'incorrect');
                setShowHint(false);
                
                if (onAttempt) {

                if (onShuffle) {
                    onShuffle();
                }

            const handleShowAnswer = () => {
                setUserInput(quiz.answer); 
                setResult(null); 
                setShowHint(false);
                
                if (onShuffle) {
                    onShuffle();

            const safeWidth = quiz.answer ? Math.max(80, quiz.answer.length * 20) : 80;

            const getCheckButtonClass = () => {
                const baseClass = "px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm";
                if (result === 'correct') return `${baseClass} bg-green-50 text-green-900 hover:bg-green-100`;
                if (result === 'incorrect') return `${baseClass} bg-red-50 text-red-900 hover:bg-red-100`;
                return `${baseClass} bg-yellow-50 text-yellow-900 hover:bg-yellow-100`;
            };

            const translationText = (
                <span>
                    {quiz.textParts_eng[0]}
                    <span className={`font-bold ${result === 'correct' ? 'text-green-600' : 'text-slate-400'}`}>
                        {result === 'correct' ? quiz.answer_eng : "______"}
                    </span>
                    {quiz.textParts_eng[1]}
                </span>

            return (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                    <div className="text-[1.125em] text-slate-800 font-medium leading-loose mb-4">
                        <span className="font-bold text-slate-500 mr-2">{quiz.id}.</span>
                        
                        <span>{quiz.textParts[0]}</span>
                        <input 
                            type="text" 
                            value={userInput} 
                            onChange={(e) => { setUserInput(e.target.value); setResult(null); }}
                            className={`mx-1 px-3 py-0.5 border-b-2 font-bold text-center focus:outline-none transition-colors bg-transparent inline-block
                                ${result === 'correct' 
                                    ? 'border-green-500 text-green-700' 
                                    : result === 'incorrect' 
                                        ? 'border-red-500 text-red-700' 
                                        : `border-slate-300 text-${themeColor}-600 focus:border-${themeColor}-500`
                                }`}
                            style={{ width: `${safeWidth}px`, minWidth: '5rem' }}

                        <span>{quiz.textParts[1]}</span>

                    {showTranslation && (

                    {result === 'correct' && (
                        <div className={`mb-4 px-4 py-3 rounded-lg text-[0.875em] font-medium bg-${themeColor}-50 text-${themeColor}-800 border border-${themeColor}-100 animate-fade-in`}>

                        <div className="mb-4 px-4 py-2 bg-yellow-50 text-yellow-800 rounded-lg text-[0.875em] font-medium border border-yellow-200 animate-fade-in">

                    <div className="flex flex-wrap gap-2 items-center">

                            정답 확인
                        </button>
                        <button onClick={handleShowAnswer} className="px-3 py-1.5 bg-slate-50 text-slate-600 rounded-lg text-[0.75em] font-bold hover:bg-slate-100 transition-colors">
                            정답 보기
                        </button>
                        <button onClick={() => setShowHint(!showHint)} className="px-3 py-1.5 bg-slate-50 text-slate-600 rounded-lg text-[0.75em] font-bold hover:bg-slate-100 transition-colors">
                            힌트 보기

                        <TranslateButton onClick={() => setShowTranslation(!showTranslation)} isShowing={showTranslation} className="ml-1" />
                    </div>
                </div>
            );

        const QuizView = ({ updateProgress, themeColor }) => {
            const [attempts, setAttempts] = useState({});
            const [shuffledChoices, setShuffledChoices] = useState(ANSWER_CHOICES);

            const totalQuestions = QUIZ_LIST.length;
            const correctCount = Object.values(attempts).filter(v => v).length;
            const currentScore = Math.round((correctCount / totalQuestions) * 100);

            useEffect(() => {
                const totalAttempts = Object.keys(attempts).length;
                if (totalAttempts === 0) return; 

                updateProgress('quiz', currentScore);
            }, [attempts, currentScore, updateProgress]); 

            const handleAttempt = (quizId, isCorrect) => {
                setAttempts(prev => {
                    if (prev.hasOwnProperty(quizId)) return prev;
                    const newAttempts = { ...prev, [quizId]: isCorrect };
                    return newAttempts;
                });
            };

            const shuffleChoices = useCallback(() => {
                setShuffledChoices(prev => {
                    const newArray = [...prev];
                    for (let i = newArray.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                    }
                    return newArray;
                });
            }, []);

            return (
                <div className="w-full animate-fade-in max-w-7xl mx-auto p-4" style={{ fontSize: '1.5rem' }}>

                                <span className={`text-[1.125em] font-bold text-${themeColor}-600 animate-fade-in leading-none mb-0.5`}>

                        </div>

                                <div className="flex flex-wrap lg:flex-col gap-2 justify-center">
                                    {shuffledChoices.map((choice, idx) => (
                                        <div key={idx} className={`bg-white px-2 py-2 rounded-lg text-center text-[0.875em] font-bold text-slate-600 shadow-sm border border-slate-100 hover:border-${themeColor}-400 hover:text-${themeColor}-600 transition-colors cursor-default select-all`}>
                                            {choice}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 w-full space-y-6">

                                <QuizSentence 
                                    key={quiz.id} 
                                    quiz={quiz} 
                                    onAttempt={handleAttempt} 
                                    themeColor={themeColor}
                                    onShuffle={shuffleChoices}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const callGeminiWithBackoff = async (payload) => {
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000, 8000, 16000];
            
            for (let i = 0; i <= delays.length; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        if (response.status === 429 || response.status >= 500) {
                            throw new Error(`Server error: ${response.status}`);
                        }
                        throw new Error(`API error: ${response.statusText}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === delays.length) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        const FeedbackSection = ({ value, onChange, placeholder, question, keyPhrases, themeColor }) => {
            const [feedback, setFeedback] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);

            const checkSentence = async () => {
                if (!value || value.trim() === '') {
                    setError("문장을 입력해야 피드백을 받을 수 있어요.");
                    setFeedback(null);
                    return;
                }
                setIsLoading(true);
                setError(null);
                setFeedback(null);

                const systemPrompt = `You are an advanced Korean language tutor AI for A2 level learners. Analyze the user's sentence in response to a specific question.
The user's answer is in Korean.
Your goal is to provide feedback in ENGLISH to help the learner understand.

Instructions:
1. "feedback_message_eng": Write the feedback status or brief comment in English.
2. "explanation_eng": Explain the grammar or vocabulary mistake in English. You can quote Korean words but the explanation must be in English.
3. "corrected_sentence": Provide the natural and correct Korean sentence.
4. "relevance_feedback_eng": If the answer is irrelevant, explain why in English.

Question: "${question}"
User's Answer: "${value}"

Your response MUST be a JSON object with the specified schema.`;
                const payload = {
                    contents: [{ role: "user", parts: [{ text: systemPrompt }, { text: `Please provide feedback on my answer.\n\nQuestion: "${question}"\nUser's Answer: "${value}"` }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: { type: "OBJECT", properties: { "is_relevant": { "type": "BOOLEAN" }, "relevance_feedback_eng": { "type": "STRING", "nullable": true }, "is_correct": { "type": "BOOLEAN", "nullable": true }, "feedback_message_eng": { "type": "STRING", "nullable": true }, "corrected_sentence": { "type": "STRING", "nullable": true }, "explanation_eng": { "type": "STRING", "nullable": true }, "alternative_expressions": { "type": "ARRAY", "items": { "type": "OBJECT", "properties": { "expression_kor": { "type": "STRING" }, "expression_eng": { "type": "STRING" } }, "required": ["expression_kor", "expression_eng"] } } }, "required": ["is_relevant"] }
                    }
                };

                try {
                    const result = await callGeminiWithBackoff(payload);
                    if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                        const parsedJson = JSON.parse(result.candidates[0].content.parts[0].text);
                        setFeedback(parsedJson);
                    } else {
                        setError("AI의 응답을 처리하는 데 문제가 발생했어요.");
                    }
                } catch (err) {
                    console.error("Error checking sentence:", err);
                    setError("문장 검사에 실패했어요. 다시 시도해 주세요.");
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div>
                    {keyPhrases}
                    <div>
                        <h4 className="font-bold text-slate-900 mb-3 text-[1em]">핵심 표현을 사용해서 질문에 대답해 보세요.</h4>
                        <textarea 
                            value={value} 
                            onChange={onChange} 
                            placeholder={placeholder}
                            className={`w-full p-4 rounded-xl border border-slate-200 focus:border-${themeColor}-500 focus:ring-1 focus:ring-${themeColor}-500 outline-none min-h-[7.5rem] resize-none text-[1em] text-slate-800 placeholder-slate-400 mb-3`}
                        ></textarea>
                        
                        <button
                            onClick={checkSentence}
                            disabled={!value.trim() || isLoading}
                            className={`flex items-center gap-2 px-5 py-[0.375rem] text-[0.75em] leading-[0.75em] rounded-xl font-bold transition-all shadow-sm ${
                                !value.trim() || isLoading
                                ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                                : 'bg-indigo-600 text-white hover:bg-indigo-700 hover:shadow-md'
                            }`}
                        >
                            {isLoading ? (
                                <>
                                    <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                    <span>분석 중... (Analyzing)</span>
                                </>
                            ) : (
                                <>
                                    <SparklesIcon className="w-5 h-5" />
                                    <span>AI Feedback (피드백 받기)</span>
                                </>

                        {error && (
                            <div className="mt-4 p-4 bg-red-50 text-red-600 rounded-xl border border-red-200 text-[0.875em] font-medium animate-fade-in">
                                {error}

                            <div className={`mt-6 rounded-2xl p-6 border animate-fade-in ${feedback.is_correct ? `bg-${themeColor}-50 border-${themeColor}-200` : 'bg-yellow-50 border-yellow-200'}`}>
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="text-[1.5em]">🤖</span>
                                    <h4 className="font-extrabold text-slate-900 text-[1.125em]">AI Tutor Feedback</h4>
                                </div>
                                
                                <div className="mb-4">
                                    <span className={`font-black text-[0.875em] px-3 py-1 rounded-full bg-white border shadow-sm ${feedback.is_correct ? `text-${themeColor}-600 border-${themeColor}-200` : 'text-yellow-600 border-yellow-200'}`}>
                                        {feedback.is_correct ? '🎉 Great Job!' : '⚠️ Needs Improvement'}
                                    </span>
                                </div>

                                <div className="space-y-4">
                                    {feedback.feedback_message_eng && (
                                        <div className="flex flex-col sm:flex-row gap-1 sm:gap-4">
                                            <span className="font-bold text-slate-500 text-[0.875em] sm:w-24 shrink-0">Feedback</span>
                                            <p className="text-slate-800 text-[0.875em] font-medium leading-relaxed">{feedback.feedback_message_eng}</p>
                                        </div>
                                    )}
                                    {feedback.explanation_eng && (
                                        <div className="flex flex-col sm:flex-row gap-1 sm:gap-4">
                                            <span className="font-bold text-slate-500 text-[0.875em] sm:w-24 shrink-0">Explanation</span>
                                            <p className="text-slate-800 text-[0.875em] font-medium leading-relaxed">{feedback.explanation_eng}</p>
                                        </div>
                                    )}
                                    {feedback.corrected_sentence && (
                                        <div className="flex flex-col sm:flex-row gap-1 sm:gap-4">
                                            <span className="font-bold text-slate-500 text-[0.875em] sm:w-24 shrink-0">Correction</span>
                                            <p className="text-slate-900 text-[1.125em] font-black leading-relaxed">{feedback.corrected_sentence}</p>
                                        </div>
                                    )}
                                    {!feedback.is_relevant && (
                                        <div className="flex flex-col sm:flex-row gap-1 sm:gap-4">
                                            <span className="font-bold text-slate-500 text-[0.875em] sm:w-24 shrink-0">Relevance</span>
                                            <p className="text-slate-800 text-[0.875em] font-medium leading-relaxed">{feedback.relevance_feedback_eng || "This answer doesn't seem relevant to the question."}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const DiscussQuestionItem = ({ item, themeColor }) => {
            const [text, setText] = useState('');
            const [showTranslation, setShowTranslation] = useState(false);

            return (
                <div className="mb-12 border-b border-slate-100 pb-12 last:mb-0 last:border-0 last:pb-0">

                        keyPhrases={
                            <div className="mb-10 space-y-4">

                                    <h4 className="font-bold text-slate-900 text-[1.125em]">핵심 표현</h4>
                                </div>

                                <div className="space-y-4 pl-1">
                                    {item.vocab.map((v, i) => (
                                        <div key={i} className={`pl-4 border-l-4 border-${themeColor}-500`}>

        const DiscussView = ({ updateProgress, themeColor }) => {
            return (
                <div className="w-full animate-fade-in max-w-7xl mx-auto" style={{ fontSize: '1.35rem' }}>
                    <div className="flex items-center gap-4 mb-8">
                        <div className={`w-[4rem] h-[4rem] bg-${themeColor}-100 rounded-2xl flex items-center justify-center shrink-0`}>
                            <DiscussIcon className="w-10 h-10 text-current" />
                        </div>
                        <div className="flex flex-col">
                            <h2 className="text-[1.875em] font-normal text-slate-900 font-surround">생각해 보기</h2>
                        </div>
                    </div>

                    <div className={`mb-8 p-4 rounded-2xl bg-${themeColor}-50 border border-${themeColor}-100`}>
                        <div className="text-slate-800 text-[0.875em] font-medium leading-relaxed">
                            <p>AI Feedback은 Gemini 웹페이지에서만 작용하기 때문에 Github 웹페이지에서 사용할 수 없어요.</p>
                            
                            <p className="flex flex-wrap items-center gap-1 mt-2">
                                AI Feedback 기능을 사용하기 원할 경우, 다음 링크를 클릭하세요: 
                                <a 
                                    href="https://gemini.google.com/share/d29790787c5a" 
                                    target="_blank" 
                                    rel="noopener noreferrer" 
                                    className={`font-bold text-${themeColor}-600 hover:underline inline-flex items-center gap-0.5`}
                                >
                                    Gemini AI Feedback
                                    <ExternalLinkIcon className="w-3 h-3" />
                                </a>
                            </p>
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 md:p-10">
                        {DISCUSS_DATA.map((item) => (
                            <DiscussQuestionItem 
                                key={item.id}
                                item={item}
                                themeColor={themeColor}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
            const [userLevel] = useState("B2+");
            
            const [autoScroll, setAutoScroll] = useState(true);
            const [showVocab, setShowVocab] = useState(false);
            const [playbackRate, setPlaybackRate] = useState(1.0);

            const [progress, setProgress] = useState({
                learn: false,
                vocab: false,
                quiz: 0,
                discuss: false
            });

            const themeColor = useMemo(() => getLevelTheme(userLevel), [userLevel]);

            const updateProgress = useCallback((key, value = true) => {
                setProgress(prev => {
                    if (prev[key] === value) return prev;
                    return { ...prev, [key]: value };
                });
            }, []);

            const handleSpeedChange = (e) => {
                const rate = parseFloat(e.target.value);
                setPlaybackRate(rate);
            };

            // Custom navigation handler for sidebar to control collapse state
            const handleSidebarNavigation = (tabId) => {
                setActiveTab(tabId);
                // "동영상 자료"(learn) 클릭 시 사이드바 접음
                if (tabId === 'learn') {
                    setIsSidebarCollapsed(true);
                } 
                // "시작 페이지", "핵심 어휘", "내용 확인 퀴즈", "생각해 보기" 클릭 시 사이드바 펼침
                else {
                    setIsSidebarCollapsed(false);
                }
            };

            const mainPaddingClass = useMemo(() => {
                switch(activeTab) {
                    case 'home': return 'p-[1.25rem]';    
                    case 'learn': return 'p-[0.125rem]';    
                    case 'vocab': return 'p-[1rem]';   
                    case 'quiz': return 'p-[0.25rem]';     
                    case 'discuss': return 'p-[0.125rem]';  
                    default: return 'p-[1.25rem]';
                }
            }, [activeTab]);

            useEffect(() => {
                const handleResize = () => {
                    if (window.innerWidth < 1024) {
                        setIsSidebarCollapsed(true);
                    } else {
                        setIsSidebarCollapsed(false);
                    }
                };
                window.addEventListener('resize', handleResize);
                handleResize(); 
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const toggleSidebar = () => {
                setIsSidebarCollapsed(!isSidebarCollapsed);
            };

            const renderContent = () => {
                switch(activeTab) {
                    case 'home': return <HomeView setActiveTab={setActiveTab} progress={progress} userLevel={userLevel} themeColor={themeColor} />;
                    case 'learn': return <LearnView 
                                            updateProgress={updateProgress} 
                                            themeColor={themeColor}
                                            autoScroll={autoScroll}
                                            showVocab={showVocab}
                                            playbackRate={playbackRate}
                                            />;
                    case 'vocab': return <VocabView updateProgress={updateProgress} themeColor={themeColor} />;
                    case 'quiz': return <QuizView updateProgress={updateProgress} themeColor={themeColor} />;
                    case 'discuss': return <DiscussView updateProgress={updateProgress} themeColor={themeColor} />;
                    default: return <HomeView setActiveTab={setActiveTab} progress={progress} userLevel={userLevel} themeColor={themeColor} />;
                }
            };

            const renderHeader = () => {
                const headerScale = activeTab === 'learn' ? '1.0rem' : '1.3rem';

                if (activeTab === 'learn') {
                    const themeHex = LEVEL_THEMES[userLevel]?.hex || '#22c55e';

                    return (
                        <div 
                            className="flex items-center justify-between h-full px-6 border-b border-slate-100 bg-white/90 backdrop-blur"
                            style={{ fontSize: headerScale }}
                        >
                            <div className="flex items-center gap-3">
                                <div className={`p-2 rounded-lg bg-${themeColor}-50`}>
                                    <LearnIcon className={`w-5 h-5 text-${themeColor}-600`} />
                                </div>
                                <div className="flex flex-col">
                                    <h1 className="text-[1.125em] font-normal text-slate-900 font-surround leading-none">동영상 & 스크립트</h1>
                                </div>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2 cursor-pointer group" onClick={() => setAutoScroll(!autoScroll)}>
                                    <div className={`w-9 h-5 rounded-full relative transition-colors duration-200 ease-in-out ${autoScroll ? `bg-${themeColor}-500` : 'bg-slate-300'}`}>
                                        <div className={`absolute top-1 w-3 h-3 bg-white rounded-full shadow-sm transition-transform duration-200 ${autoScroll ? 'left-5' : 'left-1'}`}></div>
                                    </div>
                                    <span className="text-[0.875em] font-bold text-slate-600 group-hover:text-slate-800 transition-colors whitespace-nowrap hidden sm:inline">자동 스크롤</span>
                                </div>

                                <div className="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                                    <SpeedSolidIcon className="w-4 h-4 text-slate-500" />
                                    <div className="flex items-center gap-2">
                                        <span className="text-[0.625em] font-medium text-slate-400">0.5x</span>
                                        <input 
                                            type="range" min="0.5" max="1.0" step="0.01" 
                                            value={playbackRate} onChange={handleSpeedChange}
                                            className="w-20 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                                            style={{ '--thumb-color': themeHex }} 
                                        />
                                        <span className="text-[0.625em] font-medium text-slate-400">1.0x</span>
                                    </div>
                                    <span className={`text-[0.75em] font-bold text-${themeColor}-700 min-w-[2.5rem] text-center`}>{playbackRate.toFixed(2)}x</span>
                                </div>

                                <button 
                                    onClick={() => setShowVocab(!showVocab)}
                                    className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border transition-all shadow-sm ${showVocab ? 'bg-slate-100 border-slate-300' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                                >
                                    <OpenBookSolidIcon className="w-4 h-4 text-slate-600" />
                                    <span className="text-[0.875em] font-bold text-slate-700 whitespace-nowrap hidden sm:inline">핵심 어휘</span>
                                </button>
                            </div>
                        </div>
                    );
                }
                
                // Header for other tabs
                return (
                    <div 
                        className="flex items-center justify-between h-full px-6 border-b border-slate-100 bg-white/90 backdrop-blur"
                        style={{ fontSize: headerScale }}
                    >
                         <div className="flex items-center gap-3">
                            {/* Placeholder or specific content for other headers if needed */}
                        </div>
                    </div>
                );
            };

            const isLearnTab = activeTab === 'learn';

            return (
                <div className="flex min-h-screen bg-[#f9fafb]">
                    <Sidebar 
                        activeTab={activeTab} 
                        setActiveTab={handleSidebarNavigation} 
                        isCollapsed={isSidebarCollapsed} 
                        toggleSidebar={toggleSidebar}
                        userLevel={userLevel}
                        themeColor={themeColor}
                    />
                    <div className={`flex-1 flex flex-col transition-all duration-300 ease-in-out ${isSidebarCollapsed ? 'md:ml-[5.5rem]' : 'md:ml-64'}`}>
                        <header className={`h-16 bg-white sticky top-0 z-40 transition-all duration-300 ${isSidebarCollapsed ? 'md:left-[5.5rem]' : 'md:left-64'}`}>
                            {renderHeader()}
                        </header>
                        <main className={`flex-1 ${mainPaddingClass} flex flex-col ${isLearnTab ? 'overflow-hidden h-[calc(100vh-4rem)]' : 'min-h-[calc(100vh-4rem)]'}`}>
                            {renderContent()}
                        </main>
                    </div>
                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-3 z-50">
                        {['home','learn','vocab','quiz','discuss'].map(t=><button key={t} onClick={()=>setActiveTab(t)} className={`p-2 rounded-lg ${activeTab===t ? `text-${themeColor}-600 bg-${themeColor}-50` : 'text-slate-400'}`}>{t==='home'?<HomeIcon className="w-6 h-6"/>:t==='learn'?<LearnIcon className="w-6 h-6"/>:t==='vocab'?<VocabIcon className="w-6 h-6"/>:t==='quiz'?<QuizIcon className="w-6 h-6"/>:<DiscussIcon className="w-6 h-6"/>}</button>)}
                    </nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
