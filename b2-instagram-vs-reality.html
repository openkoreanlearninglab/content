            const apiKey = ""; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        if (response.status === 401 || response.status === 403) {
                            throw new Error(`API 인증 오류(HTTP ${response.status})입니다. 유효한 API 키가 필요합니다.\n${errorText}`);
                        }
                        if (response.status === 400) {
                             throw new Error(`잘못된 요청(HTTP 400)입니다.\n${errorText}`);
                        }
                        throw new Error(`HTTP Error: ${response.status} - ${errorText}`);
                    }

                    return await response.json();
                } catch (error) {
                    if (error.message.includes('인증 오류') || error.message.includes('잘못된 요청')) {
                        throw error;
                    }
                    if (i === maxRetries) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

                const prompt = `당신은 한국어 학습자를 돕는 'AI 한국어 도우미'입니다.
학습자가 질문에 대해 작성한 답변을 분석하고, 아래의 JSON 형식으로 피드백을 제공해주세요.
반드시 마크다운 백틱 문자를 제외하고 순수 JSON 문자열만 반환하세요.

[질문]: ${item.questionKor}
[학습자 답변]: ${text}

[JSON 응답 포맷]:
{
  "overallPraise": "학습자의 답변에 대한 총평과 잘한 점 (한국어)",

      "explanationTrans": "설명의 영어 번역"
    }
  ]
}`;

                const payload = {
                    contents: [{ role: "user", parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" },
                    safetySettings: [
                         { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },

                         { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                         { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }

                    resultText = resultText.replace(/^```json\n?/, '').replace(/\n?```$/, '');

                <div className="mb-16 group print:mb-8 print:break-inside-avoid">
                    <div className="flex items-center gap-4 mb-6 print:mb-2"><span className="text-4xl font-serif font-bold text-gray-200 group-hover:text-gray-900 transition-colors duration-300 print:text-[14px] print:text-black">{item.id < 10 ? '0' + item.id : item.id}</span><h3 className="text-xl font-serif font-bold text-gray-900 leading-normal print:text-[12px]">{item.questionKor}</h3></div>
                    <div className="pl-0 md:pl-14 print:pl-6">
                        <div className="flex gap-2 mb-4 print:hidden"><TransBtn onClick={() => setShowTranslation(!showTranslation)} isShowing={showTranslation} />{showTranslation && (<p className="text-sm font-sans text-gray-500 animate-fade-in">{item.questionEng}</p>)}</div>
                        <div className="bg-gray-50 p-5 mb-6 border-l-2 border-black print:bg-transparent print:p-0 print:border-l-[1px] print:border-gray-300 print:pl-3 print:mb-2">
                            <span className="text-xs font-bold font-sans text-gray-400 uppercase mb-2 block print:hidden">핵심 어휘</span>
                            <div className="space-y-2 print:space-y-0.5">
                                {item.vocab.map((v, i) => (
                                    <div key={i} className="flex flex-col">
                                        <p className="text-sm font-serif text-gray-700 whitespace-pre-line print:text-[10px]"><span className="font-bold text-black mr-2 print:text-[10px] print:mr-1">{v.term}</span>{v.def}</p>
                                        <p className={`text-xs font-sans text-gray-500 mt-1 whitespace-pre-line ${showTranslation ? 'animate-fade-in block' : 'hidden'} print:hidden`}><span className="font-semibold text-gray-600 mr-1">{v.termEng} :</span>{v.defEng}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="여기에 생각을 적어보세요..." className="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300 print:hidden"></textarea>
                        <div className="flex justify-end print:hidden">
                            <button onClick={handleGetFeedback} disabled={!text.trim() || isLoadingFeedback} className={`px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors ${!text.trim() || isLoadingFeedback ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}`}>
                                {isLoadingFeedback ? '생성 중...' : 'AI 피드백 받기'}
                            </button>
                        </div>
                        
                        {isLoadingFeedback && (
                            <div className="mt-6 p-6 border border-gray-200 flex flex-col items-center justify-center print:hidden">
                                <div className="w-6 h-6 border-2 border-gray-200 border-t-black rounded-full animate-spin mb-3"></div>
                                <p className="text-sm font-sans text-gray-500">AI 한국어 도우미가 피드백을 작성 중입니다...</p>
                            </div>
                        )}
                        {feedbackError && (
                            <div className="mt-6 p-4 bg-red-50 text-red-600 text-sm font-sans print:hidden whitespace-pre-wrap">
                                {feedbackError}
                            </div>
                        )}
                        {feedback && (
                            <div className="mt-8 relative print:hidden animate-fade-in">
                                <div className="flex items-center gap-2 mb-4">
                                    <SparklesIcon className="w-4 h-4 text-black" />
                                    <h4 className="text-base font-bold font-sans text-black">AI 한국어 도우미</h4>
                                </div>
                                
                                <div className="bg-gray-50 p-5 mb-6">
                                    <span className="text-xs font-bold font-sans text-gray-500 uppercase block mb-2">총평 및 잘한 점</span>
                                    <p className="text-[15px] font-serif text-gray-900 leading-relaxed">{feedback.overallPraise}</p>
                                    {showFeedbackTrans && feedback.overallPraiseTrans && (
                                        <p className="text-[13px] font-serif text-gray-500 mt-2 pt-2 border-t border-gray-200 animate-fade-in">{feedback.overallPraiseTrans}</p>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    <span className="text-xs font-bold font-sans text-gray-500 uppercase block mb-1">문장별 교정 및 설명</span>
                                    {feedback.corrections?.map((c, i) => (
                                        <div key={i} className="border border-gray-200 p-5 bg-white">
                                            <div className="flex flex-col gap-3 mb-4">
                                                <div className="flex items-start gap-3">
                                                    <span className="shrink-0 px-2 py-0.5 bg-gray-100 text-gray-500 text-[10px] font-bold font-sans rounded-sm mt-0.5">수정 전</span>
                                                    <p className="text-[15px] font-serif text-gray-400 line-through leading-relaxed">{c.original}</p>
                                                </div>
                                                <div className="flex items-start gap-3">
                                                    <span className="shrink-0 px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-bold font-sans rounded-sm mt-0.5">수정 후</span>
                                                    <p className="text-[15px] font-serif text-gray-900 font-medium leading-relaxed">{c.corrected}</p>
                                                </div>
                                            </div>
                                            
                                            <div className="pt-3 border-t border-gray-100">
                                                <div className="flex items-start gap-2">
                                                    <span className="shrink-0 text-yellow-500 mt-0.5">💡</span>
                                                    <div className="flex-1">
                                                        <p className="text-[14px] font-serif text-gray-700 leading-relaxed">
                                                            <span className="font-bold text-gray-500 text-xs font-sans mr-2">설명</span>
                                                            {c.explanation}
                                                        </p>
                                                        {showFeedbackTrans && c.explanationTrans && (
                                                            <p className="text-[13px] font-serif text-gray-500 mt-2 pt-2 border-t border-gray-50 animate-fade-in leading-relaxed">{c.explanationTrans}</p>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                {/* 번역 버튼: 하단 우측, opacity-40 */}
                                <div className="flex justify-end mt-4">
                                    <TransBtn 
                                        onClick={() => setShowFeedbackTrans(!showFeedbackTrans)} 
                                        isShowing={showFeedbackTrans} 
                                        className="opacity-40 hover:opacity-100 transition-opacity" 
                                    />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        const DiscussView = ({ updateProgress }) => (
            <div className="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in print:pt-4 print:px-0">
                <div className="mb-6 pb-6 text-center print:mb-4 print:pb-2"><h2 className="text-[32px] md:text-[36px] font-serif font-bold text-gray-900 mb-2 print:text-[18px]">생각해 보기</h2><p className="text-sm font-sans text-gray-500 print:text-[12px]">학습 자료에 대해 심층적으로 생각해 보세요.</p></div>
                <div className="bg-gray-50 border border-gray-200 p-4 mb-10 flex items-start gap-3 print:hidden"><div className="shrink-0 mt-0.5"><SparklesIcon className="w-4 h-4 text-gray-400" /></div><p className="text-xs font-sans text-gray-600 leading-relaxed">AI 피드백은 현재 Gemini 웹에서만 가능합니다. <a href="https://gemini.google.com/share/abd1f131bc12" target="_blank" rel="noreferrer" className="underline decoration-gray-400 underline-offset-2 hover:text-black inline-flex items-center gap-1">Gemini에서 열기 <ExternalLinkIcon className="w-3 h-3" /></a></p></div>
                {DISCUSS_DATA.map((item) => (<DiscussQuestionItem key={item.id} item={item} />))}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home'); const [userLevel] = useState("B2"); const [showVocab, setShowVocab] = useState(false); const [progress, setProgress] = useState({ learn: false, vocab: false, quiz: 0, discuss: false });
            const [isHeaderExpanded, setIsHeaderExpanded] = useState(true);

            useEffect(() => {
                if (activeTab === 'video') { setIsHeaderExpanded(false); } else { setIsHeaderExpanded(true); }
            }, [activeTab]);

            const updateProgress = useCallback((key, value = true) => { setProgress(prev => { if (prev[key] === value) return prev; return { ...prev, [key]: value }; }); }, []);
            
            const renderContent = () => { 
                switch(activeTab) { 
                    case 'home': return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; 
                    case 'video': return <LearnView updateProgress={updateProgress} />;
                    case 'vocab': return <VocabView updateProgress={updateProgress} />; 
                    case 'quiz': return <QuizView updateProgress={updateProgress} />; 
                    case 'discuss': return <DiscussView updateProgress={updateProgress} />; 
                    default: return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; 
                } 
            };
            
            const isVideoTab = activeTab === 'video';
            return (
                <div className={`flex flex-col bg-white text-gray-900 selection:bg-gray-200 selection:text-black font-sans ${isVideoTab ? 'h-screen overflow-hidden' : 'min-h-screen'} print:block print:h-auto print:min-h-0 print:m-0 print:p-0 print:overflow-visible`}>
                    <Header isExpanded={isHeaderExpanded} setIsExpanded={setIsHeaderExpanded} activeTab={activeTab} setActiveTab={setActiveTab} />
                    <div className="lg:hidden h-14 border-b border-gray-100 flex items-center justify-center sticky top-0 bg-white z-40 print:hidden"><span className="text-lg font-bold font-sans tracking-tighter">OpenKoreanLearningLab</span></div>
                    <main className={`flex-1 relative flex flex-col ${isVideoTab ? 'overflow-x-hidden lg:overflow-hidden lg:h-full' : ''} print:block print:overflow-visible print:h-auto`}>{renderContent()}</main>
                    <nav className="lg:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 z-50 print:hidden">{NAV_ITEMS.map((item) => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 ${activeTab === item.id ? 'text-black' : 'text-gray-300'}`}><item.icon className="w-6 h-6" /></button>))}</nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
