            const apiKey = ""; const apiUrl = `${CONFIG.GEMINI_API_URL}?key=${apiKey}`; const delays = CONFIG.API_RETRY_DELAYS;
            for (let i = 0; i <= delays.length; i++) {

                    } 
                    return await response.json(); 
                } catch (error) {

                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                    if (e.code === 'Space') { e.preventDefault(); const player = videoState.player; if (player && typeof player.getPlayerState === 'function') { if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); } }
                    if (e.code === 'ArrowLeft') { e.preventDefault(); const currentIndex = SCRIPT_DATA.findIndex(line => line.id === activeLine); if (currentIndex > 0) handleLineClick(SCRIPT_DATA[currentIndex - 1].time[0]); }
                    if (e.code === 'ArrowRight') { e.preventDefault(); const currentIndex = SCRIPT_DATA.findIndex(line => line.id === activeLine); if (currentIndex !== -1 && currentIndex < SCRIPT_DATA.length - 1) handleLineClick(SCRIPT_DATA[currentIndex + 1].time[0]); else if (currentIndex === -1 && SCRIPT_DATA.length > 0) handleLineClick(SCRIPT_DATA[0].time[0]); }
                };
                window.addEventListener('keydown', handleKeyPress); return () => window.removeEventListener('keydown', handleKeyPress);
            }, [videoState.player, activeLine]);

            const startInterval = () => { 
                stopInterval(); 
                intervalRef.current = setInterval(() => {
                    const p = playerRef.current; 
                    if (p && p.getCurrentTime) { 
                        const time = p.getCurrentTime(); 
                        setVideoState(prev => ({ ...prev, currentTime: time })); 
                        const currentLine = SCRIPT_DATA.find(line => time >= line.time[0] && time < line.time[1]); 
                        if (currentLine) setActiveLine(currentLine.id); 
                    }
                }, 200); 
            };
            
            const stopInterval = () => { 
                if (intervalRef.current) { 
                    clearInterval(intervalRef.current); 
                    intervalRef.current = null; 
                } 
            };

            useEffect(() => { 
                if (popup.show) return; 
                if (activeLine && autoScroll && scriptRefs.current[activeLine]) {
                    scriptRefs.current[activeLine].scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                }
            }, [activeLine, autoScroll, popup.show, layoutMode]);

            const handleLineClick = (time) => { const player = videoState.player; if (player) { player.seekTo(time, true); player.playVideo(); } };
            const toggleTranslation = (id) => setTranslations(prev => ({...prev, [id]: !prev[id]}));
            const scrollToVocab = (term) => { const element = sidebarVocabRefs.current[term]; if (element) element.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
            
            const handleVocabEnter = (e, wordData) => { if (popup.fixed) return; const rect = e.target.getBoundingClientRect(); setPopup({ show: true, fixed: false, data: wordData, x: rect.left + rect.width / 2, y: rect.bottom }); if (showVocab) { setActiveVocabTerm(wordData.term); scrollToVocab(wordData.term); } };
            const handleVocabLeave = () => { if (popup.fixed) return; setPopup(prev => ({ ...prev, show: false })); };
            const handleVocabClick = (e, wordData) => { e.stopPropagation(); if (popup.fixed && popup.data && popup.data.term === wordData.term) { setPopup(prev => ({ ...prev, show: false, fixed: false })); return; } const rect = e.target.getBoundingClientRect(); setPopup({ show: true, fixed: true, data: wordData, x: rect.left + rect.width / 2, y: rect.bottom }); if (showVocab) { setActiveVocabTerm(wordData.term); scrollToVocab(wordData.term); } };

            const handleSeek = (e) => { const time = parseFloat(e.target.value); if (videoState.player) videoState.player.seekTo(time, true); setVideoState(prev => ({ ...prev, currentTime: time })); };
            const togglePlay = () => { const player = videoState.player; if (player) { if (videoState.isPlaying) player.pauseVideo(); else player.playVideo(); } };
            const rewind2 = () => { const player = videoState.player; if (player) { const newTime = Math.max(0, videoState.currentTime - 1.5); player.seekTo(newTime, true); setVideoState(prev => ({ ...prev, currentTime: newTime })); } };
            const forward2 = () => { const player = videoState.player; if (player) { const newTime = Math.min(videoState.duration, videoState.currentTime + 1.5); player.seekTo(newTime, true); setVideoState(prev => ({ ...prev, currentTime: newTime })); } };
            const formatTime = (seconds) => { if (isNaN(seconds)) return "00:00"; const date = new Date(seconds * 1000); const mm = date.getUTCMinutes(); const ss = date.getUTCSeconds(); return `${mm.toString().padStart(2, '0')}:${ss.toString().padStart(2, '0')}`; };

            const allVocabTerms = useMemo(() => { return VIDEO_VOCAB_DATA.flatMap(vocab => { const terms = [vocab.term]; if (vocab.variants) terms.push(...vocab.variants); if (vocab.subDefs) terms.push(...vocab.subDefs.map(s => s.subTerm)); return [...new Set(terms)].filter(t => t).map(term => ({ term, vocab })); }).sort((a, b) => b.term.length - a.term.length); }, []);

            const renderTextWithVocab = (text) => {
                if (!text) return [""];
                const matches = [];
                allVocabTerms.forEach(({ term, vocab }) => { let index = 0; while ((index = text.indexOf(term, index)) !== -1) { const end = index + term.length; const overlaps = matches.some(m => (index >= m.start && index < m.end) || (end > m.start && end <= m.end) || (index <= m.start && end >= m.end)); if (!overlaps) matches.push({ start: index, end, term, vocab }); index += 1; } });
                matches.sort((a, b) => a.start - b.start);
                const result = []; let lastIndex = 0;
                matches.forEach((match, idx) => { if (match.start > lastIndex) result.push(text.substring(lastIndex, match.start)); const isActive = (popup.show && popup.data && popup.data.term === match.vocab.term) || (showVocab && activeVocabTerm === match.vocab.term); 
                result.push(<span key={`${match.term}-${idx}`} className={`cursor-pointer border-b border-dotted transition-all duration-200 font-medium inline-block leading-tight ${isActive ? 'border-black bg-white text-black border-solid' : 'border-gray-400 text-gray-800 hover:border-black hover:text-black'}`} onMouseEnter={(e) => handleVocabEnter(e, match.vocab)} onMouseLeave={handleVocabLeave} onClick={(e) => handleVocabClick(e, match.vocab)}>{match.term}</span>); lastIndex = match.end; });
                if (lastIndex < text.length) result.push(text.substring(lastIndex));
                return result;
            };

            const isScriptMode = layoutMode === 'script';
            const isVideoOnlyMode = layoutMode === 'video';
            const isSplitMode = layoutMode === 'split';

            // Toolbar with Responsive logic
            const LearnToolbar = () => (
                <div className="sticky top-0 z-40 h-16 flex items-center justify-between px-6 py-3 bg-white border-b border-gray-200 shadow-sm pr-12 print:hidden">
                    <div className="flex items-center gap-1 shrink-0">
                        <button onClick={() => setLayoutMode('split')} className={`px-3 py-1.5 text-xs font-bold font-ui uppercase tracking-widest transition-colors ${layoutMode === 'split' ? 'bg-black text-white' : 'text-gray-400 hover:text-black'}`}>동영상 & 스크립트</button>
                        <button onClick={() => setLayoutMode('video')} className={`hidden sm:block px-3 py-1.5 text-xs font-bold font-ui uppercase tracking-widest transition-colors ${layoutMode === 'video' ? 'bg-black text-white' : 'text-gray-400 hover:text-black'}`}>동영상만 보기</button>
                        <button onClick={() => setLayoutMode('script')} className={`hidden sm:block px-3 py-1.5 text-xs font-bold font-ui uppercase tracking-widest transition-colors ${layoutMode === 'script' ? 'bg-black text-white' : 'text-gray-400 hover:text-black'}`}>스크립트만 보기</button>
                    </div>
                    
                    <div className="hidden sm:flex items-center gap-4 flex-1 justify-end min-w-0">
                        <div className="flex items-center gap-4 flex-1 max-w-xl justify-end">
                            <div className="hidden md:flex flex-col flex-1 gap-1 w-full">
                                <div className="relative group h-2 flex items-center">
                                    <div className="absolute inset-0 flex items-center">
                                        <div className="w-full h-[1px] bg-gray-200 group-hover:h-[2px] transition-all"></div>
                                        <div className="absolute left-0 top-1/2 -translate-y-1/2 h-[2px] bg-black" style={{ width: `${(videoState.currentTime/videoState.duration)*100}%` }}></div>
                                    </div>
                                    <input type="range" min="0" max={videoState.duration || 100} value={videoState.currentTime} onChange={handleSeek} className="absolute inset-0 w-full opacity-0 cursor-pointer" />
                                </div>
                                <span className="text-[10px] font-mono text-gray-400 text-right leading-none">{formatTime(videoState.currentTime)} / {formatTime(videoState.duration)}</span>
                            </div>
                            <div className="flex items-center gap-3 shrink-0">
                                <button onClick={rewind2} className="text-gray-400 hover:text-black transition-colors"><RewindIcon className="w-4 h-4" /></button>
                                <button onClick={togglePlay} className="w-4 h-4 border border-black rounded-full flex items-center justify-center hover:bg-black hover:text-white transition-all">
                                    {videoState.isPlaying ? <PauseIcon className="w-2 h-2 fill-current" /> : <PlayIconSolid className="w-2 h-2 fill-current ml-[1px]" />}
                                </button>
                                <button onClick={forward2} className="text-gray-400 hover:text-black transition-colors"><ForwardIcon className="w-4 h-4" /></button>
                            </div>
                        </div>
                        
                        <div className="h-4 w-px bg-gray-200"></div>
                        
                        <div className="relative shrink-0 flex group">
                            <button onClick={() => setIsSpeedMenuOpen(!isSpeedMenuOpen)} className="flex items-center gap-1.5 text-xs font-bold font-ui uppercase tracking-wider text-gray-500 hover:text-black">
                                {playbackRate.toFixed(1)}x
                            </button>
                            {isSpeedMenuOpen && (
                                <>
                                <div className="fixed inset-0 z-40" onClick={() => setIsSpeedMenuOpen(false)}></div>
                                <div className="absolute top-full right-0 mt-2 bg-white border border-gray-200 shadow-xl p-1 z-50 w-20 animate-fade-in">
                                    {[0.5, 0.75, 1.0, 1.25, 1.5, 2.0].map(speed => (
                                        <button key={speed} onClick={() => { setPlaybackRate(speed); setIsSpeedMenuOpen(false); }} className={`w-full text-center py-1.5 text-[10px] font-bold font-ui hover:bg-white ${playbackRate === speed ? 'text-black' : 'text-gray-400'}`}>{speed}x</button>
                                    ))}
                                </div>
                                </>
                            )}
                        </div>

                        <button onClick={() => setAutoScroll(!autoScroll)} className={`flex items-center gap-2 text-[10px] font-bold font-ui uppercase tracking-widest transition-colors ${autoScroll ? 'text-black' : 'text-gray-300 hover:text-gray-500'}`}>
                            <span className={`w-2 h-2 rounded-full ${autoScroll ? 'bg-black' : 'border border-gray-300'}`}></span>
                            <span className="hidden md:inline">자동 스크롤</span>
                        </button>

                        <button onClick={() => setShowVocab(!showVocab)} className={`hidden xl:flex items-center gap-2 px-3 py-1.5 border transition-all text-[10px] font-bold font-ui uppercase tracking-widest ${showVocab ? 'bg-black text-white border-black' : 'bg-white border-gray-200 text-gray-500 hover:border-black hover:text-black'}`}>어휘</button>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-full animate-fade-in bg-white">
                    <LearnToolbar />
                    <div className={`flex flex-col lg:flex-row flex-1 overflow-hidden relative print:flex print:flex-row print:h-auto print:overflow-visible print:items-start`}>
                        <VideoVocabPopup popup={popup} onGlobalClick={handleGlobalClick} />
                        
                        <div className={`bg-black overflow-hidden relative transition-all duration-300 ${isScriptMode ? 'hidden' : ''} ${layoutMode === 'video' ? 'flex-1 h-full' : ''} ${layoutMode === 'split' ? 'w-full aspect-video lg:h-full lg:aspect-auto lg:w-7/12 xl:w-7/12 shrink-0' : ''} ${showVocab && layoutMode === 'split' ? 'xl:flex-1' : ''} print:hidden`}>
                                {isLoading && (<div className="absolute inset-0 z-10 bg-black flex items-center justify-center"><div className="w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-spin"></div></div>)}
                                <div id="youtube-player" className={`w-full h-full`}></div>
                        </div>

                        <div className={`flex-1 flex flex-col min-h-0 bg-white border-l border-gray-200 transition-all duration-300 ${isVideoOnlyMode ? 'hidden print:flex' : ''} ${isScriptMode ? 'w-full border-none' : ''} ${layoutMode === 'split' ? 'lg:w-5/12 xl:w-5/12 lg:flex-none' : ''} ${showVocab && layoutMode === 'split' ? 'xl:w-4/12' : ''} print:flex print:w-[80%] print:border-r print:border-gray-200 print:flex-none print:h-auto print:overflow-visible print:pr-4`}>
                            <div className={`flex-1 overflow-y-auto ${isScriptMode ? 'bg-white' : 'bg-white'} print:overflow-visible print:h-auto`}>
                                {/* Script Bubble Style - Always print this format */}
                                <div className={`w-full max-w-4xl lg:max-w-5xl mx-auto p-6 md:p-12 min-h-full bg-white print:p-0 print:m-0 print:max-w-none print:h-auto ${isScriptMode ? 'block' : 'hidden print:block'}`}>
                                    {SCRIPT_DATA.map((line, index) => {
                                        const isActive = activeLine === line.id;
                                        const isLeft = line.speaker === SCRIPT_DATA[0].speaker; 
                                        const alignClass = isLeft ? 'items-start' : 'items-end';
                                        const bubbleStyle = isLeft ? `bg-white rounded-2xl rounded-bl-none border border-transparent transition-shadow duration-300 hover:shadow-md ${isActive ? 'shadow-sm' : ''}` : `bg-white rounded-2xl rounded-br-none border border-transparent transition-shadow duration-300 hover:shadow-md ${isActive ? 'shadow-sm' : ''}`;
                                        const speakerTextSize = "text-xs sm:text-sm md:text-base lg:text-base xl:text-base";
                                        const korTextSize = "text-base sm:text-lg md:text-xl lg:text-2xl xl:text-3xl";
                                        const engTextSize = "text-xs sm:text-sm md:text-sm lg:text-sm xl:text-sm";

                                        return (
                                            <div key={line.id} ref={el => scriptRefs.current[line.id] = el} className={`mb-8 flex flex-col ${alignClass} group print:mb-2 print:break-inside-avoid print:items-start`}>
                                                <span className={`mb-2 font-bold font-ui uppercase tracking-widest text-gray-400 ${speakerTextSize} print:mb-0 print:text-[10px]`}>{line.speaker}</span>
                                                <div className={`relative p-6 max-w-[85%] transition-all duration-300 ${bubbleStyle} print:p-2 print:border-0 print:bg-transparent`} onClick={() => handleLineClick(line.time[0])}>
                                                    <p className={`font-serif leading-[1.8] tracking-wide text-left ${korTextSize} ${isActive ? 'text-black font-medium' : 'text-gray-700'} print:text-[12px]`}>{renderTextWithVocab(line.kor)}</p>
                                                    {translations[line.id] && (<p className={`font-serif text-gray-500 mt-3 animate-fade-in text-left border-t border-gray-100 pt-3 ${engTextSize} print:hidden`}>{line.eng}</p>)}
                                                    
                                                    {/* 변경점: 컨트롤 레이아웃 정렬 및 버튼 통일 적용 */}
                                                    <div className={`flex items-center gap-2 mt-4 pt-2 border-t border-transparent print:hidden ${isLeft ? 'justify-start' : 'justify-end'}`}>
                                                        <button onClick={(e) => { e.stopPropagation(); handleLineClick(line.time[0]); }} className="w-4 h-4 rounded-full border border-gray-300 flex items-center justify-center hover:bg-black hover:border-black hover:text-white transition-all text-gray-400 shrink-0">
                                                            <PlayIconSolid className="w-2 h-2 ml-[1px]" />
                                                        </button>
                                                        <TranslateBtn onClick={() => toggleTranslation(line.id)} isShowing={translations[line.id]} />
                                                    </div>
                                                    
                                                    {isLeft ? (<svg className="absolute -bottom-[1px] -left-[9px] w-3 h-4 print:hidden" viewBox="0 0 12 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 0 12 9 12 16C7 16 2 13 0 16L12 0Z" fill="white"/></svg>) : (<svg className="absolute bottom-0 -right-[9px] w-3 h-4 print:hidden" viewBox="0 0 12 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 0C0 0 0 9 0 16C5 16 10 13 12 16L0 0Z" fill="white"/></svg>)}
                                                </div>
                                            </div>
                                        );
                                    })}
                                    <div className="h-32 print:hidden"></div>
                                </div>
                                {/* Split View (List Style) - Hidden on print */}
                                <div className={`p-8 space-y-8 ${!isScriptMode ? 'block' : 'hidden'} print:hidden`}>
                                    {SCRIPT_DATA.map((line, index) => {
                                        const isActive = activeLine === line.id;
                                        const speakerTextSize = "text-xs sm:text-sm md:text-base lg:text-base xl:text-base";
                                        const korTextSize = "text-base sm:text-lg md:text-xl lg:text-xl xl:text-3xl";
                                        const engTextSize = "text-xs sm:text-sm md:text-sm lg:text-sm xl:text-sm";

                                        return (
                                            <div key={line.id} ref={el => scriptRefs.current[line.id] = el} className={`transition-all duration-500 ${isActive ? 'opacity-100' : 'opacity-60 hover:opacity-90'}`}>
                                                <div className={`flex items-center gap-2 mb-2 justify-start`}>
                                                    <span className={`font-bold font-ui uppercase tracking-widest text-gray-400 ${speakerTextSize}`}>{line.speaker}</span>
                                                    {isActive && <span className="w-1.5 h-1.5 bg-black rounded-full animate-pulse"></span>}
                                                </div>
                                                <div onClick={() => handleLineClick(line.time[0])} className="cursor-pointer group">
                                                    <p className={`font-serif leading-relaxed text-left ${korTextSize} ${isActive ? 'text-black' : 'text-[#1a1a1a]'}`}>{renderTextWithVocab(line.kor)}</p>
                                                    {translations[line.id] && (<p className={`font-serif text-gray-500 mt-2 animate-fade-in pl-3 border-l border-gray-200 text-left ${engTextSize}`}>{line.eng}</p>)}
                                                    <div className={`flex items-center gap-2 mt-2 opacity-0 group-hover:opacity-100 transition-opacity justify-start`}>
                                                        <button onClick={(e) => { e.stopPropagation(); handleLineClick(line.time[0]); }} className="w-4 h-4 rounded-full border border-gray-300 flex items-center justify-center hover:bg-black hover:border-black hover:text-white transition-all text-gray-400 shrink-0">
                                                            <PlayIconSolid className="w-2 h-2 ml-[1px]" />
                                                        </button>
                                                        <TranslateBtn onClick={() => toggleTranslation(line.id)} isShowing={translations[line.id]} />
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    <div className="h-32"></div>
                                </div>
                            </div>
                        </div>
                        {/* Video Vocab Sidebar - Always print in 8:2 layout */}
                        <div className={`w-80 flex-col bg-white border-l border-gray-200 animate-fade-in ${showVocab ? (isScriptMode ? 'fixed right-0 top-[64px] h-[calc(100vh-64px)] xl:flex' : 'h-full hidden xl:flex') : 'hidden'} print:flex print:w-[20%] print:static print:border-l-0 print:h-auto print:overflow-visible`}>
                            <div className="p-5 border-b border-gray-100 flex items-center justify-between bg-white print:p-2 print:border-b-0">
                                <span className="font-ui text-xs font-bold uppercase tracking-widest text-gray-900 print:text-[10px]">핵심 어휘</span>
                                <span className="text-xs font-serif text-gray-500 italic print:hidden">{VIDEO_VOCAB_DATA.length}개</span>
                            </div>
                            <div className="flex-1 overflow-y-auto bg-white print:overflow-visible print:h-auto">
                                {VIDEO_VOCAB_DATA.map((word, idx) => (<VideoSidebarVocabCard key={idx} word={word} activeVocabTerm={activeVocabTerm} sidebarVocabRefs={sidebarVocabRefs} />))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Header = ({ activeTab, setActiveTab, isExpanded, setIsExpanded }) => (
            <div className="hidden lg:block relative z-50 print:hidden">
                <header className={`fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100 flex items-center justify-between px-8 pr-20 transition-all duration-500 ease-in-out overflow-hidden ${isExpanded ? 'h-16 opacity-100' : 'h-0 opacity-0 border-none'}`}>
                    <div className="flex items-center cursor-pointer text-left" onClick={() => setActiveTab('home')}>
                        <span className="text-lg font-bold font-sans tracking-tighter text-black whitespace-nowrap">OpenKoreanLearningLab</span>
                    </div>
                    <nav className="flex items-center gap-8">
                        {NAV_ITEMS.map((menu) => (
                            <button key={menu.id} onClick={() => setActiveTab(menu.id)} className={`text-sm font-medium transition-colors font-sans relative ${activeTab === menu.id ? 'text-black' : 'text-gray-400 hover:text-gray-600'}`}>{menu.label}{activeTab === menu.id && <div className="absolute -bottom-6 left-0 w-full h-0.5 bg-black"></div>}</button>
                        ))}
                    </nav>
                </header>
                <button onClick={() => setIsExpanded(!isExpanded)} className={`fixed top-0 right-0 z-[60] w-10 h-16 bg-white flex items-center justify-center transition-colors hover:bg-gray-50 ${isExpanded ? 'border-b border-gray-100' : 'border-transparent'}`}><MenuIcon className="w-5 h-5 text-black" /></button>
            </div>
        );

        const HomeListItem = ({ title, description, onClick }) => (
            <div className="cursor-pointer group flex flex-col items-center text-center p-8 border border-transparent hover:bg-gray-50 transition-all rounded-sm print:p-2" onClick={onClick}>
                <h2 className="text-xl font-bold text-[#1a1a1a] mb-3 font-serif group-hover:text-gray-600 transition-colors print:text-[14px] print:mb-1">{title}</h2>
                <p className="text-sm text-[#444444] leading-relaxed font-serif print:text-[12px]">{description}</p>
            </div>
        );

        const HomeView = ({ setActiveTab, userLevel }) => {
            const levelInfo = LEVEL_DEFINITIONS[userLevel] || { title: "Unknown" };
            return (
                <div className="animate-fade-in max-w-5xl mx-auto w-full px-6 lg:px-0 pt-44 pb-16 flex flex-col items-center print:pt-0 print:pb-0">
                    <div className="flex flex-col items-center justify-center min-h-[40vh] md:min-h-[50vh] text-center border-b border-gray-100 mb-16 pb-10 w-full print:min-h-0 print:mb-4 print:pb-4">
                        <div className="flex items-center gap-3 mb-8 print:mb-2">
                            <span className="px-3 py-1 bg-gray-900 text-white text-[10px] font-sans font-bold tracking-widest uppercase print:text-[12px]">경제/정치</span>
                            <div className="flex items-center border border-gray-900 px-3 py-1 text-[10px] font-sans tracking-widest uppercase text-gray-900">
                                <span className="font-bold print:text-[12px]">{userLevel}</span><span className="mx-2 w-px h-2.5 bg-gray-300"></span><span className="font-medium print:text-[12px]">{levelInfo.title}</span>
                            </div>
                        </div>
                        <h1 className="font-serif text-4xl md:text-6xl lg:text-7xl text-black leading-tight mb-8 font-bold print:text-[22px] print:mb-2">코스피 5000’의 <br /> 의미와 전망</h1>
                        <p className="font-serif text-gray-500 text-sm md:text-lg italic mb-10 max-w-2xl leading-relaxed print:text-[16px] print:mb-4">한국 증시의 새로운 도약, 코스피 5000 시대.<br/>경제와 정치적 관점에서 그 의미와 향후 전망을<br/>심도 있게 분석해 봅니다.</p>
                        <div className="flex gap-3 print:hidden">
                            <button onClick={() => setActiveTab('video')} className="group flex items-center gap-3 px-8 py-3 bg-black text-white hover:bg-gray-800 transition-all duration-300 rounded-none mb-6"><span className="font-serif text-base font-bold tracking-wider">동영상 보기</span><VideoIcon className="w-4 h-4" /></button>
                            <button onClick={() => setActiveTab('reading')} className="group flex items-center gap-3 px-8 py-3 border border-gray-200 text-gray-900 hover:bg-gray-100 transition-all duration-300 rounded-none mb-6"><span className="font-serif text-base font-bold tracking-wider">본문 읽기</span><ArrowRightIcon className="w-4 h-4 transition-transform group-hover:translate-x-1" /></button>

                    case 'quiz': return <QuizView updateProgress={updateProgress} />; 
                    case 'discuss': return <DiscussView updateProgress={updateProgress} />; 
                    default: return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; 
                } 
            };
            
            const isFullscreenTab = activeTab === 'reading' || activeTab === 'video';
            
            return (
                <div className={`flex flex-col bg-white text-gray-900 selection:bg-gray-200 selection:text-black font-sans ${isFullscreenTab ? 'h-screen overflow-hidden print:h-auto print:overflow-visible' : 'min-h-screen'}`}>
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} isExpanded={isHeaderExpanded} setIsExpanded={setIsHeaderExpanded} />
                    <div className="lg:hidden h-14 border-b border-gray-100 flex items-center justify-center sticky top-0 bg-white z-40 print:hidden"><span className="text-lg font-bold font-sans tracking-tighter">OpenKoreanLearningLab</span></div>
                    <main className={`flex-1 relative flex flex-col ${isFullscreenTab ? 'overflow-x-hidden lg:overflow-hidden lg:h-full print:h-auto print:overflow-visible' : ''}`}>{renderContent()}</main>
                    <nav className="lg:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 z-50 print:hidden">{NAV_ITEMS.map((item) => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 ${activeTab === item.id ? 'text-black' : 'text-gray-300'}`}><item.icon className="w-6 h-6" /></button>))}</nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
