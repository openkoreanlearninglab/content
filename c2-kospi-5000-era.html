    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;
        const { createPortal } = ReactDOM;

        // --- Data & Config ---
        const CONFIG = { GEMINI_API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', API_RETRY_DELAYS: [1000, 2000, 4000, 8000, 16000] };
        
        const LEVEL_DEFINITIONS = { 
            "A1": { title: "Novice", desc: "Basic everyday expressions." }, "A1+": { title: "Pre-Beginner", desc: "Can handle slightly more than A1." },
            "A2": { title: "Beginner", desc: "Frequently used sentences." }, "A2+": { title: "Upper Beginner", desc: "Can speak a bit more smoothly." }, 
            "B1": { title: "Pre-Intermediate", desc: "Standard speech main points." }, "B1+": { title: "Lower Intermediate", desc: "Stronger B1. More comfortable carrying conversations." },
            "B2": { title: "Intermediate", desc: "Complex text main ideas." }, "B2+": { title: "Upper Intermediate", desc: "Near C1. Can argue a point logically." },
            "C1": { title: "Advanced", desc: "Long, demanding texts." }, "C1+": { title: "Upper Advanced", desc: "Very strong C1, approaching native-like flexibility." },
            "C2": { title: "Proficient", desc: "Can understand virtually everything heard or read." }
        };

        // 경제/사회 테마의 새로운 읽기 자료 데이터
        const READING_DATA = [
            { id: 1, title: "[기획] 코스피 5000,\n서민 경제와 무관한 숫자일까", subtitle: "뉴시안 · 이태영 기자", source: "https://www.newsian.co.kr/news/articleView.html?idxno=86040", level: "C1+", content: [
                { text: "“주가는 최고라는데 월세는 또 올랐다. 코스피 5000이 내 삶에 무슨 의미가 있나.”", trans: "", isQuote: true },
                { text: "", trans: "", isBlank: true },
                { text: "코스피가 5000선을 넘긴 날, 서울의 한 직장인 커뮤니티에 올라온 글이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "같은 날, 온라인 증권 커뮤니티에는 수익 인증 글이 줄을 이었다. 같은 숫자를 두고 전혀 다른 현실이 교차한 것이다. 이 장면은 코스피 5000을 둘러싼 논쟁의 출발점이 된다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "코스피 5000을 바라보는 시선은 극명하게 갈린다. 한쪽에서는 “나라가 잘 나가고 있다”는 평가가 나온다. 반대편에서는 “주가 상승은 자산을 가진 사람들의 이야기일 뿐”이라는 냉소가 이어진다. 이 질문은 단순한 체감도의 문제가 아니다. 증시와 실물, 자산과 노동이 어떻게 연결돼 있는가라는 한국 경제 구조의 본질을 묻는 문제로 분석된다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "비판론자들은 증시 상승이 자산 보유 계층에 편중돼 있다고 지적한다. 주가가 오를수록 자산 격차는 확대되고, 임금과 물가는 제자리에 머문다는 주장이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "한 사회경제 전문가는 “주가가 오르는 동안 월세와 생활비는 오히려 더 빨리 뛰었다”며 “증시 지수는 서민의 삶을 대표하는 지표가 아니다”라고 말했다. 실제로 과거 증시 호황기에도 체감 경기와의 괴리는 반복돼 왔다. 지수는 올랐지만, 고용의 질은 개선되지 않았고, 실질임금 상승률은 물가를 따라가지 못했다는 지적도 적지 않았다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "이런 경험은 ‘코스피 상승=내 삶과 무관’이라는 인식을 강화했다. 특히 주식 투자에 적극적으로 참여하지 못한 계층일수록 이 괴리는 더 크게 느껴진다는 점이 강조됐다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "반론도 존재한다. 증시는 서민 경제와 직접 연결되기보다는 고용·투자·기업 활동이라는 간접 경로를 통해 영향을 미친다는 설명이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "한 거시경제 전문가는 “주가 상승은 기업의 자본 조달 비용을 낮추고 투자 여력을 키운다”며 “이 과정이 설비 투자와 고용 확대로 이어질 경우, 효과는 결국 노동시장으로 흘러간다”고 말했다. 증시는 실물 경제의 ‘선행 지표’이지 ‘생활 지표’는 아니라는 것이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "문제는 이 연결 고리가 과거보다 약해졌다는 점이다. 기업 이익과 주가가 상승해도 투자와 고용으로 이어지지 않고, 내부 유보나 주주 환원에 머무는 구조가 고착화됐다는 지적이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "전문가들 사이에서는 “코스피 5000이 서민 경제와 무관하다고 단정하기도, 직접적이라고 말하기도 어렵다”는 중간 결론이 우세하다. 증시 성과가 임금·고용·복지로 이어지지 못하는 구조적 단절이 핵심으로 지적됐다. 특히 고용의 질, 비정규직 비중, 자영업 구조 등 한국 경제의 취약 지점은 주가 상승의 효과를 흡수하지 못하고 있다. 이 때문에 지수는 오르는데 체감 경기는 개선되지 않는 ‘비대칭 회복’이 반복된다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "개인 투자자의 비중이 커진 점도 이번 코스피 5000 국면의 특징이다. 주식이 더 이상 일부 계층의 전유물이 아닌 상황에서, 개인의 투자 방식은 시장 안정성뿐 아니라 가계 재무 구조 전반에 영향을 미친다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "한 금융 안정 전문가는 “차입을 동반한 투자가 늘어날수록 증시 조정은 개인 손실을 넘어 사회적 리스크로 확산될 수 있다”며 “지수 상승기일수록 개인 투자자의 위험 관리가 중요해진다”고 경고했다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "특히 \"자산 가격의 잔치로 남길 것인가, 아니면 투자·고용·임금으로 이어지는 선순환의 출발점으로 만들 것\"인가가 숙제로 남아 있다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "답은 시장에만 있지 않다. 정책의 방향, 기업의 투자 선택, 그리고 개인의 판단이 맞물릴 때 비로소 지수는 숫자를 넘어 삶의 지표가 된다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "코스피 5000은 도착점이 아니라, 한국 경제가 어디로 가고 있는지를 되묻는 이정표로 급부상하고 있다.", trans: "" }
            ]},
            { id: 2, title: "[칼럼] 코스피 5000 확실히 굳히려면", subtitle: "조선일보 · 박병원 (퇴계학연구원 이사장 / 前 청와대 경제수석)", source: "https://www.chosun.com/opinion/chosun_column/2026/02/19/BVEVGVW7QBEGZN6MHV2QES3QMU/", level: "C1+", content: [
                { text: "코스피 5000이라는 꿈같은 목표가 의외로 빨리 달성되었다. 한국 주식의 저평가 원인을 “소액주주가 대주주를 믿을 수가 없어서”라고 보는 배당 확대 독려, 이사의 주주에 대한 충실 의무 등 소액주주의 권한 강화, 자사주 소각 의무화, 그리고 배당소득 분리과세 등 밸류 업 정책이 어느 정도 효과가 있었던 것 같다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "정부는 여세를 몰아 비생산적 부동산 투기를 근절하여 더 많은 돈이 주식시장으로 흐르게 하겠다고 한다. 수요억제책만으로는 실패한다는 경험을 교훈 삼아 임기 초부터 공급확대에 나선 것도 잘하는 일이다. 그러나 공급확대는 생각처럼 쉬운 일이 아니고 시간도 많이 걸린다. 대통령이 직접, 계속 챙겨야 할 것이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "이번 주가 급등이 돈의 흐름을 바꾸는 것만으로 가능했던 것은 아닐 것이다. AI 붐으로 반도체 수요가 폭증하는 기회를 잡은 SK하이닉스와 삼성전자, 과감한 투자로 휴머노이드 로봇 아틀라스라는 새로운 성장 동력을 선보인 현대자동차, 중국의 추격과 정부의 핍박을 견뎌내고 국제 경쟁력을 유지해 트럼프 대통령의 마스가(MASGA) 정책과 중국 견제 정책이라는 기회를 잡은 조선·방산·원전, 그리고 새로운 가능성을 보여 주고 있는 바이오·제약, 이차전지, 엔터테인먼트 등 투자할 만한 기업이 있었기에 가능했던 것이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "있는 주식의 주가를 높여도 새로운 부가가치를 만들어내지는 못한다. 소비와 투자의 활성화, 일자리 창출로 이어져 실물 경제의 성장과 선순환이 이루어져야 경제정책은 비로소 성공한다. 아직은 동·서학 개미들이 영끌까지 해서 마련한 돈으로 금융 자산에 투자하고 있을 뿐, 소비에도 실물 투자에도 돈이 흐르지 않는 상황인 것 같다. 국내 주가가 이렇게 올라도 투자자들이 여전히 알파벳·테슬라 주식을 선호하는 것은 그들이 더 과감한 기술 개발, 설비 투자를 하고 있어 장차 더 많은 수익을 창출해 낼 것 같기 때문이다. 실물 투자 없는 주가 상승은 한계가 있다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "기업이 번 돈은 제일 먼저 노동자가, 그다음은 대출을 해준 채권자가 자기 몫을 떼어 간다. 이익이 나면 나라가 먼저 세금을 떼어 가고 주주는 마지막에 배당과 주가 상승으로 이익을 향유한다. 기업의 이익을 늘려 주는 것이 소액주주가 더 많은 배당을 받고 주가가 계속 오르게 하며 대주주가 과감한 실물 투자를 하게 하는 최선의 방안이다. 어쩌면 외국인 투자도 더 끌어들일 수  있을 것이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "먼저 전기료. 전기가 국가 경쟁력을 좌우한다는 AI 시대에 가정용 전기료는 적게 올리고 기업용을 많이 올린 전 정부의 조치는 악수 중의 악수였다. 이제 에너지 가격이 떨어졌으니 전기료를 내려야 한다. 인하 여력을 기업용에 집중해야 한다. 물가 안정을 원하면 수입을 더 개방하면 된다. 트럼프 대통령도 좋아할 것이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "다음은 노동 비용. 최저임금의 급격한 인상, 통상임금의 범위 확대, 정년 60세 의무화, 주 52시간 근무제, 노란봉투법, 중대재해처벌법 등 2000년대 들어서 임금 비용을 올리는 일이 끝없이 이어졌다. 이 모든 것을 합치면 기업의 임금 부담이 얼마나 늘어났는지는 분석해 보지도 않는다. 그러고도 또 포괄 임금제 폐지, 65세로 정년 연장 등이 논의되고 있다. 이 모두가 이미 취직한 사람들에게만 이익이고 아직 취직하지 못한 사람들에게는 불리하다. 주주에게도 불이익이다. 노동 개혁? 아마 못 해낼 것이다. 미취업자와 투자자의 이익을 침해하는 일을 그만하기라도 하면 좋겠다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "다음 이자 비용. 재정적자를 최소화해 국채 발행을 줄이면 자본시장 이자율은 안정될 것이고 기업의 경쟁력 강화와 주가 상승에도 도움이 될 것이다. 그리고 법인세. 기업에 배당과 투자, 일자리 창출을 요청하면서 그 재원을 정부가 더 가져가겠다는 건 좀 후안무치한 일 아닌가? 배당소득세 경감과 법인세 인상은 조삼모사(朝三暮四) 같은데 주식 투자자는 원숭이가 아니다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "마지막으로 규제 개혁. 이 돈 한 푼 안 드는 투자 활성화 방안도 모든 정부가 실패했다. 모든 규제의 배후에는 기득권이 도사리고 있고 표를 의식하는 정치권은 규제를 혁파하지 못한다. 대통령도 ‘정치’를 의식하는 한 성공하기 어렵다. 역대 대통령 누구도 성공하지 못한 이유다. 정치를 그만두고 통치를 하는 대통령이라야 규제 혁파에 진심일 수 있다. 여의도와 척을 질 각오로 직접, 매일 챙겨야 겨우 성과를 거둘 수 있을 것이다. 이 정부는 꼭 성공해 주기를 바란다. 대형 유통업체의 영업시간 규제를 풀어주면 우리도 월마트 같은 시총 1조 달러(원이 아니다!) 기업이 등장할지도 모른다.", trans: "" }
            ]},
            { id: 3, title: "[칼럼] 코스피 5000 시대의 역설:\n타오르는 코스피 지수와 후진적 금융과세", subtitle: "소셜코리아 · 김은정 (참여연대 협동사무처장)", source: "https://www.socialkorea.org/news/articleView.html?idxno=10030", level: "C2", content: [
                { text: "코 앞에 다가온 코스피 5000 시대", trans: "", isHeading: true },
                { text: "한국 자본시장이 전례 없는 역동성의 시대로 진입하고 있다. 코스피 지수는 연일 사상 최고치를 경신하며, 과거 실현 불가능해 보였던 ‘코스피 5000’이라는 수치가 이제는 현실적인 목표로 다가왔다. 개인 투자자들의 예탁금은 급증했고, 그에 비례해 신용융자 잔액도 역대 최고 수준에 도달했다. 2024년 GDP 대비 90.1%였던 주식시장 시가총액 비율은 2026년 1월 15일 기준 171.02%를 기록하며, 한국 증시의 총 시가총액이 4,485.57조 원에 달했다. 이제 주식시장의 덩치는 국가 경제 규모를 넘어섰다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "하지만 자본시장이 뜨겁게 달아오른 것과는 대조적으로, 서민들이 체감하는 민생의 온기는 갈수록 차갑게 식고 있다. 주가지수 상승이 노동의 가치 제고나 실물경제 선순환으로 연결되지 못하고, 오히려 자산에서 비롯된 소득 격차를 심화시키는 결과를 낳고 있기 때문이다. ‘자본시장 활성화’라는 명분 아래 반복된 감세정책은 자본의 과실이 다시 사회로 환원되는 길목을 사실상 차단했다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "과실을 나누는 방식의 왜곡", trans: "", isHeading: true },
                { text: "주가 상승 자체가 나쁜 일은 아니다. 그동안 한국 증시가 겪어온 ‘코리아 디스카운트’를 해소하고, 기업 가치를 정상적으로 평가받는 과정이라 볼 수도 있다. 그러나 문제는 “그 과실을 어떻게 나눌 것인가”에 있다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "조세는 부의 재분배를 위한 핵심 기제다. 하지만 자본시장 활성화를 명분으로 한 반복적인 감세는 그 기능을 마비시켰다. 수익은 늘어났지만, 분배 경로는 차단된 셈이다. 이러한 왜곡을 바로잡기 위해 여야 합의로 도입된 것이 금융투자소득세(이하 금투세)였다. 금투세는 손실에도 세금을 내야 하는 기존 거래세 구조에서 벗어나, 실제  수익이 발생했을 때만 과세하고 손실은 이월할 수 있는 합리적인 과세 체계였다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "그러나 금투세는 정치적 이해관계와 왜곡된 여론 속에서 시행을 앞두고 끝내 폐지됐다. 금투세가 주가 하락을 유발할 것이라는 공포 마케팅이 시장을 장악했고, 정치권은 표심 앞에서 원칙을 접었다. 정작 금투세 폐지를 가장 반긴 이들은 일반 개인 투자자가 아니라, 비과세 혜택을 유지하고자 했던 거대 사모펀드와 초고액 자산가들이었다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "그 결과 “소득 있는 곳에 과세한다”는 조세의 기본 원칙이 무너졌고, 자산 불평등을 완화할 조세의 기능도 흐려졌다. 종합적인 자산 과세 개편 로드맵은 실종되고, 오히려 대다수 개인 투자자에게는 거래세를 유지하면서 지배주주에게는 배당소득 분리과세 혜택이 돌아가는 기형적인 구조가 고착됐다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "“지금은 아니다”라는 핑계는 유효한가?", trans: "", isHeading: true },
                { text: "금투세 폐지 당시 정치권의 명분은 분명했다. 당시 이재명 대통령은 당대표 시절 “원칙적으로는 강행이 옳지만, 시장이 어렵고 투자자의 입장을 고려했다”며 폐지에 동의했다. 타당성은 인정하면서도 정치적 부담을 회피한 선택이었다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "일부 의원들은 코스피 지수가 3,000~4,000대에 도달하면 새로운 세제를 받아들일 수 있을 것이라는 ‘여건론’을 제시하기도 했다. 그러나 지금은 그 ‘여건’을 충분히 넘어선 상태다. 코스피는 5,000선을 향해 질주 중이며, 외국인 순매수, 시가총액 확대, 개인 투자 열기 등 모든 지표가 과열 신호를 보내고 있다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "그럼에도 불구하고 금투세 재도입 논의는 다시 살아나지 않았다. 오히려 감세 정책만이 논의 테이블에 오르며, 정책 방향은 여전히 자산 보유자에게 기울어 있다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "금융 과세 후퇴의 실체와 그 폐해", trans: "", isHeading: true },
                { text: "2025년 세제 개편에서 정부는 주식 양도세 대주주 기준을 기존 10억 원으로 환원하겠다고 밝혔지만, 결국 윤석열 정부 당시 상향된 50억 원 기준을 유지했다. 정부 의지만으로도 시행령을 되돌릴 수 있었지만, 여론을 의식해 포기한 것이다. 그 결과 현재 양도차익 과세 대상은 전체 투자자의 0.004%에 불과한 초고액 자산가에만 해당된다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "배당소득 분리과세 역시 유리한 방향으로 완화됐다. 정부안보다  국회 심의 과정에서 더 낮은 세율이 적용되며, 가장 많은 배당을 받는 ‘회장님’들의 세부담은 오히려 줄었다. 조세 원칙과 형평을 무시한 이러한 감세 정책은, 과거 “기업에 세금을 깎아주면 투자와 고용이 늘어 세수가 증가한다”는 근거 없는 낙수효과 주장처럼 정치권을 지배하고 있다. 이는 매우 위험한 신호다.", trans: "" },

                { text: "", trans: "", isBlank: true },
                { text: "이러한 구조에서 자본이득에 대한 감세는 상위 자산계층의 소득만을 증폭시키고, 노동자들과의 격차를 더욱 확대시킨다. 임금은 투명하게 과세되지만, 수억 원의 주식 차익과 배당에는 ‘분리과세’와 ‘비과세’라는 특혜가 주어진다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "그 결과, 노동보다 자산에서 돈 버는 것이 더 유리한 사회가 제도적으로 고착화되고 있다. 청년들이 대출을 받아 주식시장에 뛰어드는 것도 탐욕이 아닌, 합리적 대응처럼 여겨지고 있다.", trans: "" },
                { text: "", trans: "", isBlank: true },

                { text: "‘2025년 가계금융복지조사’에 따르면 순자산 지니계수는 0.625로 사상 최고치를 기록했고, 상위 10%가 전체 순자산의 46.1%를 차지했다. 자산 격차가 빠르게 확대되고 있다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "코스피 5000, 누구를 위한 숫자인가", trans: "", isHeading: true },
                { text: "정부는 “부동산 자금을 자본시장으로 유도하겠다”고 말하지만, 그 방식이 “세금을 덜 부과하겠다”는 것이라면 결국 자산 소득이 노동 소득보다 유리한 구조만 고착시킬 뿐이다.", trans: "" },
                { text: "", trans: "", isBlank: true },
                { text: "“코스피 5000 시대, 이제 국회와 정부는 답해야 한다. \n이 숫자가 소수 자산가만을 위한 불평등의 기록이 될 것인가, \n아니면 공정한 과세를 통해 모두 함께 성장하는 희망의 지표가 될 것인가.”", trans: "", isQuote: true },
                { text: "", trans: "", isBlank: true },
                { text: "지금 필요한 것은 감세가 아니다. 금융 과세 체계의 정상화다. 금투세 재도입, 대주주 기준 정상화, 배당소득 과세 원칙 회복 없이 ‘코스피 5000’은 그저 숫자일 뿐이다. 숫자만 키운 성장은, 그만큼의 그림자도 남긴다는 사실을 정치권은 명심해야 한다.", trans: "" }

                {description && (
                    <p className="text-[16px] text-[#444444] font-serif leading-relaxed mt-2 max-w-2xl print:text-[12px]">
                        {description}
                    </p>
                )}
                <div className="w-[1px] h-6 bg-gray-200 mt-8 print:hidden"></div>
            </div>
        );

        const VocabItem = ({ word }) => {
            const [showTrans, setShowTrans] = useState(false); const trans = word.translations?.en;
            return (
                <div className="border border-gray-200 hover:border-gray-300 transition-colors p-6 flex flex-col group bg-white h-full print:p-4 break-inside-avoid">
                    <div className="flex justify-between items-start mb-4 print:mb-2">
                        <h3 className="text-3xl font-bold font-serif text-[#1a1a1a] group-hover:text-gray-600 transition-colors print:text-[14px]">{word.term}</h3>
                        <div className="flex flex-col items-end gap-1"><TranslateButton onClick={() => setShowTrans(!showTrans)} isShowing={showTrans} className="print:hidden" />{showTrans && trans?.term && <span className="font-serif text-sm text-gray-400 italic animate-fade-in text-right print:text-[10px]">{trans.term}</span>}</div>
                    </div>
                    <div className="mb-6 flex-1 print:mb-3"><p className="text-[17px] text-[#444] font-serif leading-relaxed print:text-[12px]">{word.mainDef}</p>{showTrans && trans?.mainDef && (<p className="text-sm text-gray-500 font-sans mt-2 animate-fade-in leading-relaxed print:text-[10px]">{trans.mainDef}</p>)}</div>
                    {word.examples && word.examples.length > 0 && (<div className="bg-gray-50 p-5 mt-auto border-l-2 border-transparent group-hover:border-gray-300 transition-all print:p-3 print:border-gray-200"><p className="text-[15px] text-[#1a1a1a] font-serif leading-snug print:text-[11px]">{word.examples[0].kor}</p>{showTrans && (<p className="text-[13px] text-gray-500 font-sans mt-2 pt-2 border-t border-gray-200 animate-fade-in print:text-[10px]">{word.examples[0].eng}</p>)}</div>)}
                </div>
            );
        };
        const VocabView = ({ updateProgress }) => { 
            const [activeVocabTab, setActiveVocabTab] = useState(1);
            useEffect(() => { updateProgress('vocab'); }, []); 
            
            const currentVocabData = VOCAB_DATA[activeVocabTab] || [];

            return (
                <div className="max-w-4xl mx-auto w-full px-6 py-16 animate-fade-in print:py-0">
                    <SectionHeader title="핵심 어휘" description="각 읽기 자료에 등장하는 주요 어휘를 탭별로 학습해 보세요." />
                    
                    {/* 어휘 탭 메뉴 */}
                    <div className="flex items-center justify-center gap-6 mb-12 border-b border-gray-200 print:hidden">
                        {[1, 2, 3].map(id => (
                            <button 
                                key={id} 
                                onClick={() => setActiveVocabTab(id)} 
                                className={`text-sm font-bold font-sans pb-4 transition-colors relative ${activeVocabTab === id ? 'text-black' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                읽기 자료 {id}
                                {activeVocabTab === id && <div className="absolute -bottom-[1px] left-0 w-full h-0.5 bg-black"></div>}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 print:gap-4">
                        {currentVocabData.map((word, idx) => (<VocabItem key={idx} word={word} />))}
                    </div>
                </div>
            ); 
        };

        const QuizSentence = ({ quiz, onAttempt, onShuffle }) => {
            const [userInput, setUserInput] = useState(''); const [result, setResult] = useState(null); const [showHint, setShowHint] = useState(false); const [showTranslation, setShowTranslation] = useState(false);
            const handleCheck = () => { const isCorrect = userInput.trim() === quiz.answer; setResult(isCorrect ? 'correct' : 'incorrect'); setShowHint(false); if (onAttempt) onAttempt(quiz.id, isCorrect); if (onShuffle) onShuffle(); };
            const handleShowAnswer = () => { setUserInput(quiz.answer); setResult(null); setShowHint(false); if (onShuffle) onShuffle(); }; 
            
            const textLength = Math.max(userInput.length, quiz.answer ? quiz.answer.length : 0);
            const safeWidth = Math.max(100, textLength * 25);

            return (
                <div className="mb-10 pb-10 border-b border-gray-200 last:border-0 print:mb-6 print:pb-6 break-inside-avoid">
                    <div className="flex items-baseline gap-4 mb-4 print:mb-2"><span className="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5 print:text-[10px]">Q.{quiz.id}</span></div>
                    <div className="text-xl font-serif text-gray-900 leading-loose mb-6 print:text-[12px] print:mb-2"><span>{quiz.textParts[0]}</span><input type="text" value={userInput} onChange={(e) => { setUserInput(e.target.value); setResult(null); }} className={`mx-2 px-2 py-0 border-b-2 font-bold text-center outline-none bg-transparent transition-colors font-serif ${result === 'correct' ? 'border-green-500 text-green-700' : result === 'incorrect' ? 'border-red-500 text-red-700' : 'border-gray-300 text-black focus:border-black'} print:border-b print:border-gray-300 print:text-[12px]`} style={{ width: `${safeWidth}px` }} /><span>{quiz.textParts[1]}</span></div>
                    <div className="flex flex-wrap gap-3 items-center print:hidden"><button onClick={handleCheck} className="px-4 py-2 bg-black text-white text-xs font-bold font-sans hover:bg-gray-800 transition-colors">정답 확인</button><button onClick={handleShowAnswer} className="px-4 py-2 bg-white border border-gray-300 text-gray-600 text-xs font-bold font-sans hover:border-black hover:text-black transition-colors">정답 보기</button><button onClick={() => setShowHint(!showHint)} className="text-xs font-bold font-sans text-gray-400 hover:text-gray-600 underline">힌트</button><TranslateButton onClick={() => setShowTranslation(!showTranslation)} isShowing={showTranslation} /></div>
                    {showTranslation && (<p className="mt-4 text-sm font-sans text-gray-500 bg-gray-50 p-3 print:text-[10px] print:mt-2 print:p-2">{quiz.textParts_eng.join(' ... ')}</p>)}{showHint && (<p className="mt-4 text-sm font-sans text-gray-500 italic print:text-[10px] print:mt-2">💡 Hint: {quiz.hint}</p>)}{result === 'correct' && (<p className="mt-4 text-sm font-sans text-green-700 font-medium print:text-[12px] print:mt-2">✓ 정답입니다! {quiz.explanation}</p>)}{result === 'incorrect' && (<p className="mt-4 text-sm font-sans text-red-600 font-medium print:text-[12px] print:mt-2">✕ 다시 시도해 보세요.</p>)}
                </div>
            );
        };
        const QuizView = ({ updateProgress }) => {
            const [attempts, setAttempts] = useState({}); const [shuffledChoices, setShuffledChoices] = useState(ANSWER_CHOICES); const totalQuestions = QUIZ_LIST.length; const correctCount = Object.values(attempts).filter(v => v).length; const currentScore = Math.round((correctCount / totalQuestions) * 100);
            useEffect(() => { const totalAttempts = Object.keys(attempts).length; if (totalAttempts === 0) return; updateProgress('quiz', currentScore); }, [attempts, currentScore, updateProgress]);
            const handleAttempt = (quizId, isCorrect) => { setAttempts(prev => { if (prev.hasOwnProperty(quizId)) return prev; const newAttempts = { ...prev, [quizId]: isCorrect }; return newAttempts; }); };
            const shuffleChoices = useCallback(() => { setShuffledChoices(prev => { const newArray = [...prev]; for (let i = newArray.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [newArray[i], newArray[j]] = [newArray[j], newArray[i]]; } return newArray; }); }, []);
            return (
                <div className="max-w-4xl mx-auto w-full px-6 py-12 flex flex-col md:flex-row gap-12 animate-fade-in print:flex-col print:gap-6 print:py-0">
                    <div className="w-full md:w-64 shrink-0 print:w-full">
                        <div className="sticky top-24 print:static"> 
                            <div className="md:sticky md:top-24 print:static"> 
                                <h2 className="text-3xl font-serif font-bold text-gray-900 mb-2 print:text-[18px]">내용 확인 퀴즈</h2><p className="text-sm font-sans text-gray-500 mb-6 print:text-[12px] print:mb-4">학습 자료에 대한 이해도를 확인해 보세요.</p><div className="border-t border-gray-200 pt-4 mb-8 print:hidden"><span className="text-xs font-bold font-sans text-black uppercase block mb-2">정답률</span><span className="text-4xl font-serif font-bold text-gray-900">{currentScore}%</span></div><div className="bg-gray-50 p-4 border border-gray-100 print:bg-transparent print:border-none print:p-0"><h4 className="text-xs font-bold font-sans text-gray-500 uppercase mb-3 border-b border-gray-200 pb-2 print:hidden">정답 목록</h4><div className="flex flex-wrap gap-2 print:gap-1"><span className="hidden print:block text-[12px] font-bold text-gray-700 mr-2 mt-1">정답 목록:</span>{shuffledChoices.map((choice, idx) => (<span key={idx} className="text-xs font-serif text-gray-600 bg-white border border-gray-200 px-2 py-1 select-all print:text-[12px] print:border-gray-400 print:px-1 print:py-0">{choice}</span>))}</div></div>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1">{QUIZ_LIST.map((quiz) => (<QuizSentence key={quiz.id} quiz={quiz} onAttempt={handleAttempt} onShuffle={shuffleChoices} />))}</div>
                </div>
            );
        };

        const DiscussQuestionItem = ({ item }) => {
            const [text, setText] = useState(''); 
            const [showTranslation, setShowTranslation] = useState(false);
            const [feedback, setFeedback] = useState(null); 
            const [isLoading, setIsLoading] = useState(false);
            const [showFeedbackTrans, setShowFeedbackTrans] = useState(false);

            const handleGetFeedback = async () => {
                if (!text.trim()) return;
                setIsLoading(true);
                setFeedback(null);
                setShowFeedbackTrans(false);
                
                const prompt = `당신은 친절하고 전문적인 AI 한국어 도우미입니다. 학생이 다음 질문에 대해 한국어로 답변을 작성했습니다.
질문: ${item.questionKor}
학생의 답변: "${text}"

학생의 답변을 읽고 다음 지시사항에 따라 '-요' 체로 친절하게 피드백을 작성해주세요:
1. 전체적인 총평과 잘한 점을 먼저 한국어로 작성하고, 그에 대한 영어 번역을 제공합니다.
2. 학생의 문장을 하나씩 확인하며, 교정이 필요한 문장을 찾아냅니다. (완벽한 문장이라도 더 자연스러운 고급(C1) 표현이 있다면 제안해주세요.)
3. 교정이 필요한 경우, '원래 문장', '교정된 문장', 그리고 '왜 그렇게 수정해야 하는지(문법적 오류나 경제 용어의 정확한 사용법 포함)'를 상세히 한국어로 설명하고, 그 설명에 대한 영어 번역을 제공합니다.`;

                try {
                    const payload = { 
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    overallComment: { type: "STRING", description: "학생의 답변에 대한 전체적인 칭찬 및 격려 (한국어, 2~3문장)" },
                                    overallCommentTrans: { type: "STRING", description: "overallComment의 자연스러운 영어 번역" },
                                    corrections: {
                                        type: "ARRAY",
                                        description: "문장별 상세 교정 내역",
                                        items: {
                                            type: "OBJECT",
                                            properties: {
                                                original: { type: "STRING", description: "학생이 작성한 원래 문장" },
                                                corrected: { type: "STRING", description: "자연스럽고 올바르게 교정된 문장" },
                                                explanation: { type: "STRING", description: "무엇이 잘못되거나 어색했는지에 대한 상세한 설명 (한국어)" },
                                                explanationTrans: { type: "STRING", description: "explanation의 자연스러운 영어 번역" }
                                            },
                                            required: ["original", "corrected", "explanation", "explanationTrans"]
                                        }
                                    }
                                },
                                required: ["overallComment", "overallCommentTrans", "corrections"]
                            }
                        }
                    };
                    const result = await callGeminiWithBackoff(payload);
                    const parsedData = JSON.parse(result.candidates[0].content.parts[0].text);
                    setFeedback(parsedData);
                } catch (error) {
                    setFeedback({ error: "앗, 피드백을 가져오는 중에 오류가 발생했어요. 잠시 후 다시 시도해주세요." });
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="mb-16 group print:mb-8 break-inside-avoid">
                    <div className="flex items-center gap-4 mb-6 print:mb-3"><span className="text-4xl font-serif font-bold text-gray-200 transition-colors duration-300 group-hover:text-gray-900 print:text-[14px] print:text-black">{item.id < 10 ? '0' + item.id : item.id}.</span><h3 className="text-xl font-serif font-bold text-gray-900 leading-normal print:text-[12px]">{item.questionKor}</h3></div>
                    <div className="pl-0 md:pl-14 print:pl-6">
                        <div className="flex gap-2 mb-4 print:hidden"><TranslateButton onClick={() => setShowTranslation(!showTranslation)} isShowing={showTranslation} />{showTranslation && (<p className="text-sm font-sans text-gray-500 animate-fade-in">{item.questionEng}</p>)}</div>
                        <div className="bg-gray-50 p-5 mb-6 border-l-2 border-black print:p-3 print:mb-3"><span className="text-xs font-bold font-sans text-gray-400 uppercase mb-2 block print:text-[10px]">핵심 어휘</span><div className="space-y-1 print:space-y-0">{item.vocab.map((v, i) => (<p key={i} className="text-sm font-serif text-gray-700 print:text-[10px]"><span className="font-bold text-black mr-2 print:text-[10px]">{v.term}</span>{v.def}</p>))}</div></div>
                        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="여기에 경제/사회적 관점을 담아 생각을 적어보세요..." className="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300 print:hidden"></textarea>
                        <div className="flex justify-end print:hidden"><button disabled={!text.trim() || isLoading} onClick={handleGetFeedback} className={`px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors ${!text.trim() || isLoading ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}`}>{isLoading ? '피드백 작성 중...' : 'AI 피드백 받기'}</button></div>
                        
                        {(isLoading || feedback) && (
                            <div className="mt-8 border-t border-gray-200 pt-8 animate-fade-in print:hidden">
                                <div className="flex items-center gap-2 mb-6">
                                    <SparklesIcon className="w-4 h-4 text-black" />
                                    <span className="text-xs font-bold font-sans text-black uppercase tracking-widest">AI 한국어 도우미</span>
                                </div>
                                {isLoading ? (
                                    <div className="flex justify-center py-10"><div className="animate-spin rounded-full h-6 w-6 border-2 border-gray-200 border-t-black"></div></div>
                                ) : feedback.error ? (
                                    <div className="p-4 bg-red-50 text-red-600 text-[14px] font-sans rounded-sm">{feedback.error}</div>
                                ) : (
                                    <div className="space-y-6">
                                        <div className="bg-gray-50 p-5 border-l-2 border-black">
                                            <span className="text-[11px] font-bold font-sans text-gray-500 uppercase tracking-widest mb-2 block">총평 및 잘한 점</span>
                                            <p className="text-[15px] font-serif text-gray-900 leading-relaxed whitespace-pre-wrap">{feedback.overallComment}</p>
                                            {showFeedbackTrans && feedback.overallCommentTrans && (
                                                <p className="text-[13px] font-sans text-gray-500 mt-2 pt-2 border-t border-gray-200 animate-fade-in leading-relaxed">{feedback.overallCommentTrans}</p>
                                            )}
                                        </div>
                                        
                                        {feedback.corrections && feedback.corrections.length > 0 && (
                                            <div>
                                                <span className="text-[11px] font-bold font-sans text-gray-500 uppercase tracking-widest mb-3 block">문장별 교정 및 설명</span>
                                                <div className="space-y-4">
                                                    {feedback.corrections.map((corr, idx) => (
                                                        <div key={idx} className="bg-white border border-gray-200 p-5 transition-colors hover:border-gray-300">
                                                            <div className="mb-4">
                                                                <div className="flex items-start gap-3 mb-2">
                                                                    <span className="shrink-0 mt-0.5 text-[10px] font-sans font-bold text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded-sm uppercase tracking-wider">수정 전</span>
                                                                    <p className="text-[15px] font-serif text-gray-400 line-through decoration-gray-300">{corr.original}</p>
                                                                </div>
                                                                <div className="flex items-start gap-3">
                                                                    <span className="shrink-0 mt-0.5 text-[10px] font-sans font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded-sm uppercase tracking-wider">수정 후</span>
                                                                    <p className="text-[15px] font-serif text-gray-900 font-medium">{corr.corrected}</p>
                                                                </div>
                                                            </div>
                                                            <div className="pt-3 border-t border-gray-100">
                                                                <p className="text-[14px] font-serif text-gray-700 leading-relaxed"><span className="font-sans font-bold text-[11px] text-gray-400 mr-2 uppercase tracking-widest">💡 설명</span>{corr.explanation}</p>
                                                                {showFeedbackTrans && corr.explanationTrans && (
                                                                    <p className="text-[12px] font-sans text-gray-500 mt-2 animate-fade-in">{corr.explanationTrans}</p>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        <div className="flex justify-end mt-4">
                                            <TranslateButton 
                                                onClick={() => setShowFeedbackTrans(!showFeedbackTrans)} 
                                                isShowing={showFeedbackTrans} 
                                            />
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        const DiscussView = ({ updateProgress }) => (
            <div className="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in print:py-0">
                <div className="mb-6 pb-6 text-center print:mb-4 print:pb-2"><h2 className="text-3xl font-serif font-bold text-gray-900 mb-2 print:text-[18px]">생각해 보기</h2><p className="text-sm font-sans text-gray-500 print:text-[12px]">학습 자료에 대해 심층적으로 생각해 보세요.</p></div>
                <div className="bg-gray-50 border border-gray-200 p-4 mb-10 flex items-start gap-3 print:hidden"><div className="shrink-0 mt-0.5"><SparklesIcon className="w-4 h-4 text-gray-400" /></div><p className="text-xs font-sans text-gray-600 leading-relaxed">답변을 작성한 후 <strong>'AI 피드백 받기'</strong> 버튼을 누르면 AI 한국어 도우미의 친절한 첨삭과 조언을 받을 수 있습니다.</p></div>
                {DISCUSS_DATA.map((item) => (<DiscussQuestionItem key={item.id} item={item} />))}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home'); 
            const [activeReadingId, setActiveReadingId] = useState(1);
            const [userLevel] = useState("C1+"); // 시작페이지 전체 레벨 C1+ 설정
            const [showVocab, setShowVocab] = useState(false); const [progress, setProgress] = useState({ learn: false, vocab: false, quiz: 0, discuss: false });
            const updateProgress = useCallback((key, value = true) => { setProgress(prev => { if (prev[key] === value) return prev; return { ...prev, [key]: value }; }); }, []);
            const renderContent = () => { switch(activeTab) { case 'home': return <HomeView setActiveTab={setActiveTab} setActiveReadingId={setActiveReadingId} userLevel={userLevel} />; case 'reading': return <ReadingView updateProgress={updateProgress} showVocab={showVocab} setShowVocab={setShowVocab} userLevel={userLevel} activeReadingId={activeReadingId} setActiveReadingId={setActiveReadingId} />; case 'vocab': return <VocabView updateProgress={updateProgress} />; case 'quiz': return <QuizView updateProgress={updateProgress} />; case 'discuss': return <DiscussView updateProgress={updateProgress} />; default: return <HomeView setActiveTab={setActiveTab} setActiveReadingId={setActiveReadingId} userLevel={userLevel} />; } };
            const isReadingTab = activeTab === 'reading';
            return (
                <div className={`flex flex-col bg-white text-gray-900 selection:bg-gray-200 selection:text-black font-sans ${isReadingTab ? 'h-screen overflow-hidden print:h-auto print:overflow-visible' : 'min-h-screen print:min-h-0'}`}>
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} />
                    <div className="lg:hidden h-14 border-b border-gray-100 flex items-center justify-center sticky top-0 bg-white z-40 print:hidden"><span className="text-lg font-bold font-sans tracking-tighter">OpenKoreanLearningLab</span></div>
                    <main className={`flex-1 relative flex flex-col ${isReadingTab ? 'overflow-x-hidden lg:overflow-hidden lg:h-full print:overflow-visible print:h-auto' : ''}`}>{renderContent()}</main>
                    <nav className="lg:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 z-50 print:hidden">{NAV_ITEMS.map((item) => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 ${activeTab === item.id ? 'text-black' : 'text-gray-300'}`}><item.icon className="w-6 h-6" /></button>))}</nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
