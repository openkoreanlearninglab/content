                                    {showTrans && trans?.subDefs?.[i]?.def && (<p className="text-[10px] text-gray-400 font-ui mt-0.5 italic">{trans.subDefs[i].def}</p>)}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const VideoVocabPopup = ({ popup, themeColor, onGlobalClick }) => {
            const [showTrans, setShowTrans] = useState(false);
            const trans = popup.data?.translations?.en;
            const popupWidth = 300; const padding = 20; const windowWidth = window.innerWidth;
            let leftPos = popup.x - (popupWidth / 2);
            if (leftPos < padding) leftPos = padding; else if (leftPos + popupWidth > windowWidth - padding) leftPos = windowWidth - popupWidth - padding;
            useEffect(() => { setShowTrans(false); }, [popup.data]);
            if (!popup.show || !popup.data) return null;
            return createPortal(
                <div className={`fixed z-[9999] bg-white border border-gray-200 p-6 w-[300px] shadow-2xl animate-fade-in ${!popup.fixed ? 'pointer-events-none' : ''}`} style={{ left: leftPos, top: popup.y + 16 }} onClick={(e) => e.stopPropagation()}>
                    <div className="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
                        <h3 className="text-xl font-serif font-bold text-gray-900">{popup.data.term}</h3>
                        {popup.fixed && (<VideoTranslateButton onClick={() => setShowTrans(!showTrans)} isShowing={showTrans} />)}
                    </div>
                    <p className="text-sm font-serif text-gray-700 leading-relaxed mb-4">{popup.data.mainDef}</p>
                    {showTrans && popup.fixed && trans?.mainDef && (<div className="mb-4 bg-white border border-gray-100 p-3 animate-fade-in"><p className="text-xs font-ui text-gray-600">{trans.mainDef}</p></div>)}
                    {popup.fixed && popup.data.subDefs && popup.data.subDefs.length > 0 && (<div className="space-y-3 mt-4">{popup.data.subDefs.map((sub, idx) => (<div key={idx}><p className="text-xs font-bold font-ui text-gray-900 mb-1">{sub.subTerm}</p><p className="text-xs font-serif text-gray-600">{sub.subDef}</p></div>))}</div>)}
                    <div className="absolute -top-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-white border-l border-t border-gray-200 rotate-45"></div>
                </div>, document.body
            );
        };

        const LearnView = ({ updateProgress }) => {
            const playerRef = useRef(null); 
            const [videoState, setVideoState] = useState({ player: null, currentTime: 0, duration: 0, isPlaying: false });
            const [activeLine, setActiveLine] = useState(null);
            const [translations, setTranslations] = useState({});
            const [popup, setPopup] = useState({ show: false, fixed: false, data: null, x: 0, y: 0 });
            const [isLoading, setIsLoading] = useState(true);
            const [activeVocabTerm, setActiveVocabTerm] = useState(null);
            const sidebarVocabRefs = useRef({});
            const scriptRefs = useRef({});
            const intervalRef = useRef(null);
            const [isSpeedMenuOpen, setIsSpeedMenuOpen] = useState(false);
            
            const [layoutMode, setLayoutMode] = useState('split');
            const [autoScroll, setAutoScroll] = useState(true);
            const [showVocab, setShowVocab] = useState(false);
            const [playbackRate, setPlaybackRate] = useState(1.0);

            useEffect(() => {
                const loadVideo = () => {
                    if (window.YT && window.YT.Player) {
                        new window.YT.Player('youtube-player', {
                            videoId: VIDEO_CONFIG.YOUTUBE_VIDEO_ID, width: '100%', height: '100%',
                            playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'disablekb': 1 },
                            events: {
                                'onReady': (event) => { playerRef.current = event.target; setVideoState(prev => ({ ...prev, player: event.target, duration: event.target.getDuration() })); setIsLoading(false); },
                                'onStateChange': (event) => { if (event.data === window.YT.PlayerState.PLAYING) { startInterval(); updateProgress('learn'); setVideoState(prev => ({ ...prev, isPlaying: true })); } else { stopInterval(); if (event.data === window.YT.PlayerState.PAUSED || event.data === window.YT.PlayerState.ENDED) { setVideoState(prev => ({ ...prev, isPlaying: false })); } } }
                            }
                        });
                    }
                };
                if (!window.YT) { const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; const firstScriptTag = document.getElementsByTagName('script')[0]; firstScriptTag.parentNode.insertBefore(tag, firstScriptTag); window.onYouTubeIframeAPIReady = loadVideo; } else { loadVideo(); }
                return () => stopInterval();
            }, []);

            useEffect(() => { if (videoState.player && videoState.player.setPlaybackRate) videoState.player.setPlaybackRate(playbackRate); }, [playbackRate, videoState.player]);

            const handleGlobalClick = useCallback(() => { if (popup.fixed) setPopup(prev => ({ ...prev, show: false, fixed: false })); }, [popup.fixed]);
            useEffect(() => { if (popup.fixed) window.addEventListener('click', handleGlobalClick); return () => window.removeEventListener('click', handleGlobalClick); }, [popup.fixed, handleGlobalClick]);

            useEffect(() => {
                const handleKeyPress = (e) => {
                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                    if (e.code === 'Space') { e.preventDefault(); const player = videoState.player; if (player && typeof player.getPlayerState === 'function') { if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); } }
                    if (e.code === 'ArrowLeft') { e.preventDefault(); const currentIndex = VIDEO_SCRIPT_DATA.findIndex(line => line.id === activeLine); if (currentIndex > 0) handleLineClick(VIDEO_SCRIPT_DATA[currentIndex - 1].time[0]); }
                    if (e.code === 'ArrowRight') { e.preventDefault(); const currentIndex = VIDEO_SCRIPT_DATA.findIndex(line => line.id === activeLine); if (currentIndex !== -1 && currentIndex < VIDEO_SCRIPT_DATA.length - 1) handleLineClick(VIDEO_SCRIPT_DATA[currentIndex + 1].time[0]); else if (currentIndex === -1 && VIDEO_SCRIPT_DATA.length > 0) handleLineClick(VIDEO_SCRIPT_DATA[0].time[0]); }
                };
                window.addEventListener('keydown', handleKeyPress); return () => window.removeEventListener('keydown', handleKeyPress);
            }, [videoState.player, activeLine]);

            const startInterval = () => { 
                stopInterval(); 
                intervalRef.current = setInterval(() => {
                    const p = playerRef.current; 
                    if (p && p.getCurrentTime) { 
                        const time = p.getCurrentTime(); 
                        setVideoState(prev => ({ ...prev, currentTime: time })); 
                        const currentLine = VIDEO_SCRIPT_DATA.find(line => time >= line.time[0] && time < line.time[1]); 
                        if (currentLine) setActiveLine(currentLine.id); 
                    }
                }, 200); 
            };
            
            const stopInterval = () => { 
                if (intervalRef.current) { 
                    clearInterval(intervalRef.current); 
                    intervalRef.current = null; 
                } 
            };

            useEffect(() => { 
                if (popup.show) return; 
                if (activeLine && autoScroll && scriptRefs.current[activeLine]) {
                    scriptRefs.current[activeLine].scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                }
            }, [activeLine, autoScroll, popup.show, layoutMode]);

            const handleLineClick = (time) => { const player = videoState.player; if (player) { player.seekTo(time, true); player.playVideo(); } };
            const toggleTranslation = (id) => setTranslations(prev => ({...prev, [id]: !prev[id]}));
            const scrollToVocab = (term) => { const element = sidebarVocabRefs.current[term]; if (element) element.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
            
            const handleVocabEnter = (e, wordData) => { if (popup.fixed) return; const rect = e.target.getBoundingClientRect(); setPopup({ show: true, fixed: false, data: wordData, x: rect.left + rect.width / 2, y: rect.bottom }); if (showVocab) { setActiveVocabTerm(wordData.term); scrollToVocab(wordData.term); } };
            const handleVocabLeave = () => { if (popup.fixed) return; setPopup(prev => ({ ...prev, show: false })); };
            const handleVocabClick = (e, wordData) => { e.stopPropagation(); if (popup.fixed && popup.data && popup.data.term === wordData.term) { setPopup(prev => ({ ...prev, show: false, fixed: false })); return; } const rect = e.target.getBoundingClientRect(); setPopup({ show: true, fixed: true, data: wordData, x: rect.left + rect.width / 2, y: rect.bottom }); if (showVocab) { setActiveVocabTerm(wordData.term); scrollToVocab(wordData.term); } };

            const handleSeek = (e) => { const time = parseFloat(e.target.value); if (videoState.player) videoState.player.seekTo(time, true); setVideoState(prev => ({ ...prev, currentTime: time })); };
            const togglePlay = () => { const player = videoState.player; if (player) { if (videoState.isPlaying) player.pauseVideo(); else player.playVideo(); } };
            const rewind2 = () => { const player = videoState.player; if (player) { const newTime = Math.max(0, videoState.currentTime - 1.5); player.seekTo(newTime, true); setVideoState(prev => ({ ...prev, currentTime: newTime })); } };
            const forward2 = () => { const player = videoState.player; if (player) { const newTime = Math.min(videoState.duration, videoState.currentTime + 1.5); player.seekTo(newTime, true); setVideoState(prev => ({ ...prev, currentTime: newTime })); } };
            const formatTime = (seconds) => { if (isNaN(seconds)) return "00:00"; const date = new Date(seconds * 1000); const mm = date.getUTCMinutes(); const ss = date.getUTCSeconds(); return `${mm.toString().padStart(2, '0')}:${ss.toString().padStart(2, '0')}`; };

            const allVocabTerms = useMemo(() => { return VIDEO_VOCAB_DATA.flatMap(vocab => { const terms = [vocab.term]; if (vocab.variants) terms.push(...vocab.variants); if (vocab.subDefs) terms.push(...vocab.subDefs.map(s => s.subTerm)); return [...new Set(terms)].filter(t => t).map(term => ({ term, vocab })); }).sort((a, b) => b.term.length - a.term.length); }, []);

            const renderTextWithVocab = (text) => {
                if (!text) return [""];
                const matches = [];
                allVocabTerms.forEach(({ term, vocab }) => { let index = 0; while ((index = text.indexOf(term, index)) !== -1) { const end = index + term.length; const overlaps = matches.some(m => (index >= m.start && index < m.end) || (end > m.start && end <= m.end) || (index <= m.start && end >= m.end)); if (!overlaps) matches.push({ start: index, end, term, vocab }); index += 1; } });
                matches.sort((a, b) => a.start - b.start);
                const result = []; let lastIndex = 0;
                matches.forEach((match, idx) => { if (match.start > lastIndex) result.push(text.substring(lastIndex, match.start)); const isActive = (popup.show && popup.data && popup.data.term === match.vocab.term) || (showVocab && activeVocabTerm === match.vocab.term); 
                result.push(<span key={`${match.term}-${idx}`} className={`cursor-pointer border-b border-dotted transition-all duration-200 font-medium inline-block leading-tight ${isActive ? 'border-black bg-white text-black border-solid' : 'border-gray-400 text-gray-800 hover:border-black hover:text-black'}`} onMouseEnter={(e) => handleVocabEnter(e, match.vocab)} onMouseLeave={handleVocabLeave} onClick={(e) => handleVocabClick(e, match.vocab)}>{match.term}</span>); lastIndex = match.end; });
                if (lastIndex < text.length) result.push(text.substring(lastIndex));
                return result;
            };

            // Layout Mode Logic
            const isScriptMode = layoutMode === 'script';
            const isVideoOnlyMode = layoutMode === 'video';
            const isSplitMode = layoutMode === 'split';

            // Video Container Classes based on Breakpoints and Layout Mode
            const videoStyle = isSplitMode 
                ? `w-full aspect-video shrink-0 z-20 shadow-md lg:shadow-none lg:h-full lg:aspect-auto ${showVocab ? 'lg:w-[58%] xl:flex-1' : 'lg:w-[58%] xl:w-7/12'}` 
                : (isScriptMode ? 'hidden' : 'flex-1 w-full h-full');

            // Script Container Classes based on Breakpoints and Layout Mode
            const scriptContainerBaseClass = `flex-1 flex flex-col min-h-0 bg-white border-l border-gray-200 transition-all duration-300`;
            const scriptContainerResponsiveClass = isSplitMode 
                ? `w-full lg:w-[42%] lg:h-full lg:flex-none ${showVocab ? 'xl:w-4/12' : 'xl:w-5/12'}`
                : (isScriptMode ? 'w-full h-full' : 'hidden');

            const LearnToolbar = () => (
                <div className="sticky top-0 z-40 h-16 flex items-center justify-between px-6 py-3 bg-white border-b border-gray-200 shadow-sm pr-14">
                    <div className="flex items-center gap-1 shrink-0">
                        {[{ id: 'split', label: '동영상 & 스크립트' }, { id: 'video', label: '동영상만 보기' }, { id: 'script', label: '스크립트만 보기' }].map((mode) => {
                            const isActive = layoutMode === mode.id;
                            let visibilityClass = "hidden"; // Default hidden

                            if (mode.id === 'split') visibilityClass = "block"; // Always visible (Video & Script)
                            else if (mode.id === 'video') visibilityClass = "hidden md:block"; // Video Only from md
                            else if (mode.id === 'script') visibilityClass = "hidden sm:block"; // Script Only from sm

                            return (
                                <button
                                    key={mode.id}
                                    onClick={() => setLayoutMode(mode.id)}
                                    className={`px-3 py-1.5 text-xs font-bold font-ui uppercase tracking-widest transition-colors ${visibilityClass} ${isActive ? 'bg-black text-white' : 'text-gray-400 hover:text-black'}`}
                                >
                                    {mode.label}
                                </button>
                            );
                        })}
                    </div>

                    <div className="flex items-center gap-4 flex-1 justify-end min-w-0">
                        {/* Player Controls */}
                        <div className="hidden sm:flex items-center gap-4 flex-1 max-w-xl justify-end">
                            
                            {/* 1. Progress Bar & Time - Hidden on xs/sm, shown from md */}
                            <div className="hidden md:flex flex-col flex-1 gap-1 w-full">
                                <div className="relative group h-2 flex items-center">
                                    <div className="absolute inset-0 flex items-center">
                                        <div className="w-full h-[1px] bg-gray-200 group-hover:h-[2px] transition-all"></div>
                                        <div className="absolute left-0 top-1/2 -translate-y-1/2 h-[2px] bg-black" style={{ width: `${(videoState.currentTime/videoState.duration)*100}%` }}></div>
                                    </div>
                                    <input type="range" min="0" max={videoState.duration || 100} value={videoState.currentTime} onChange={handleSeek} className="absolute inset-0 w-full opacity-0 cursor-pointer" />
                                </div>
                                <span className="text-[10px] font-mono text-gray-400 text-right leading-none">{formatTime(videoState.currentTime)} / {formatTime(videoState.duration)}</span>
                            </div>

                            {/* 2. Control Buttons - Hidden on xs, Shown from sm */}
                            <div className="hidden sm:flex items-center gap-3 shrink-0">
                                <button onClick={rewind2} className="text-gray-400 hover:text-black transition-colors"><RewindIcon className="w-4 h-4" /></button>
                                <button onClick={togglePlay} className="w-6 h-6 border border-black rounded-full flex items-center justify-center hover:bg-black hover:text-white transition-all">
                                    {videoState.isPlaying ? <PauseIcon className="w-2.5 h-2.5 fill-current" /> : <PlayIconSolid className="w-2.5 h-2.5 fill-current ml-0.5" />}
                                </button>
                                <button onClick={forward2} className="text-gray-400 hover:text-black transition-colors"><ForwardIcon className="w-4 h-4" /></button>
                            </div>
                        </div>

                        <div className="h-4 w-px bg-gray-200 hidden sm:block"></div>

                        {/* Speed Control - Hidden on xs */}
                        <div className="relative shrink-0 hidden sm:flex group">
                            <button onClick={() => setIsSpeedMenuOpen(!isSpeedMenuOpen)} className="flex items-center gap-1.5 text-xs font-bold font-ui uppercase tracking-wider text-gray-500 hover:text-black">
                                {playbackRate.toFixed(1)}x
                            </button>
                            {isSpeedMenuOpen && (
                                <>
                                <div className="fixed inset-0 z-40" onClick={() => setIsSpeedMenuOpen(false)}></div>
                                <div className="absolute top-full right-0 mt-2 bg-white border border-gray-200 shadow-xl p-1 z-50 w-20 animate-fade-in">
                                    {[0.5, 0.75, 1.0, 1.25, 1.5, 2.0].map(speed => (
                                        <button key={speed} onClick={() => { setPlaybackRate(speed); setIsSpeedMenuOpen(false); }} className={`w-full text-center py-1.5 text-[10px] font-bold font-ui hover:bg-white ${playbackRate === speed ? 'text-black' : 'text-gray-400'}`}>
                                            {speed}x
                                        </button>
                                    ))}
                                </div>
                                </>
                            )}
                        </div>

                        {/* Auto Scroll - Hidden on xs */}
                        <button 
                            onClick={() => setAutoScroll(!autoScroll)} 
                            className={`hidden sm:flex items-center gap-2 text-[10px] font-bold font-ui uppercase tracking-widest transition-colors ${autoScroll ? 'text-black' : 'text-gray-300 hover:text-gray-500'}`}
                        >
                            <span className={`w-2 h-2 rounded-full ${autoScroll ? 'bg-black' : 'border border-gray-300'}`}></span>
                            <span className="md:hidden">스크롤</span>
                            <span className="hidden md:inline">자동 스크롤</span>
                        </button>

                        {/* Dictionary - Hidden on xs/sm/md/lg, Show on xl */}
                        <button 
                            onClick={() => setShowVocab(!showVocab)} 
                            className={`hidden xl:flex items-center gap-2 px-3 py-1.5 border transition-all text-[10px] font-bold font-ui uppercase tracking-widest ${showVocab ? 'bg-black text-white border-black' : 'bg-white border-gray-200 text-gray-500 hover:border-black hover:text-black'}`}
                        >
                            어휘
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    <LearnToolbar />
                    <div className={`flex flex-col lg:flex-row flex-1 overflow-hidden relative`}>
                        <VideoVocabPopup popup={popup} onGlobalClick={handleGlobalClick} />
                        
                        {/* Video Container */}
                        <div className={`bg-black overflow-hidden relative transition-all duration-300 ${videoStyle} ${isScriptMode ? 'hidden' : ''} ${isVideoOnlyMode ? 'h-full flex-1 w-full' : ''}`}>
                                {isLoading && (<div className="absolute inset-0 z-10 bg-black flex items-center justify-center"><div className="w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-spin"></div></div>)}
                                <div id="youtube-player" className={`w-full h-full`}></div>
                        </div>
                        
                        {/* Script Container */}
                        <div className={`${scriptContainerBaseClass} ${scriptContainerResponsiveClass} ${isVideoOnlyMode ? 'hidden' : ''}`}>
                            <div className={`flex-1 overflow-y-auto bg-white`}>
                                {isScriptMode ? (
                                    <div className="w-full mx-auto p-4 sm:p-8 min-h-full bg-white max-w-4xl lg:max-w-5xl">
                                            {VIDEO_SCRIPT_DATA.map(line => {
                                                const isActive = activeLine === line.id;
                                                const isLeft = line.speaker === VIDEO_SCRIPT_DATA[0].speaker;
                                                const alignClass = isLeft ? 'items-start' : 'items-end';
                                                
                                                // Typography for Script Only Mode
                                                const speakerClass = "text-xs sm:text-sm md:text-base lg:text-base xl:text-base";
                                                const koreanClass = "text-base sm:text-lg md:text-xl lg:text-2xl xl:text-3xl";
                                                const englishClass = "text-xs sm:text-sm md:text-sm lg:text-sm xl:text-sm";
                                                
                                                // SVG Tail
                                                const TailSVG = () => (
                                                    <svg 
                                                        className={`absolute bottom-[-1px] ${isLeft ? '-left-[7px]' : '-right-[7px]'} w-[8px] h-[8px] z-10`} 
                                                        viewBox="0 0 8 8" 
                                                        fill="none" 
                                                        xmlns="http://www.w3.org/2000/svg"
                                                    >
                                                        <path d={isLeft ? "M8 0 C 8 4 4 8 0 8 L 8 8 V 0 Z" : "M0 0 C 0 4 4 8 8 8 L 0 8 V 0 Z"} fill="white" />
                                                        <path d={isLeft ? "M0 8 C 4 8 8 4 8 0" : "M8 8 C 4 8 0 4 0 0"} stroke={isActive ? "black" : "transparent"} strokeWidth="1" fill="none" /> 
                                                        <path d={isLeft ? "M8 0 V8" : "M0 0 V8"} stroke="white" strokeWidth="2" />
                                                    </svg>
                                                );

                                                return (
                                                    <div key={line.id} ref={el => scriptRefs.current[line.id] = el} className={`flex flex-col w-full mb-8 ${alignClass}`}>
                                                        <span className={`${speakerClass} font-bold font-ui uppercase tracking-widest text-gray-400 mb-2 ${isLeft ? 'ml-1' : 'mr-1'}`}>
                                                            {line.speaker}
                                                        </span>
                                                        
                                                        <div 
                                                            onClick={() => handleLineClick(line.time[0])}
                                                            className={`
                                                                relative px-6 py-5 max-w-[90%] md:max-w-[80%] 
                                                                bg-white border ${isActive ? 'border-black ring-1 ring-black' : 'border-transparent'} 
                                                                rounded-2xl ${isLeft ? 'rounded-bl-none' : 'rounded-br-none'}
                                                                hover:shadow-md transition-all duration-300 cursor-pointer group
                                                            `}
                                                        >
                                                            <p className={`${koreanClass} font-serif leading-[1.8] tracking-wide text-gray-800 text-left`}>
                                                                {renderTextWithVocab(line.kor)}
                                                            </p>
                                                            
                                                            {translations[line.id] && (
                                                                <div className="mt-3 pt-3 border-t border-dashed border-gray-100 animate-fade-in">
                                                                    <p className={`${englishClass} font-serif text-gray-500 leading-relaxed text-left`}>
                                                                        {line.eng}
                                                                    </p>
                                                                </div>
                                                            )}

                                                            <div className="flex items-center justify-between mt-4 gap-4">
                                                                <BubbleTranslateButton onClick={() => toggleTranslation(line.id)} isShowing={translations[line.id]} />

                                                                <button 
                                                                    onClick={(e) => { e.stopPropagation(); handleLineClick(line.time[0]); }}
                                                                    className="w-4 h-4 rounded-full border border-gray-300 flex items-center justify-center hover:bg-black hover:border-black hover:text-white transition-all text-gray-400"
                                                                >
                                                                    <PlayIconSolid className="w-2 h-2 ml-0.5" />
                                                                </button>
                                                            </div>

                                                            <TailSVG />
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            <div className="h-32"></div>
                                    </div>
                                ) : (
                                    <div className="p-8 space-y-8">
                                    {VIDEO_SCRIPT_DATA.map(line => {
                                            const isActive = activeLine === line.id;
                                            const justifyClass = 'justify-start';
                                            const textAlignClass = 'text-left';
                                            
                                            // Typography for Split View
                                            const speakerClass = "text-xs sm:text-sm md:text-base lg:text-base xl:text-base";
                                            const koreanClass = "text-base sm:text-lg md:text-xl lg:text-2xl xl:text-3xl";
                                            const englishClass = "text-xs sm:text-sm md:text-sm lg:text-sm xl:text-sm";

                                            return (
                                                <div key={line.id} ref={el => scriptRefs.current[line.id] = el} className={`transition-all duration-500 ${isActive ? 'opacity-100' : 'opacity-70 hover:opacity-90'}`}>
                                                    <div className={`flex items-center gap-2 mb-2 ${justifyClass}`}>
                                                        <span className={`${speakerClass} font-bold font-ui uppercase tracking-widest text-gray-400`}>{line.speaker}</span>
                                                        {isActive && <span className="w-1.5 h-1.5 bg-black rounded-full animate-pulse"></span>}
                                                    </div>
                                                    <div onClick={() => handleLineClick(line.time[0])} className="cursor-pointer group">
                                                        <p className={`${koreanClass} font-serif leading-relaxed ${textAlignClass} ${isActive ? 'text-black' : 'text-[#1a1a1a]'}`}>{renderTextWithVocab(line.kor)}</p>
                                                        {translations[line.id] ? (
                                                            <p className={`${englishClass} font-serif text-gray-500 mt-2 animate-fade-in pl-3 border-l border-gray-200 ${textAlignClass}`}>{line.eng}</p>
                                                        ) : null}
                                                        <div className={`flex mt-2 opacity-0 group-hover:opacity-100 transition-opacity justify-start`}>
                                                            <VideoTranslateButton onClick={() => toggleTranslation(line.id)} isShowing={translations[line.id]} />
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                    })}
                                    <div className="h-32"></div>
                                    </div>
                                )}
                            </div>
                        </div>
                        {showVocab && (
                            <div className={`w-80 flex flex-col bg-white border-l border-gray-200 animate-fade-in ${isScriptMode ? 'fixed right-0 top-[114px] h-[calc(100vh-114px)]' : 'h-full'}`}>
                                <div className="p-5 border-b border-gray-100 flex items-center justify-between bg-white">
                                    <span className="font-ui text-xs font-bold uppercase tracking-widest text-gray-900">핵심 어휘</span>
                                    <span className="text-xs font-serif text-gray-500 italic">{VIDEO_VOCAB_DATA.length}개</span>
                                </div>
                                <div className="flex-1 overflow-y-auto bg-white">
                                    {VIDEO_VOCAB_DATA.map((word, idx) => (<VideoSidebarVocabCard key={idx} word={word} activeVocabTerm={activeVocabTerm} sidebarVocabRefs={sidebarVocabRefs} />))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const SectionHeader = ({ title, subtitle, description }) => (
            <div className="mb-16 flex flex-col items-center text-center">
                <h2 className="text-[32px] md:text-[36px] font-bold text-[#1a1a1a] leading-tight font-serif mb-3 tracking-tight">
                    {title}
                </h2>
                {subtitle && (
                    <p className="text-[13px] text-[#888888] font-normal font-sans tracking-widest uppercase mb-2">
                        {subtitle}
                    </p>
                )}
                {description && (
                    <p className="text-[16px] text-[#444444] font-serif leading-relaxed mt-2 max-w-2xl">
                        {description}
                    </p>
                )}
                <div className="w-[1px] h-6 bg-gray-200 mt-8"></div>
            </div>
        );

        const VocabItem = ({ word }) => {
            const [showTrans, setShowTrans] = useState(false); const trans = word.translations?.en;
            return (
                <div className="border border-gray-200 hover:border-gray-300 transition-colors p-6 flex flex-col group bg-white h-full">
                    <div className="flex justify-between items-start mb-4">
                        <h3 className="text-[28px] font-bold font-serif text-[#1a1a1a] group-hover:text-black transition-colors">{word.term}</h3>
                        <div className="flex flex-col items-end gap-1"><TranslateButton onClick={() => setShowTrans(!showTrans)} isShowing={showTrans} />{showTrans && trans?.term && <span className="font-serif text-sm text-gray-400 italic animate-fade-in text-right">{trans.term}</span>}</div>
                    </div>
                    <div className="mb-6 flex-1">
                        <p className="text-[17px] text-[#444] font-serif leading-relaxed">{word.mainDef}</p>
                        {showTrans && trans?.mainDef && (<p className="text-sm text-gray-500 font-sans mt-2 animate-fade-in leading-relaxed">{trans.mainDef}</p>)}
                        
                        {word.subDefs && word.subDefs.length > 0 && (
                            <div className="mt-4 space-y-3 pl-3 border-l-2 border-gray-100">
                                {word.subDefs.map((sub, i) => (
                                    <div key={i}>
                                        <p className="text-sm font-bold text-gray-800 font-ui mb-0.5">{sub.subTerm}</p>
                                        <p className="text-sm text-gray-600 font-serif">{sub.subDef}</p>
                                        {showTrans && trans?.subDefs?.[i] && (
                                            <div className="mt-1 animate-fade-in">
                                                {trans.subDefs[i].term && <p className="text-xs text-gray-400 font-ui italic">{trans.subDefs[i].term}</p>}
                                                <p className="text-xs text-gray-400 font-sans">{trans.subDefs[i].def}</p>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    {word.examples && word.examples.length > 0 && (<div className="bg-gray-50 p-5 mt-auto border-l-2 border-transparent group-hover:border-gray-300 transition-all"><p className="text-[15px] text-[#1a1a1a] font-serif leading-snug">{word.examples[0].kor}</p>{showTrans && (<p className="text-[13px] text-gray-500 font-sans mt-2 pt-2 border-t border-gray-200 animate-fade-in">{word.examples[0].eng}</p>)}</div>)}
                </div>
            );
        };
        const VocabView = ({ updateProgress }) => { useEffect(() => { updateProgress('vocab'); }, []); return (<div className="max-w-4xl mx-auto w-full px-6 py-16 animate-fade-in"><SectionHeader title="핵심 어휘" description={`학습 자료에 등장하는 주요 어휘 ${VIDEO_VOCAB_DATA.length}개를 학습해 보세요.`} /><div className="grid grid-cols-1 md:grid-cols-2 gap-6">{VIDEO_VOCAB_DATA.map((word, idx) => (<VocabItem key={idx} word={word} />))}</div></div>); };

        const QuizSentence = ({ quiz, onAttempt, onShuffle }) => {
            const [userInput, setUserInput] = useState(''); const [result, setResult] = useState(null); const [showHint, setShowHint] = useState(false); const [showTranslation, setShowTranslation] = useState(false);
            const handleCheck = () => { const isCorrect = userInput.trim() === quiz.answer; setResult(isCorrect ? 'correct' : 'incorrect'); setShowHint(false); if (onAttempt) onAttempt(quiz.id, isCorrect); if (onShuffle) onShuffle(); };
            const handleShowAnswer = () => { setUserInput(quiz.answer); setResult(null); setShowHint(false); if (onShuffle) onShuffle(); }; 
            
            const textLength = Math.max(userInput.length, quiz.answer ? quiz.answer.length : 0);
            const safeWidth = Math.max(100, textLength * 25);

            return (
                <div className="mb-10 pb-10 border-b border-gray-200 last:border-0">
                    <div className="flex items-baseline gap-4 mb-4"><span className="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.{quiz.id}</span></div>
                    <div className="text-xl font-serif text-gray-900 leading-loose mb-6"><span>{quiz.textParts[0]}</span><input type="text" value={userInput} onChange={(e) => { setUserInput(e.target.value); setResult(null); }} className={`mx-2 px-2 py-0 border-b-2 font-bold text-center outline-none bg-transparent transition-colors font-serif ${result === 'correct' ? 'border-green-500 text-green-700' : result === 'incorrect' ? 'border-red-500 text-red-700' : 'border-gray-300 text-black focus:border-black'}`} style={{ width: `${safeWidth}px` }} /><span>{quiz.textParts[1]}</span></div>
                    <div className="flex flex-wrap gap-3 items-center"><button onClick={handleCheck} className="px-4 py-2 bg-black text-white text-xs font-bold font-sans hover:bg-gray-800 transition-colors">정답 확인</button><button onClick={handleShowAnswer} className="px-4 py-2 bg-white border border-gray-300 text-gray-600 text-xs font-bold font-sans hover:border-black hover:text-black transition-colors">정답 보기</button><button onClick={() => setShowHint(!showHint)} className="text-xs font-bold font-sans text-gray-400 hover:text-gray-600 underline">힌트</button><TranslateButton onClick={() => setShowTranslation(!showTranslation)} isShowing={showTranslation} /></div>
                    {showTranslation && (<p className="mt-4 text-sm font-sans text-gray-500 bg-gray-50 p-3">{quiz.textParts_eng.join(' ... ')}</p>)}{showHint && (<p className="mt-4 text-sm font-sans text-gray-500 italic">💡 Hint: {quiz.hint}</p>)}{result === 'correct' && (<p className="mt-4 text-sm font-sans text-green-700 font-medium">✓ Correct. {quiz.explanation}</p>)}{result === 'incorrect' && (<p className="mt-4 text-sm font-sans text-red-600 font-medium">✕ Try again.</p>)}
                </div>
            );
        };
        const QuizView = ({ updateProgress }) => {
            const [attempts, setAttempts] = useState({}); const [shuffledChoices, setShuffledChoices] = useState(ANSWER_CHOICES); const totalQuestions = QUIZ_LIST.length; const correctCount = Object.values(attempts).filter(v => v).length; const currentScore = Math.round((correctCount / totalQuestions) * 100);
            useEffect(() => { const totalAttempts = Object.keys(attempts).length; if (totalAttempts === 0) return; updateProgress('quiz', currentScore); }, [attempts, currentScore, updateProgress]);
            const handleAttempt = (quizId, isCorrect) => { setAttempts(prev => { if (prev.hasOwnProperty(quizId)) return prev; const newAttempts = { ...prev, [quizId]: isCorrect }; return newAttempts; }); };
            const shuffleChoices = useCallback(() => { setShuffledChoices(prev => { const newArray = [...prev]; for (let i = newArray.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [newArray[i], newArray[j]] = [newArray[j], newArray[i]]; } return newArray; }); }, []);
            return (
                <div className="max-w-4xl mx-auto w-full px-6 py-12 flex flex-col md:flex-row gap-12 animate-fade-in">
                    <div className="w-full md:w-64 shrink-0">
                        <div className="sticky top-24"> 
                            <div className="md:sticky md:top-24"> 
                                <h2 className="text-[32px] md:text-[36px] font-serif font-bold text-gray-900 mb-2">내용 확인 퀴즈</h2><p className="text-sm font-sans text-gray-500 mb-6">학습 자료에 대한 이해도를 확인해 보세요.</p><div className="border-t border-gray-200 pt-4 mb-8"><span className="text-xs font-bold font-sans text-black uppercase block mb-2">정답률</span><span className="text-4xl font-serif font-bold text-gray-900">{currentScore}%</span></div><div className="bg-gray-50 p-4 border border-gray-100"><h4 className="text-xs font-bold font-sans text-gray-500 uppercase mb-3 border-b border-gray-200 pb-2">정답 목록</h4><div className="flex flex-wrap gap-2">{shuffledChoices.map((choice, idx) => (<span key={idx} className="text-xs font-serif text-gray-600 bg-white border border-gray-200 px-2 py-1 select-all">{choice}</span>))}</div></div>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1">{QUIZ_LIST.map((quiz) => (<QuizSentence key={quiz.id} quiz={quiz} onAttempt={handleAttempt} onShuffle={shuffleChoices} />))}</div>
                </div>
            );
        };

        const DiscussQuestionItem = ({ item }) => {
            const [text, setText] = useState(''); const [showTranslation, setShowTranslation] = useState(false);
            return (
                <div className="mb-16">
                    <div className="flex items-center gap-4 mb-6"><span className="text-4xl font-serif font-bold text-gray-200">{item.id < 10 ? `0${item.id}` : item.id}</span><h3 className="text-xl font-serif font-bold text-gray-900 leading-normal">{item.questionKor}</h3></div>
                    <div className="pl-0 md:pl-14">
                        <div className="flex gap-2 mb-4"><TranslateButton onClick={() => setShowTranslation(!showTranslation)} isShowing={showTranslation} />{showTranslation && (<p className="text-sm font-sans text-gray-500 animate-fade-in">{item.questionEng}</p>)}</div>
                        
                        {item.vocab && item.vocab.length > 0 && (
                            <div className="bg-gray-50 p-5 mb-6 border-l-2 border-black">
                                <span className="text-xs font-bold font-sans text-gray-400 uppercase mb-3 block">핵심 어휘</span>
                                <div className="space-y-3">
                                    {item.vocab.map((v, i) => (
                                        <div key={i}>
                                            <p className="text-sm font-serif text-gray-700">
                                                <span className="font-bold text-black mr-2 inline-block min-w-[80px]">{v.term}</span>
                                                {v.def}
                                            </p>
                                            {showTranslation && v.engDef && (
                                                <p className="text-xs font-sans text-gray-500 mt-1 animate-fade-in md:pl-[88px]">{v.engDef}</p>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="여기에 생각을 적어보세요..." className="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300"></textarea>
                        <div className="flex justify-end"><button disabled={!text.trim()} className={`px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors ${!text.trim() ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}`}>AI 피드백 받기</button></div>
                    </div>
                </div>
            );
        };
        const DiscussView = ({ updateProgress }) => (
            <div className="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in">
                <div className="mb-6 pb-6 text-center"><h2 className="text-[32px] md:text-[36px] font-serif font-bold text-gray-900 mb-2">생각해 보기</h2><p className="text-sm font-sans text-gray-500">학습 자료에 대해 심층적으로 생각해 보세요.</p></div>
                <div className="bg-gray-50 border border-gray-200 p-4 mb-10 flex items-start gap-3"><div className="shrink-0 mt-0.5"><SparklesIcon className="w-4 h-4 text-gray-400" /></div><p className="text-xs font-sans text-gray-600 leading-relaxed">AI 피드백은 현재 Gemini 웹에서만 가능합니다. <a href="https://gemini.google.com" target="_blank" rel="noreferrer" className="underline decoration-gray-400 underline-offset-2 hover:text-black inline-flex items-center gap-1">Gemini에서 열기 <ExternalLinkIcon className="w-3 h-3"/></a></p></div>
                {DISCUSS_DATA.map((item) => (<DiscussQuestionItem key={item.id} item={item} />))}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home'); const [userLevel] = useState("B2+"); const [showVocab, setShowVocab] = useState(false); const [progress, setProgress] = useState({ learn: false, vocab: false, quiz: 0, discuss: false });
            const [isHeaderExpanded, setIsHeaderExpanded] = useState(true); // Default to open

            // Add this useEffect to manage header state based on tab
            useEffect(() => {
                if (activeTab === 'video') {
                    setIsHeaderExpanded(false); // Collapse for immersive learning
                } else {
                    setIsHeaderExpanded(true); // Expand for navigation/home
                }
            }, [activeTab]);

            const updateProgress = useCallback((key, value = true) => { setProgress(prev => { if (prev[key] === value) return prev; return { ...prev, [key]: value }; }); }, []);
            
            const renderContent = () => { 
                switch(activeTab) { 
                    case 'home': return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; 
                    case 'video': return <LearnView updateProgress={updateProgress} />;
                    case 'vocab': return <VocabView updateProgress={updateProgress} />; 
                    case 'quiz': return <QuizView updateProgress={updateProgress} />; 
                    case 'discuss': return <DiscussView updateProgress={updateProgress} />; 
                    default: return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; 
                } 
            };
            
            const isVideoTab = activeTab === 'video';
            return (
                <div className={`flex flex-col bg-white text-gray-900 selection:bg-gray-200 selection:text-black font-sans ${isVideoTab ? 'h-screen overflow-hidden' : 'min-h-screen'}`}>
                    <Header isExpanded={isHeaderExpanded} setIsExpanded={setIsHeaderExpanded} activeTab={activeTab} setActiveTab={setActiveTab} />
                    <div className="lg:hidden h-14 border-b border-gray-100 flex items-center justify-center sticky top-0 bg-white z-40"><span className="text-lg font-bold font-sans tracking-tighter">OpenKoreanLearningLab</span></div>
                    <main className={`flex-1 relative flex flex-col ${isVideoTab ? 'overflow-x-hidden lg:overflow-hidden lg:h-full' : ''}`}>{renderContent()}</main>
                    <nav className="lg:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 z-50">{NAV_ITEMS.map((item) => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 ${activeTab === item.id ? 'text-black' : 'text-gray-300'}`}><item.icon className="w-6 h-6" /></button>))}</nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
