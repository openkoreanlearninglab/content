    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const VIDEO_CONFIG = {
            YOUTUBE_VIDEO_ID: 'Q4O-bondzOk',

        };

        const VIDEO_SCRIPT_DATA = [
            { id: 's1', speaker: '널 위한 문화예술', kor: '앉을 수 없는 의자, 앉을 수 있는 예술 작품.', time: [0.1, 3.437], eng: "A chair you can't sit on, an artwork you can sit on." },
            { id: 's2', speaker: '널 위한 문화예술', kor: '디자인과 예술은 어떻게 다를까요?', time: [3.47, 5.9], eng: "How are design and art different?" },
            { id: 's3', speaker: '널 위한 문화예술', kor: '흔히 사람들은 예술과 디자인의 차이를 사고방식에서 찾습니다.', time: [5.939, 9.977], eng: "People often find the difference between art and design in their mindset." },
            { id: 's4', speaker: '널 위한 문화예술', kor: '예술적 사고방식은 \'내 안의 주제를 밖으로 표현하는 것\',', time: [10.01, 13.347], eng: "Artistic thinking is 'expressing the themes inside me to the outside'," },
            { id: 's5', speaker: '널 위한 문화예술', kor: '디자인적 사고방식을 \'내 밖의 문제를 제품을 통해 해결하는 것\'이라 말하죠.', time: [13.38, 17.918], eng: "Design thinking is called 'solving external problems through products'." },
            { id: 's6', speaker: '널 위한 문화예술', kor: '하지만 두 사고방식이 융합되는 경우도 허다합니다.', time: [17.951, 21.021], eng: "However, there are many cases where the two mindsets merge." },
            { id: 's7', speaker: '널 위한 문화예술', kor: '또한 예술가 같은 디자이너, 디자이너 같은 예술가들도 많이 존재하죠.', time: [21.054, 25.559], eng: "Also, there are many designers who are like artists, and artists who are like designers." },
            { id: 's8', speaker: '널 위한 문화예술', kor: '때때론 ‘실용성’을 예술과 디자인의 차이로 이야기하기도 하는데요.', time: [25.592, 29.63], eng: "Sometimes 'practicality' is discussed as the difference between art and design." },
            { id: 's9', speaker: '널 위한 문화예술', kor: '흔히 사람들은 예술 작품이 그 자체가 목적인 것이라 말합니다.', time: [29.663, 33.534], eng: "People often say that a work of art is an end in itself." },
            { id: 's10', speaker: '널 위한 문화예술', kor: '반대로 디자인 제품은 수단적이라고 말하죠.', time: [33.567, 36.236], eng: "Conversely, design products are said to be instrumental." },
            { id: 's11', speaker: '널 위한 문화예술', kor: '하지만 최근 들어 실용성에 주목한 작품들이 등장하기도 하고,', time: [36.27, 39.84], eng: "However, recently, works focusing on practicality have appeared," },
            { id: 's12', speaker: '널 위한 문화예술', kor: '반대로 실용적이지 않은 모습에 디자인이 등장하기도 하죠.', time: [39.873, 43.243], eng: "conversely, designs appear in impractical forms." },
            { id: 's13', speaker: '널 위한 문화예술', kor: '다시 말해, 근래 들어 이 경계가 흐려지고 있는데요.', time: [43.277, 46.179], eng: "In other words, this boundary has been blurring in recent years." },
            { id: 's14', speaker: '널 위한 문화예술', kor: '사실 과거에는 예술과 디자인의 차이점이 비교적 뚜렷했습니다.', time: [46.213, 50.517], eng: "In fact, in the past, the difference between art and design was relatively clear." },
            { id: 's15', speaker: '널 위한 문화예술', kor: '공예품을 비롯해 실생활에 쓰이는 제품을 만드는 장인들과', time: [50.55, 54.221], eng: "Craftsmen who make products used in real life, including crafts," },
            { id: 's16', speaker: '널 위한 문화예술', kor: '감상을 위한 작품을 만드는 예술가들은 선명하게 구분됐죠.', time: [54.254, 57.858], eng: "and artists who create works for appreciation were clearly distinguished." },
            { id: 's17', speaker: '널 위한 문화예술', kor: '하지만 현대 들어 디자인에 새로운 바람이 불기 시작합니다.', time: [57.891, 61.461], eng: "However, in modern times, a new wind begins to blow in design." },
            { id: 's18', speaker: '널 위한 문화예술', kor: '1919년 독일 바우하우스,', time: [61.495, 63.73], eng: "1919, Bauhaus in Germany," },
            { id: 's19', speaker: '널 위한 문화예술', kor: '이곳에선 여러 예술가들이 학생들에게 미술을 가르쳤는데요.', time: [63.764, 67.334], eng: "Here, various artists taught art to students." },
            { id: 's20', speaker: '널 위한 문화예술', kor: '바우하우스에서 가르치던 예술가 중엔', time: [67.367, 69.403], eng: "Among the artists who taught at the Bauhaus," },
            { id: 's21', speaker: '널 위한 문화예술', kor: '칸딘스키와 몬드리안 같은 작가들이 있었죠.', time: [69.436, 72.239], eng: "there were artists like Kandinsky and Mondrian." },
            { id: 's22', speaker: '널 위한 문화예술', kor: '바우하우스의 최종 목표는 각기 분산된 모든 미술 분야를 통합하는 것,', time: [72.272, 76.743], eng: "The ultimate goal of the Bauhaus was to integrate all scattered art fields," },
            { id: 's23', speaker: '널 위한 문화예술', kor: '그러면서 공예와 미술의 결합을 추구했습니다.', time: [76.777, 79.947], eng: "pursuing the combination of crafts and fine art." },
            { id: 's24', speaker: '널 위한 문화예술', kor: '당시 바우하우스의 예술가들은 \'조형의 아름다움을 지배하는 단일한 원리가 있다\' 믿었죠.', time: [79.98, 85.152], eng: "At that time, Bauhaus artists believed that 'there is a single principle governing the beauty of formative arts'." },
            { id: 's25', speaker: '널 위한 문화예술', kor: '그 결과 직선이나 원 같은 단순한 조형을 토대로 추상화를 그려냈는데요.', time: [85.185, 89.823], eng: "As a result, they drew abstract paintings based on simple shapes like straight lines or circles." },
            { id: 's26', speaker: '널 위한 문화예술', kor: '이런 정신은 바우하우스를 통해 디자인에 적용됐죠.', time: [89.856, 93.226], eng: "This spirit was applied to design through the Bauhaus." },
            { id: 's27', speaker: '널 위한 문화예술', kor: '구체적인 비유나 상징을 억제하고 단순하면서 실용적인 제품들.', time: [93.26, 97.731], eng: "Simple and practical products that suppress concrete metaphors or symbols." },
            { id: 's28', speaker: '널 위한 문화예술', kor: '바우하우스의 예술가들은 "기능적인 것이 아름답다"는 정신 아래', time: [97.764, 101.635], eng: "Under the spirit that 'functional is beautiful', Bauhaus artists" },
            { id: 's29', speaker: '널 위한 문화예술', kor: '가장 우수한 표준을 만드는 데 전념했죠.', time: [102.668, 104.204], eng: "dedicated themselves to creating the best standards." },
            { id: 's30', speaker: '널 위한 문화예술', kor: '이러한 정신은 장인의 시대에서 산업 시대로 넘어가는 시기에,', time: [104.237, 107.808], eng: "This spirit, in the transition from the era of craftsmen to the industrial era," },
            { id: 's31', speaker: '널 위한 문화예술', kor: '새로운 디자인들을 탄생시키며 현대 디자인의 모태가 되었는데요.', time: [107.841, 111.912], eng: "gave birth to new designs and became the matrix of modern design." },
            { id: 's32', speaker: '널 위한 문화예술', kor: '다시 말해 예술가들의 생각이 현대 디자인을 탄생시킨 것입니다.', time: [111.945, 116.016], eng: "In other words, the ideas of artists gave birth to modern design." },
            { id: 's33', speaker: '널 위한 문화예술', kor: '최근 들어서는 포스트모던 디자인이 등장했는데요.', time: [116.049, 119.319], eng: "Recently, postmodern design has emerged." },
            { id: 's34', speaker: '널 위한 문화예술', kor: '‘포스트모던’이란 한 가지 패턴이나 개념으로 묶는 것을 경계하며', time: [119.353, 123.123], eng: "'Postmodern' warns against binding things into a single pattern or concept," },
            { id: 's35', speaker: '널 위한 문화예술', kor: '이러한 흐름으로부터 탈출하는 움직임을 말하죠.', time: [123.156, 125.926], eng: "and refers to the movement to escape from this flow." },
            { id: 's36', speaker: '널 위한 문화예술', kor: '단일한 원리를 쫓던 바우하우스 디자인과 달리,', time: [125.959, 128.829], eng: "Unlike Bauhaus design, which chased a single principle," },
            { id: 's37', speaker: '널 위한 문화예술', kor: '포스트모던 디자인은 “아름다움의 원칙 같은 건 존재하지 않는다”고 생각했죠.', time: [128.862, 133.567], eng: "postmodern design thought that 'principles of beauty do not exist'." },
            { id: 's38', speaker: '널 위한 문화예술', kor: '따라서 단순한 패턴이나 조형성을 넘어', time: [133.6, 136.103], eng: "Therefore, beyond simple patterns or formativeness," },
            { id: 's39', speaker: '널 위한 문화예술', kor: '제작자만이 가진 스토리를 디자인에 담아내는 시도들이 이어졌는데요.', time: [136.136, 140.173], eng: "attempts to capture the creator's unique story in design continued." },
            { id: 's40', speaker: '널 위한 문화예술', kor: '그러면서 예술과 마찬가지로 디자이너의 생각이 작품에 담기기 시작했죠.', time: [140.207, 144.845], eng: "In doing so, like art, the designer's thoughts began to be embodied in the work." },
            { id: 's41', speaker: '널 위한 문화예술', kor: '더불어 현대 들어 일상과 예술의 경계가 허물어지고 있는데요.', time: [144.878, 148.548], eng: "In addition, in modern times, the boundary between daily life and art is collapsing." },
            { id: 's42', speaker: '널 위한 문화예술', kor: '예술을 다양한 영역에 접목하는 시도가 늘어났고,', time: [148.582, 151.718], eng: "Attempts to graft art into various fields have increased," },
            { id: 's43', speaker: '널 위한 문화예술', kor: '덕분에 디자인과 예술의 경계는 더욱 더 흐려지고 있죠.', time: [151.752, 154.988], eng: "thanks to this, the boundary between design and art is blurring even more." },
            { id: 's44', speaker: '널 위한 문화예술', kor: '또한 최근에는 디자인을 담는 미술관 전시가 나타나면서', time: [155.022, 158.725], eng: "Also, recently, as museum exhibitions featuring design have appeared," },
            { id: 's45', speaker: '널 위한 문화예술', kor: '작품이 된 디자인을 심심치 않게 볼 수 있죠.', time: [158.759, 161.628], eng: "we can often see designs that have become artworks." },
            { id: 's46', speaker: '널 위한 문화예술', kor: '현대에도 많은 예술가와 디자이너에 의해', time: [161.662, 164.164], eng: "Even in modern times, by many artists and designers," },
            { id: 's47', speaker: '널 위한 문화예술', kor: '예술과 디자인의 경계는 계속해서 재정의되고 있습니다.', time: [164.197, 167.834], eng: "the boundary between art and design continues to be redefined." },
            { id: 's48', speaker: '널 위한 문화예술', kor: '또한 그러한 과정에서 새로운 디자인 그리고 새로운 작품들이 탄생하고 있죠.', time: [167.868, 172.606], eng: "Also, in that process, new designs and new works are being born." },
            { id: 's49', speaker: '널 위한 문화예술', kor: '점점 더 모호해지는 예술과 디자인의 관계,', time: [172.639, 175.609], eng: "The increasingly ambiguous relationship between art and design," },
            { id: 's50', speaker: '널 위한 문화예술', kor: '앞으로 또 어떤 제품과 작품이 우리 앞에 펼쳐질까요?', time: [175.642, 180.0], eng: "what products and works will unfold before us in the future?" }
        ];

            const apiKey = ""; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        if (response.status === 401 || response.status === 403) {
                            throw new Error(`API 인증 오류(HTTP ${response.status})입니다. 유효한 API 키가 필요합니다.\n${errorText}`);
                        }
                        if (response.status === 400) {
                             throw new Error(`잘못된 요청(HTTP 400)입니다.\n${errorText}`);
                        }
                        throw new Error(`HTTP Error: ${response.status} - ${errorText}`);
                    }

                    return await response.json();
                } catch (error) {
                    if (error.message.includes('인증 오류') || error.message.includes('잘못된 요청')) {
                        throw error;
                    }
                    if (i === maxRetries) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

                        <div className="sticky top-24 print:static"> 
                            <div className="md:sticky md:top-24 print:static"> 
                                <h2 className="text-[32px] md:text-[36px] font-serif font-bold text-gray-900 mb-2 print:text-[18px]">내용 확인 퀴즈</h2><p className="text-sm font-sans text-gray-500 mb-6 print:text-[12px] print:mb-4">학습 자료에 대한 이해도를 확인해 보세요.</p><div className="border-t border-gray-200 pt-4 mb-8 print:hidden"><span className="text-xs font-bold font-sans text-black uppercase block mb-2">정답률</span><span className="text-4xl font-serif font-bold text-gray-900">{currentScore}%</span></div><div className="bg-gray-50 p-4 border border-gray-100 print:bg-transparent print:border-none print:p-0"><h4 className="text-xs font-bold font-sans text-gray-500 uppercase mb-3 border-b border-gray-200 pb-2 print:text-[12px] print:border-none print:pb-0">정답 목록</h4><div className="flex flex-wrap gap-2 print:gap-1">{shuffledChoices.map((choice, idx) => (<span key={idx} className="text-xs font-serif text-gray-600 bg-white border border-gray-200 px-2 py-1 select-all print:border-gray-300 print:text-[10px]">{choice}</span>))}</div></div>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1">{QUIZ_LIST.map((quiz) => (<QuizSentence key={quiz.id} quiz={quiz} onAttempt={handleAttempt} onShuffle={shuffleChoices} />))}</div>
                </div>
            );
        };

        const DiscussQuestionItem = ({ item }) => {
            const [text, setText] = useState(''); 
            const [showTranslation, setShowTranslation] = useState(false);
            const [feedback, setFeedback] = useState(null);
            const [isLoadingFeedback, setIsLoadingFeedback] = useState(false);
            const [feedbackError, setFeedbackError] = useState(null);
            const [showFeedbackTrans, setShowFeedbackTrans] = useState(false);

            const handleGetFeedback = async () => {
                if (!text.trim()) return;
                setIsLoadingFeedback(true);
                setFeedbackError(null);

                const prompt = `당신은 한국어 학습자를 돕는 'AI 한국어 도우미'입니다.
학습자가 질문에 대해 작성한 답변을 분석하고, 아래의 JSON 형식으로 피드백을 제공해주세요.
반드시 마크다운 백틱 문자를 제외하고 순수 JSON 문자열만 반환하세요.

[질문]: ${item.questionKor}
[학습자 답변]: ${text}

[JSON 응답 포맷]:
{
  "overallPraise": "학습자의 답변에 대한 총평과 잘한 점 (한국어)",
  "overallPraiseTrans": "총평의 영어 번역",
  "corrections": [
    {
      "original": "학습자가 쓴 원래 문장",
      "corrected": "자연스럽게 문법과 어휘를 수정한 문장",
      "explanation": "왜 그렇게 수정해야 하는지 상세한 이유와 문법적 설명. 문법적 오류일 경우 쉬운 예시 포함 (한국어)",
      "explanationTrans": "설명의 영어 번역"
    }
  ]
}`;

                const payload = {
                    contents: [{ role: "user", parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" },
                    safetySettings: [
                         { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                         { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                         { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                         { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                    ]
                };

                try {
                    const data = await callGeminiWithBackoff(payload);
                    let resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!resultText) throw new Error("응답이 비어있습니다.");
                    
                    resultText = resultText.replace(/^```json\n?/, '').replace(/\n?```$/, '');
                    
                    const parsedFeedback = JSON.parse(resultText);
                    setFeedback(parsedFeedback);
                } catch (err) {
                    setFeedbackError(err.message);
                } finally {
                    setIsLoadingFeedback(false);
                }
            };

            return (
                <div className="mb-16 group print:mb-8 print:break-inside-avoid">
                    <div className="flex items-center gap-4 mb-6 print:mb-2"><span className="text-4xl font-serif font-bold text-gray-200 group-hover:text-gray-900 transition-colors duration-300 print:text-[14px] print:text-black">{item.id < 10 ? '0' + item.id : item.id}</span><h3 className="text-xl font-serif font-bold text-gray-900 leading-normal print:text-[12px]">{item.questionKor}</h3></div>
                    <div className="pl-0 md:pl-14 print:pl-6">
                        <div className="flex gap-2 mb-4 print:hidden"><TransBtn onClick={() => setShowTranslation(!showTranslation)} isShowing={showTranslation} />{showTranslation && (<p className="text-sm font-sans text-gray-500 animate-fade-in">{item.questionEng}</p>)}</div>
                        <div className="bg-gray-50 p-5 mb-6 border-l-2 border-black print:bg-transparent print:p-0 print:border-l-[1px] print:border-gray-300 print:pl-3 print:mb-2">
                            <span className="text-xs font-bold font-sans text-gray-400 uppercase mb-2 block print:hidden">핵심 어휘</span>
                            <div className="space-y-2 print:space-y-0.5">
                                {item.vocab.map((v, i) => (
                                    <div key={i} className="flex flex-col">
                                        <p className="text-sm font-serif text-gray-700 whitespace-pre-line print:text-[10px]"><span className="font-bold text-black mr-2 print:text-[10px] print:mr-1">{v.term}</span>{v.def}</p>
                                        <p className={`text-xs font-sans text-gray-500 mt-1 whitespace-pre-line ${showTranslation ? 'animate-fade-in block' : 'hidden'} print:hidden`}><span className="font-semibold text-gray-600 mr-1">{v.termEng} :</span>{v.defEng}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="여기에 생각을 적어보세요..." className="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300 print:hidden"></textarea>
                        <div className="flex justify-end print:hidden">
                            <button onClick={handleGetFeedback} disabled={!text.trim() || isLoadingFeedback} className={`px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors ${!text.trim() || isLoadingFeedback ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}`}>
                                {isLoadingFeedback ? '생성 중...' : 'AI 피드백 받기'}
                            </button>
                        </div>
                        
                        {isLoadingFeedback && (
                            <div className="mt-6 p-6 border border-gray-200 flex flex-col items-center justify-center print:hidden">
                                <div className="w-6 h-6 border-2 border-gray-200 border-t-black rounded-full animate-spin mb-3"></div>
                                <p className="text-sm font-sans text-gray-500">AI 한국어 도우미가 피드백을 작성 중입니다...</p>
                            </div>
                        )}
                        {feedbackError && (
                            <div className="mt-6 p-4 bg-red-50 text-red-600 text-sm font-sans print:hidden whitespace-pre-wrap">
                                {feedbackError}
                            </div>
                        )}
                        {feedback && (
                            <div className="mt-8 relative print:hidden animate-fade-in">
                                <div className="flex items-center gap-2 mb-4">
                                    <SparklesIcon className="w-4 h-4 text-black" />
                                    <h4 className="text-base font-bold font-sans text-black">AI 한국어 도우미</h4>
                                </div>
                                
                                <div className="bg-gray-50 p-5 mb-6">
                                    <span className="text-xs font-bold font-sans text-gray-500 uppercase block mb-2">총평 및 잘한 점</span>
                                    <p className="text-[15px] font-serif text-gray-900 leading-relaxed">{feedback.overallPraise}</p>
                                    {showFeedbackTrans && feedback.overallPraiseTrans && (
                                        <p className="text-[13px] font-serif text-gray-500 mt-2 pt-2 border-t border-gray-200 animate-fade-in">{feedback.overallPraiseTrans}</p>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    <span className="text-xs font-bold font-sans text-gray-500 uppercase block mb-1">문장별 교정 및 설명</span>
                                    {feedback.corrections?.map((c, i) => (
                                        <div key={i} className="border border-gray-200 p-5 bg-white">
                                            <div className="flex flex-col gap-3 mb-4">
                                                <div className="flex items-start gap-3">
                                                    <span className="shrink-0 px-2 py-0.5 bg-gray-100 text-gray-500 text-[10px] font-bold font-sans rounded-sm mt-0.5">수정 전</span>
                                                    <p className="text-[15px] font-serif text-gray-400 line-through leading-relaxed">{c.original}</p>
                                                </div>
                                                <div className="flex items-start gap-3">
                                                    <span className="shrink-0 px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-bold font-sans rounded-sm mt-0.5">수정 후</span>
                                                    <p className="text-[15px] font-serif text-gray-900 font-medium leading-relaxed">{c.corrected}</p>
                                                </div>
                                            </div>
                                            
                                            <div className="pt-3 border-t border-gray-100">
                                                <div className="flex items-start gap-2">
                                                    <span className="shrink-0 text-yellow-500 mt-0.5">💡</span>
                                                    <div className="flex-1">
                                                        <p className="text-[14px] font-serif text-gray-700 leading-relaxed">
                                                            <span className="font-bold text-gray-500 text-xs font-sans mr-2">설명</span>
                                                            {c.explanation}
                                                        </p>
                                                        {showFeedbackTrans && c.explanationTrans && (
                                                            <p className="text-[13px] font-serif text-gray-500 mt-2 pt-2 border-t border-gray-50 animate-fade-in leading-relaxed">{c.explanationTrans}</p>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                {/* 번역 버튼: 하단 우측, opacity-40 */}
                                <div className="flex justify-end mt-4">
                                    <TransBtn 
                                        onClick={() => setShowFeedbackTrans(!showFeedbackTrans)} 
                                        isShowing={showFeedbackTrans} 
                                        className="opacity-40 hover:opacity-100 transition-opacity" 
                                    />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        const DiscussView = ({ updateProgress }) => (
            <div className="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in print:pt-4 print:px-0">
                <div className="mb-6 pb-6 text-center print:mb-4 print:pb-2"><h2 className="text-[32px] md:text-[36px] font-serif font-bold text-gray-900 mb-2 print:text-[18px]">생각해 보기</h2><p className="text-sm font-sans text-gray-500 print:text-[12px]">학습 자료에 대해 심층적으로 생각해 보세요.</p></div>
                <div className="bg-gray-50 border border-gray-200 p-4 mb-10 flex items-start gap-3 print:hidden"><div className="shrink-0 mt-0.5"><SparklesIcon className="w-4 h-4 text-gray-400" /></div><p className="text-xs font-sans text-gray-600 leading-relaxed">AI 피드백은 현재 Gemini 웹에서만 가능합니다. <a href="https://gemini.google.com/share/f5f77ec471ed" target="_blank" rel="noreferrer" className="underline decoration-gray-400 underline-offset-2 hover:text-black inline-flex items-center gap-1">Gemini에서 열기 <ExternalLinkIcon className="w-3 h-3" /></a></p></div>
                {DISCUSS_DATA.map((item) => (<DiscussQuestionItem key={item.id} item={item} />))}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home'); const [userLevel] = useState("B2+"); const [showVocab, setShowVocab] = useState(false); const [progress, setProgress] = useState({ learn: false, vocab: false, quiz: 0, discuss: false });
            const [isHeaderExpanded, setIsHeaderExpanded] = useState(true);

            useEffect(() => {
                if (activeTab === 'video') { setIsHeaderExpanded(false); } else { setIsHeaderExpanded(true); }
            }, [activeTab]);

            const updateProgress = useCallback((key, value = true) => { setProgress(prev => { if (prev[key] === value) return prev; return { ...prev, [key]: value }; }); }, []);
            
            const renderContent = () => { 
                switch(activeTab) { 
                    case 'home': return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; 
                    case 'video': return <LearnView updateProgress={updateProgress} />;
                    case 'vocab': return <VocabView updateProgress={updateProgress} />; 
                    case 'quiz': return <QuizView updateProgress={updateProgress} />; 
                    case 'discuss': return <DiscussView updateProgress={updateProgress} />; 
                    default: return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; 
                } 
            };
            
            const isVideoTab = activeTab === 'video';
            return (
                <div className={`flex flex-col bg-white text-gray-900 selection:bg-gray-200 selection:text-black font-sans ${isVideoTab ? 'h-screen overflow-hidden' : 'min-h-screen'} print:block print:h-auto print:min-h-0 print:m-0 print:p-0 print:overflow-visible`}>
                    <Header isExpanded={isHeaderExpanded} setIsExpanded={setIsHeaderExpanded} activeTab={activeTab} setActiveTab={setActiveTab} />
                    <div className="lg:hidden h-14 border-b border-gray-100 flex items-center justify-center sticky top-0 bg-white z-40 print:hidden"><span className="text-lg font-bold font-sans tracking-tighter">OpenKoreanLearningLab</span></div>
                    <main className={`flex-1 relative flex flex-col ${isVideoTab ? 'overflow-x-hidden lg:overflow-hidden lg:h-full' : ''} print:block print:overflow-visible print:h-auto`}>{renderContent()}</main>
                    <nav className="lg:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 z-50 print:hidden">{NAV_ITEMS.map((item) => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 ${activeTab === item.id ? 'text-black' : 'text-gray-300'}`}><item.icon className="w-6 h-6" /></button>))}</nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
