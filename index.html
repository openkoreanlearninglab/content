            { level: "C2", tags: ["철학"], title: "부끄러움에 대한 이해: 수치심과 염치는 어떻게 다를까요?", link: "https://drive.google.com/open?id=1w_E0MVH7c350N6O9c_0BHsNwGkLwirv6K7WDfSHeJr4&usp=drive_copy" },
            { level: "C2", tags: ["철학"], title: "사단칠정 논쟁- 인간의 본성은 선한가 악한가?", link: "https://drive.google.com/open?id=1dezqn5JOsSKpIz9_YDlp_fOJmwRXxj-oUbShTjMYN7w&usp=drive_copy" },
            { level: "C2", tags: ["철학"], title: "오직 이성만으로 도덕적 선과 악을 구별할 수 있을까? - 데이비드 흄(David Hume )", link: "https://drive.google.com/open?id=1ZnCen6dN88cDMjEK0yad34M1-NxG2HyH6ahpBgrW5OE&usp=drive_copy" },
            { level: "C2", tags: ["철학"], title: "존 스튜어트 밀 «자유론»", link: "https://drive.google.com/open?id=1HK0MK3RLgUghzKaRymbTXcJajK0QBxF0VeNFI-04enU&usp=drive_copy" },
            { level: "C2", tags: ["철학"], title: "타인의 도덕적 잘못을 심판해야 할까요?", link: "https://drive.google.com/open?id=1ZVK1QITTWTudvDwC3dm8-yWIW8-kiatisQJFHzr4vis&usp=drive_copy" },
            { level: "C2", tags: ["철학", "과학"], title: "📚 단 한 번의 앎혁명", link: "https://drive.google.com/open?id=1ISxowjHOeoDNEKiBqMK8gWdr7R92KjSZn3OY9FswpWo&usp=drive_copy" },
            { level: "C2", tags: ["철학", "과학"], title: "과학과 철학 그리고 언어 - 철학으로 보는 과학", link: "https://drive.google.com/open?id=1NDDNBUuj2RRPPBOrwpSV3gWTRrbMG5QhHyxTSv_ENKQ&usp=drive_copy" },
            { level: "C2", tags: ["철학", "과학"], title: "시간에 대한 태도와 무시제적 시간 이론", link: "https://drive.google.com/open?id=1yX5y4-ugi7mewufTKc8LRIRDaBcVgq6UybVSBe_XzsE&usp=drive_copy" },
            { level: "C2", tags: ["철학", "교육"], title: "<메논>과 <무지한 스승>을 통해 알아보는 배움의 정의: 설명 없이 배울 수 있을까?", link: "https://drive.google.com/open?id=1ZKkboh1LzYDRC3HW1--1zcfWmpcTEVQ8RmCjURXuIXM&usp=drive_copy" },
            { level: "C2", tags: ["철학", "언어"], title: "말할 수 없는 것은 침묵해야 한다 : 언어와 삶", link: "https://drive.google.com/open?id=14rzpxQAEauYPqTUUD91io6gqhxgMpYedlrdBcD7xJx0&usp=drive_copy" },
            { level: "C2", tags: ["철학", "언어"], title: "표상과 현상은 무엇일까요?", link: "https://drive.google.com/open?id=1e2mKtmrd3gN2EIVVQ4oWjC3c4PHYJHZqyY5DAHKkAOU&usp=drive_copy" },
            { level: "C2", tags: ["철학", "언어", "역사"], title: "<역사를 읽는 방법> - 1장 서론：그들의 방식으로 바라보기", link: "https://drive.google.com/open?id=1bWysDNo3szA9MIWAv0Ud-oPGGG3ovkop6YMa4pnTLLU&usp=drive_copy" }
        ];

        // --- Thumbnail Resolver ---
        // 1) Local HTML files → use the YouTube ID embedded in that page (auto-extracted at build time).
        // 2) Google Drive files → use Drive's thumbnail endpoint.
        // 3) Fallback → minimal monochrome block with the level code.
        const HTML_THUMBNAIL_MAP = {
            "b1plus-reels-addiction.html":                { type: "youtube", id: "nSqNLM5orPo" },
            "b2-reels-addiction.html":                    { type: "youtube", id: "nSqNLM5orPo" },
            "b2plus-why-koreans-like-chewy-texture.html": { type: "youtube", id: "Q3xPFQgDG4E" },
            "c1-dubai-cookie-science.html":               { type: "youtube", id: "htzfNwDM7II" },
            "c1-kospi-5000-meaning.html":                 { type: "youtube", id: "Ehz6n9RxMsc" },
            "b1plus-dubai-chewy-cookie.html":             { type: "youtube", id: "sVm4-Jd5bp4" },
            "b2plus-why-we-say-gata-yo.html":             { type: "youtube", id: "nb-L3S8AFh8" },
            "c1plus-korean-christmas-cake-origin.html":   { type: "youtube", id: "YoIbPhMETD8" },
            "b2plus-museum-admission.html":               { type: "youtube", id: "ljr7gKBXpKA" },
            "b2plus-cannabis-drink.html":                 { type: "youtube", id: "sEit34nId58" },
            "b2plus-fade-out-in-pop-songs.html":          { type: "image",   url: "https://raw.githubusercontent.com/openkoreanlearninglab/hub/refs/heads/main/Number%20of%20songs%20that%20fade%20out%20in%20the%20top%2010%20-%20by%20Vox%20%22Why%20more%20pop%20songs%20should%20end%20with%20a%20fade%20out%22.png" }
        };

        const getThumbnail = (link) => {
            if (!link) return null;
            // Google Drive — Drive의 첫 페이지 썸네일을 직접 사용
            if (link.includes("drive.google.com")) {
                const m = link.match(/[?&]id=([A-Za-z0-9_-]+)/);
                if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w400`;
            }
            // 같은 폴더의 학습 페이지 — 페이지 안에 박혀 있는 YouTube/이미지 썸네일 재사용
            if (HTML_THUMBNAIL_MAP[link]) {
                const m = HTML_THUMBNAIL_MAP[link];
                if (m.type === "youtube") return `https://img.youtube.com/vi/${m.id}/mqdefault.jpg`;
                if (m.type === "image")   return m.url;
            }
            return null;
        };

        // 페이지에 박힌 썸네일이 없을 때 — 그 페이지의 '시작 화면' 자체(태그 + 제목)를
        // 인라인 JSX로 즉석 그려서 썸네일 자리에 넣는다. 별도 파일을 만들지 않는다.
        const HomePreview = ({ item }) => {
            const tags = (item.tags || []).slice(0, 3);
            const levelTitle = LEVEL_DEFINITIONS[item.level] ? LEVEL_DEFINITIONS[item.level].title : "";
            return (
                <div className="absolute inset-0 bg-white border-r border-gray-100 flex flex-col items-center justify-center text-center px-3 sm:px-4 py-5">
                    <div className="flex items-center justify-center flex-wrap gap-1 mb-3">
                        {tags.map((t, i) => (
                            <span key={i} className="bg-gray-900 text-white text-[9px] font-bold font-sans tracking-widest uppercase px-1.5 py-0.5">{t}</span>
                        ))}
                        <span className="border border-gray-900 text-gray-900 text-[9px] font-bold font-sans tracking-widest uppercase px-1.5 py-0.5">
                            {item.level}{levelTitle ? ` · ${levelTitle}` : ""}
                        </span>
                    </div>
                    <h4 className="font-serif text-[13px] sm:text-sm md:text-base font-bold text-gray-900 leading-snug line-clamp-4 break-keep">
                        {item.title}
                    </h4>
                    <div className="mt-3 w-6 h-px bg-gray-200"></div>
                </div>
            );
        };

        // --- Icons ---
        const SearchIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
            </svg>
        );
        const XIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
            </svg>
        );
        const ArrowRightIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M5 12h14" /><path d="m12 5 7 7-7 7" />
            </svg>
        );
        const PlayIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M8 5v14l11-7z" />
            </svg>
        );

        // --- Top Navigation ---
        const TopNav = ({ activeLevel, setActiveLevel }) => {
            const items = [
                { id: 'home', label: '전체' },
                { id: 'B1+',  label: 'B1+' },
                { id: 'B2',   label: 'B2' },
                { id: 'B2+',  label: 'B2+' },
                { id: 'C1',   label: 'C1' },
                { id: 'C1+',  label: 'C1+' },
                { id: 'C2',   label: 'C2' }
            ];
            return (
                <header className="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-gray-100">
                    <div className="max-w-6xl mx-auto px-6 lg:px-8 h-16 flex items-center justify-between gap-6">
                        <a href="#" onClick={(e) => { e.preventDefault(); setActiveLevel('home'); }} className="flex items-center gap-2 shrink-0">
                            <span className="font-serif text-lg md:text-xl font-bold text-black tracking-tight">OpenKoreanLab</span>
                        </a>
                        <nav className="flex items-center gap-1 overflow-x-auto scrollbar-none">
                            {items.map(item => {
                                const isActive = activeLevel === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveLevel(item.id)}
                                        className={`relative shrink-0 px-3 md:px-4 py-2 text-xs md:text-sm font-sans tracking-wide transition-colors duration-200
                                            ${isActive ? 'text-black font-bold' : 'text-gray-400 hover:text-gray-700 font-medium'}`}
                                    >
                                        {item.label}
                                        {isActive && <span className="absolute left-3 right-3 -bottom-px h-px bg-black"></span>}
                                    </button>
                                );
                            })}
                        </nav>
                    </div>
                </header>
            );
        };

        // --- Card Thumbnail ---
        // 1) 그 페이지 안에 박혀 있는 썸네일(YouTube ID / 임베디드 이미지 / Drive 첫 페이지)이 있으면 그걸 사용
        // 2) 없거나 로드 실패하면, 그 페이지의 시작 화면(태그 + 한글 제목)을 그대로 본뜬
        //    인라인 JSX 미리보기를 보여준다. 별도 이미지 파일은 만들지 않는다.
        const CardThumbnail = ({ item }) => {
            const externalUrl = getThumbnail(item.link);
            const [errored, setErrored] = useState(false);
            const useFallback = !externalUrl || errored;
            const isVideo = !useFallback
                && item.link && item.link.endsWith('.html')
                && HTML_THUMBNAIL_MAP[item.link]
                && HTML_THUMBNAIL_MAP[item.link].type === 'youtube';
            return (
                <div className={`w-1/3 sm:w-1/4 min-w-[120px] sm:min-w-[180px] md:min-w-[220px] relative overflow-hidden shrink-0 ${useFallback ? 'bg-white' : 'bg-gray-900'}`}>
                    {useFallback ? (
                        <HomePreview item={item} />
                    ) : (
                        <img
                            src={externalUrl}
                            alt={item.title}
                            loading="lazy"
                            referrerPolicy="no-referrer"
                            onError={() => setErrored(true)}
                            className="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-95 group-hover:opacity-100"
                        />
                    )}
                    {isVideo && (
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                            <div className="w-9 h-9 md:w-10 md:h-10 bg-black/55 rounded-full flex items-center justify-center backdrop-blur-sm group-hover:bg-black/75 transition-colors">
                                <PlayIcon className="w-3.5 h-3.5 md:w-4 md:h-4 text-white ml-0.5" />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Material Card ---
        const MaterialCard = ({ item, onSelectTag, selectedTag }) => {
            const isExternal = item.link && item.link.startsWith('http');
            const linkProps = isExternal ? { target: '_blank', rel: 'noreferrer' } : {};
            return (
                <a
                    href={item.link || '#'}
                    {...linkProps}
                    className="group relative flex items-stretch w-full bg-white border border-gray-200 hover:border-black transition-all duration-300 text-left overflow-hidden rounded-xl"
                >
                    <CardThumbnail item={item} />
                    <div className="flex-1 p-5 md:p-6 flex flex-col justify-center min-w-0">
                        <div className="flex items-center flex-wrap gap-2 mb-3">
                            <span className="px-2 py-0.5 border border-gray-900 text-gray-900 text-[10px] font-sans font-bold tracking-widest uppercase rounded-sm">
                                {item.level}
                            </span>
                            {item.tags && item.tags.map(tag => (
                                <button
                                    key={tag}
                                    onClick={(e) => { e.preventDefault(); onSelectTag(tag); }}
                                    className={`px-2 py-0.5 text-[10px] font-sans font-bold tracking-widest uppercase rounded-sm transition-colors
                                        ${selectedTag === tag
                                            ? 'bg-gray-900 text-white border border-gray-900'
                                            : 'bg-gray-100 text-gray-600 border border-gray-100 hover:bg-gray-200'}`}
                                >
                                    {tag}
                                </button>
                            ))}
                        </div>
                        <h3 className="font-serif text-base md:text-lg lg:text-xl font-bold text-gray-900 leading-snug line-clamp-3 group-hover:text-black">
                            {item.title}
                        </h3>
                        <div className="mt-3 hidden md:flex items-center gap-1.5 text-gray-400 group-hover:text-black text-xs font-sans transition-colors">
                            <span>자료 보기</span>
                            <ArrowRightIcon className="w-3.5 h-3.5 transition-transform group-hover:translate-x-1" />
                        </div>
                    </div>
                </a>
            );
        };

        // --- Home View ---
        const HomeView = ({ activeLevel, setActiveLevel }) => {
            const [selectedTag, setSelectedTag] = useState("전체");
            const [searchQuery, setSearchQuery] = useState("");

            const allTags = useMemo(() => {
                const tags = new Set(["전체", "최신"]);
                MATERIALS_DATA.forEach(item => {
                    if (activeLevel !== 'home' && item.level !== activeLevel) return;
                    if (item.tags) item.tags.forEach(t => tags.add(t));
                });
                return Array.from(tags);
            }, [activeLevel]);

            const filtered = useMemo(() => {
                let result = MATERIALS_DATA;
                if (activeLevel !== 'home') result = result.filter(i => i.level === activeLevel);
                if (selectedTag === "최신") result = result.slice(0, 5);
                else if (selectedTag !== "전체") result = result.filter(i => i.tags && i.tags.includes(selectedTag));
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter(i =>
                        i.title.toLowerCase().includes(q) ||
                        (i.tags && i.tags.some(t => t.toLowerCase().includes(q)))
                    );
                }
                return result;
            }, [activeLevel, selectedTag, searchQuery]);

            useEffect(() => { setSelectedTag("전체"); setSearchQuery(""); }, [activeLevel]);

            const pageTitle    = LEVEL_TITLES[activeLevel === 'home' ? 'ALL' : activeLevel] || `Level ${activeLevel} 학습 자료`;
            const pageSubtitle = LEVEL_SUBTITLES[activeLevel === 'home' ? 'ALL' : activeLevel] || `Learning Content for ${activeLevel}`;
            const levelInfo    = LEVEL_DEFINITIONS[activeLevel === 'home' ? 'ALL' : activeLevel];
            const levelLabel   = activeLevel === 'home' ? 'ALL' : activeLevel;

            return (
                <main className="max-w-6xl mx-auto px-6 lg:px-8 pt-16 md:pt-24 pb-24 animate-fade-in">
                    {/* Hero */}
                    <div className="flex flex-col items-start mb-12 md:mb-16">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="flex items-center border border-gray-900 px-3 py-1 text-[10px] font-sans tracking-widest uppercase text-gray-900">
                                <span className="font-bold">{levelLabel}</span>
                                <span className="mx-2 w-px h-2.5 bg-gray-300"></span>
                                <span className="font-medium">{levelInfo ? levelInfo.title : 'All Levels'}</span>
                            </div>
                        </div>
                        <h1 className="font-serif text-3xl md:text-5xl lg:text-6xl text-black font-bold leading-tight mb-3 tracking-tight">
                            {pageTitle}
                        </h1>
                        <p className="font-serif text-gray-500 text-sm md:text-base italic">
                            {pageSubtitle}
                        </p>
                    </div>

                    {/* Search + Tags */}
                    <div className="flex flex-col gap-5 mb-10 md:mb-12">
                        <div className="relative w-full md:max-w-md">
                            <div className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                                <SearchIcon className="w-4 h-4" />
                            </div>
                            <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="제목 또는 태그로 검색..."
                                className="w-full pl-11 pr-10 py-3 bg-white border border-gray-200 text-sm font-sans text-gray-800 placeholder-gray-400 focus:outline-none focus:border-black transition-colors rounded-lg"
                            />
                            {searchQuery && (
                                <button
                                    onClick={() => setSearchQuery("")}
                                    className="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-black transition-colors"
                                >
                                    <XIcon className="w-4 h-4" />
                                </button>
                            )}
                        </div>

                        <div className="flex flex-wrap gap-2">
                            {allTags.map(tag => {
                                const isActive = selectedTag === tag;
                                return (
                                    <button
                                        key={tag}
                                        onClick={() => setSelectedTag(tag)}
                                        className={`px-3.5 py-1.5 text-xs font-sans font-bold tracking-widest uppercase rounded-sm transition-colors duration-200
                                            ${isActive
                                                ? 'bg-gray-900 text-white border border-gray-900'
                                                : 'bg-white text-gray-500 border border-gray-200 hover:border-gray-900 hover:text-gray-900'}`}
                                    >
                                        {tag}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Single-column Card list */}
                    <div className="flex flex-col gap-4">
                        {filtered.map((item, idx) => (
                            <MaterialCard
                                key={idx}
                                item={item}
                                selectedTag={selectedTag}
                                onSelectTag={(t) => setSelectedTag(t)}
                            />
                        ))}

                        {filtered.length === 0 && (
                            <div className="text-center py-16 text-gray-400 text-sm font-sans border border-dashed border-gray-200 rounded-xl">
                                해당 조건에 맞는 자료가 없습니다.
                            </div>
                        )}
                    </div>

                    <div className="mt-20 pt-8 pb-12 border-t border-gray-100 text-center text-xs font-sans text-gray-400 flex flex-col items-center gap-2">
                        <p>© 2025 - 2026 Sangbin Lee (OpenKoreanLearningLap). All rights reserved.</p>
                        <a href="https://www.italki.com/ko/teacher/3553151" target="_blank" rel="noopener noreferrer" className="hover:text-gray-800 transition-colors underline underline-offset-4">
                            Visit Sangbin's italki profile
                        </a>
                    </div>
                </main>
            );
        };

        // --- App ---
        const App = () => {
            const [activeLevel, setActiveLevel] = useState('home');
            useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [activeLevel]);
            return (
                <div className="min-h-screen bg-white">
                    <TopNav activeLevel={activeLevel} setActiveLevel={setActiveLevel} />
                    <HomeView activeLevel={activeLevel} setActiveLevel={setActiveLevel} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
