<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenKorean - 학습 자료 (Learning Content)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 폰트 링크 -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Sunflower:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* Root Font Size Setting using clamp and vw */
        html {
            font-size: clamp(12px, 1vw, 16px);
        }

        /* NoonnuBasicGothic (기본 글꼴) */
        @font-face {
            font-family: 'NoonnuBasicGothic';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noon-2410@1.0/NoonnuBasicGothicRegular.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }
        body { font-family: 'NoonnuBasicGothic', sans-serif; background-color: #f9fafb; color: #334155; }
        
        /* 폰트 유틸리티 클래스 */
        .font-basic { font-family: 'NoonnuBasicGothic', sans-serif; }
        .font-jua { font-family: 'Jua', sans-serif; }
        .font-noto { font-family: 'Noto Sans KR', sans-serif; }
        .font-sunflower { font-family: 'Sunflower', sans-serif; }
        
        /* Cafe24 폰트 시리즈 */
        @font-face { font-family: 'Cafe24SurroundAir'; src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff'); font-weight: normal; font-display: swap; }
        .font-cafe24 { font-family: 'Cafe24SurroundAir', sans-serif; }

        @font-face { font-family: 'Cafe24Surround'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff'); font-weight: normal; font-display: swap; }
        .font-cafe24-surround { font-family: 'Cafe24Surround', sans-serif; }

        @font-face { font-family: 'Cafe24Decoshadow'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2405-3@1.1/Cafe24Decoshadow.woff2') format('woff2'); font-weight: normal; font-display: swap; }
        .font-cafe24-deco { font-family: 'Cafe24Decoshadow', sans-serif; }

        @font-face { font-family: 'Cafe24Decoschool'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2405-3@1.1/Cafe24Decoschool.woff2') format('woff2'); font-weight: normal; font-display: swap; }
        .font-cafe24-school { font-family: 'Cafe24Decoschool', sans-serif; }

        @font-face { font-family: 'Cafe24Anemone'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/Cafe24Ohsquare.woff') format('woff'); font-weight: normal; font-display: swap; }
        .font-cafe24-anemone { font-family: 'Cafe24Anemone', sans-serif; }

        /* SchoolSafetyMustache (학교안심 콧수염) */
        @font-face {
            font-family: 'SchoolSafetyMustache';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@1.0/TTHakgyoansimKossuyeomR.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }
        .font-school-mustache { font-family: 'SchoolSafetyMustache', sans-serif; }

        /* SchoolSafetyOcarina (학교안심 오카리나) - 제목용 */
        @font-face {
            font-family: 'SchoolSafetyOcarina';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-1@1.0/HakgyoansimOcarinaR.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }
        .font-ocarina { font-family: 'SchoolSafetyOcarina', sans-serif; }

        @font-face { font-family: 'SchoolSafetyRoundedSmile'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-R.woff2') format('woff2'); font-weight: normal; font-display: swap; }
        @font-face { font-family: 'SchoolSafetyRoundedSmile'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        .font-school-smile { font-family: 'SchoolSafetyRoundedSmile', sans-serif; }

        @font-face { font-family: 'Juache'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff'); font-weight: normal; font-display: swap; }
        .font-juache { font-family: 'Juache', sans-serif; }

        /* 스크롤바 */
        ::-webkit-scrollbar { width: 0.375rem; height: 0.375rem; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 0.1875rem; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 애니메이션 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(0.625rem); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { createPortal } = ReactDOM;

        // --- Data: Level Definitions & Styles ---
        const LEVEL_DEFINITIONS = {
            "ALL": { title: "All Levels", desc: "All Learning Content" },
            "A1": { title: "Novice", desc: "Can use and understand very simple everyday expressions." },
            "A1+": { title: "Pre-Beginner", desc: "Still beginner, but can handle slightly more than A1." },
            "A2": { title: "Beginner", desc: "Can understand frequently used sentences (family, shopping, work)." },
            "A2+": { title: "Upper Beginner", desc: "Between A2 and B1. Can speak a bit more smoothly about daily life." },
            "B1": { title: "Pre-Intermediate", desc: "Can understand the main points of clear standard speech." },
            "B1+": { title: "Lower Intermediate", desc: "Stronger B1. More comfortable carrying conversations." },
            "B2": { title: "Intermediate", desc: "Can understand the main ideas of complex texts." },
            "B2+": { title: "Upper Intermediate", desc: "Near C1. Can argue a point logically." },
            "C1": { title: "Advanced", desc: "Can understand long, demanding texts and implied meanings." },
            "C1+": { title: "Upper Advanced", desc: "Very strong C1, approaching native-like flexibility." },
            "C2": { title: "Proficient", desc: "Can understand virtually everything heard or read." }
        };

        const getLevelTheme = (level) => {
            switch (level) {
                case 'ALL': return 'slate';
                case 'A1': case 'A1+': return 'lime';
                case 'A2': case 'A2+': return 'green';
                case 'B1': case 'B1+': return 'sky';
                case 'B2': case 'B2+': return 'blue';
                case 'C1': case 'C1+': case 'C2': return 'violet';
                default: return 'green';
            }
        };

        const LEVEL_STYLES = {
            "ALL": "bg-slate-50 text-black border-slate-200 shadow-sm",
            "A1": "bg-lime-50 text-lime-600 border-lime-100 shadow-sm", 
            "A1+": "bg-lime-50 text-lime-600 border-lime-100 shadow-sm", 
            "A2": "bg-green-50 text-green-600 border-green-100 shadow-sm",    
            "A2+": "bg-green-50 text-green-600 border-green-100 shadow-sm",    
            "B1": "bg-sky-50 text-sky-600 border-sky-100 shadow-sm",        
            "B1+": "bg-sky-50 text-sky-600 border-sky-100 shadow-sm",        
            "B2": "bg-blue-50 text-blue-600 border-blue-100 shadow-sm", 
            "B2+": "bg-blue-50 text-blue-600 border-blue-100 shadow-sm", 
            "C1": "bg-violet-50 text-violet-600 border-violet-100 shadow-sm", 
            "C1+": "bg-violet-50 text-violet-600 border-violet-100 shadow-sm", 
            "C2": "bg-violet-50 text-violet-600 border-violet-100 shadow-sm",        
        };

        // --- Icons ---
        const HomeIcon = ({ className }) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="3" width="20" height="14" rx="2" ry="2" /><path d="M8 21h8" /><path d="M12 17v4" /></svg>);
        const ChevronLeft = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6" /></svg>);
        const ChevronRight = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6" /></svg>);
        const SearchIcon = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>);
        const XIcon = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);

        // --- Component: Level Badge ---
        const LevelBadge = ({ levelCode }) => {
            const [isHovered, setIsHovered] = useState(false);
            const info = LEVEL_DEFINITIONS[levelCode] || LEVEL_DEFINITIONS["A2+"];
            
            const badgeStyle = LEVEL_STYLES[levelCode] || "bg-gray-50 text-slate-600 border-gray-100";

            return (
                <div 
                    className="relative inline-flex items-center cursor-help z-50 shrink-0"
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                >
                    <span className={`px-2 py-0.5 rounded text-[1.225rem] font-bold border uppercase tracking-wide font-basic ${badgeStyle}`}>
                        {levelCode}
                    </span>
                    {isHovered && (
                        <div className="absolute top-full left-0 mt-2 w-72 bg-slate-900/95 backdrop-blur text-white text-[1rem] rounded-xl p-4 shadow-xl z-[100] animate-fade-in text-left">
                            <p className={`font-bold mb-1.5 text-[1.1rem] ${badgeStyle.split(' ')[1]}`}>{levelCode} – {info.title}</p>
                            <p className="opacity-90 leading-relaxed font-medium">{info.desc}</p>
                            <div className="absolute -top-1 left-4 w-2 h-2 bg-slate-900/95 rotate-45"></div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Component: Category Badge ---
        const CategoryBadge = ({ tag, onClick, isSelected }) => {
            return (
                <span 
                    onClick={onClick}
                    className={`inline-flex items-center px-2 py-0.5 rounded text-[1.225rem] font-bold border uppercase tracking-wide shadow-sm font-basic cursor-pointer transition-colors shrink-0
                    ${isSelected 
                        ? 'bg-slate-800 text-white border-slate-800' 
                        : 'bg-white text-slate-500 border-slate-200 hover:border-slate-400 hover:text-slate-700'}`}
                >
                    {tag}
                </span>
            );
        };

        // --- Sidebar Component ---
        const Sidebar = ({ activeTab, setActiveTab, isCollapsed, toggleSidebar, userLevel, themeColor }) => {
            const menus = [
                { id: 'home', levelCode: 'ALL', label: '전체 학습 자료', subLabel: 'All Learning Content' },
                { id: 'B2', levelCode: 'B2', label: '중급 학습자', subLabel: 'Intermediate' },
                { id: 'B2+', levelCode: 'B2+', label: '중급(상) 학습자', subLabel: 'Upper Intermediate' },
                { id: 'C1', levelCode: 'C1', label: '고급 학습자', subLabel: 'Advanced' },
                { id: 'C1+', levelCode: 'C1+', label: '고급(상) 학습자', subLabel: 'Upper Advanced' },
                { id: 'C2', levelCode: 'C2', label: '최상급 학습자', subLabel: 'Proficient' },
            ];
            
            const [tooltip, setTooltip] = useState({ show: false, x: 0, y: 0, info: null });

            const handleLevelTextEnter = (e) => {
                const rect = e.target.getBoundingClientRect();
                setTooltip({
                    show: true,
                    x: rect.right, 
                    y: rect.top,
                    info: LEVEL_DEFINITIONS[userLevel]
                });
            };

            const handleLevelTextLeave = () => {
                setTooltip(prev => ({ ...prev, show: false }));
            };

            const sidebarWidth = isCollapsed ? 'w-[5.5rem]' : 'w-[18.4rem]';
            const logoSize = isCollapsed ? 'w-[3rem] h-[3rem]' : 'w-[4.31rem] h-[4.31rem]';

            const textTitle = isCollapsed ? 'text-[1.25rem]' : 'text-[1.44rem]';
            const textSubtitle = isCollapsed ? 'text-[0.6875rem]' : 'text-[0.79rem]';
            const textMenu = isCollapsed ? 'text-[1rem]' : 'text-[1.15rem]';
            const textMenuSub = isCollapsed ? 'text-[0.625rem]' : 'text-[0.72rem]';
            const boxSize = isCollapsed ? 'w-[2.5rem] h-[2.5rem]' : 'w-[2.875rem] h-[2.875rem]';
            const boxText = isCollapsed ? 'text-[0.75rem]' : 'text-[0.86rem]';
            const footerTextBig = isCollapsed ? 'text-[1rem]' : 'text-[1.15rem]';
            const footerTextLabel = isCollapsed ? 'text-[0.875rem]' : 'text-[1.0rem]';
            const footerTextSmall = isCollapsed ? 'text-[0.625rem]' : 'text-[0.72rem]';

            const currentStyle = LEVEL_STYLES[userLevel] ? LEVEL_STYLES[userLevel] : LEVEL_STYLES["ALL"];
            const bgClass = currentStyle.split(' ')[0];
            const textClass = currentStyle.split(' ')[1];

            return (
                <aside className={`bg-white border-r border-gray-200 fixed h-full hidden md:flex flex-col z-50 transition-all duration-300 ease-in-out font-cafe24-anemone ${sidebarWidth}`}>
                    <div className={`p-6 flex items-center gap-3 relative ${isCollapsed ? 'justify-center px-0' : ''}`}>
                        <img 
                            src="https://raw.githubusercontent.com/openkoreanlearninglab/hub/refs/heads/main/OpenKoreanLearningLab_Logo.jpeg" 
                            alt="Logo" 
                            className={`rounded-2xl shadow-lg shrink-0 transition-all duration-300 object-cover ${logoSize}`}
                        />
                        {!isCollapsed && (
                            <div className="animate-fade-in overflow-hidden whitespace-nowrap flex flex-col justify-center">
                                <span className={`font-extrabold leading-tight font-cafe24-deco ${textTitle} text-black`}>Open</span>
                                <span className={`leading-tight font-school-mustache ${textSubtitle} ${userLevel === 'ALL' ? 'text-black font-black' : `text-${themeColor}-600 font-bold`}`}>KoreanLearningLab</span>
                            </div>
                        )}
                        <button 
                            onClick={toggleSidebar}
                            className="absolute -right-3 top-1/2 -translate-y-1/2 bg-white border border-gray-200 rounded-full p-1 shadow-sm text-slate-500 hover:text-slate-700 hover:bg-gray-50 transition-colors z-10"
                        >
                            {isCollapsed ? <ChevronRight className="w-3 h-3" /> : <ChevronLeft className="w-3 h-3" />}
                        </button>
                    </div>
                    
                    <nav className={`flex-1 space-y-3 mt-4 ${isCollapsed ? 'px-3' : 'px-3'}`}>
                        {menus.map((menu) => {
                            const isActive = activeTab === menu.id;
                            const activeFontClass = isActive ? "font-cafe24-surround" : "font-cafe24";
                            
                            const itemTheme = getLevelTheme(menu.levelCode);
                            const levelStyleStr = LEVEL_STYLES[menu.levelCode];
                            const parts = levelStyleStr.split(' ');
                            const boxBg = parts[0];
                            const boxBorder = parts[2];
                            const boxTextClass = menu.levelCode === 'ALL' ? 'text-black' : parts[1];

                            let buttonBgClass = '';
                            let buttonTextClass = '';
                            let indicatorBgClass = '';
                            
                            if (isActive) {
                                if (menu.id === 'home') {
                                    buttonBgClass = 'bg-slate-50';
                                    buttonTextClass = 'text-black';
                                    indicatorBgClass = 'bg-black';
                                } else {
                                    buttonBgClass = `bg-${itemTheme}-50`;
                                    buttonTextClass = `text-${itemTheme}-600`;
                                    indicatorBgClass = `bg-${itemTheme}-500`;
                                }
                            } else {
                                buttonTextClass = 'text-slate-700 hover:bg-gray-50 hover:text-slate-900';
                            }

                            return (
                                <button
                                    key={menu.id}
                                    onClick={() => {
                                        setActiveTab(menu.id);
                                        if (isCollapsed) toggleSidebar();
                                    }}
                                    onDoubleClick={toggleSidebar}
                                    className={`w-full flex items-center transition-all duration-200 group relative ${
                                        isCollapsed 
                                        ? 'justify-center h-14 rounded-2xl' 
                                        : 'gap-3 px-3 py-4 rounded-2xl'
                                    } ${isActive ? buttonBgClass : ''} ${buttonTextClass}`}
                                >
                                    {isActive && isCollapsed && (
                                        <div className={`absolute left-0 top-1/2 -translate-y-1/2 w-1.5 h-8 ${indicatorBgClass} rounded-r-lg`}></div>
                                    )}
                                    {isActive && !isCollapsed && (
                                        <div className={`absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 ${indicatorBgClass} rounded-r-lg`}></div>
                                    )}
                                    
                                    <div className={`${boxSize} rounded-xl flex items-center justify-center border shrink-0 transition-transform duration-200 group-hover:scale-105 ${boxBg} ${boxBorder}`}>
                                        <span className={`font-extrabold font-school-smile ${boxText} ${boxTextClass}`}>
                                            {menu.levelCode}
                                        </span>
                                    </div>
                                    
                                    {!isCollapsed && (
                                        <div className="flex flex-col items-start animate-fade-in overflow-hidden whitespace-nowrap">
                                            <span className={`leading-tight transition-all ${textMenu} ${activeFontClass} ${
                                                isActive 
                                                ? `font-extrabold ${buttonTextClass}` 
                                                : 'font-medium text-slate-700 group-hover:font-semibold group-hover:text-slate-900'
                                            }`}>{menu.label}</span>
                                            
                                            {menu.subLabel && <span className={`${textMenuSub} font-cafe24 font-normal text-slate-400 mt-0.5 leading-tight`}>{menu.subLabel}</span>}
                                        </div>
                                    )}
                                    
                                    {isCollapsed && (
                                        <div className="absolute left-full ml-3 px-3 py-1.5 bg-slate-900 text-white rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50 shadow-xl flex flex-col items-start">
                                            <span className="text-xs font-bold">{menu.label}</span>
                                            {menu.subLabel && <span className="text-[10px] opacity-80">{menu.subLabel}</span>}
                                            <div className="absolute top-1/2 -left-1 -translate-y-1/2 w-2 h-2 bg-slate-900 rotate-45"></div>
                                        </div>
                                    )}
                                </button>
                            );
                        })}
                    </nav>

                    <div className="p-2 border-t border-gray-100">
                        <div className={`flex items-center gap-3 p-2 rounded-xl transition-colors hover:bg-gray-50 cursor-pointer ${isCollapsed ? 'justify-center' : ''}`}>
                            <div className={`w-[2.75rem] h-[2.75rem] rounded-xl flex items-center justify-center shrink-0 transition-colors duration-300 ${bgClass} border ${currentStyle.split(' ')[2]}`}>
                                <span className={`${footerTextBig} font-extrabold font-school-smile ${userLevel === 'ALL' ? 'text-black' : currentStyle.replace('bg-', 'text-').replace('50', '600')}`}>{userLevel}</span>
                            </div>
                            {!isCollapsed && (
                                <div className="animate-fade-in overflow-hidden whitespace-nowrap flex-1">
                                    <p className={`${footerTextLabel} font-bold text-slate-900 mb-[1px] font-cafe24-anemone`}>학습자(Learner)</p>
                                    <div className="mt-[1px]">
                                        <span 
                                            className={`block w-fit px-[3px] py-0.5 rounded ${footerTextSmall} font-semibold border uppercase tracking-wide shadow-sm text-left cursor-help font-cafe24-anemone ${currentStyle}`}
                                            onMouseEnter={handleLevelTextEnter}
                                            onMouseLeave={handleLevelTextLeave}
                                        >
                                            Level: {LEVEL_DEFINITIONS[userLevel].title}
                                        </span>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {tooltip.show && tooltip.info && createPortal(
                        <div 
                            className="fixed z-[9999] pointer-events-none animate-fade-in"
                            style={{ left: tooltip.x, top: tooltip.y }}
                        >
                            <div className="relative bg-slate-900/95 backdrop-blur text-white text-[0.875rem] rounded-xl p-4 shadow-2xl transform -translate-y-full -translate-x-6 -mt-3 w-64 border border-slate-700/50">
                                <p className={`font-bold mb-1.5 text-[1rem] text-${themeColor}-300`}>
                                    {userLevel} – {tooltip.info.title}
                                </p>
                                <p className="opacity-90 leading-relaxed font-medium text-slate-200">
                                    {tooltip.info.desc}
                                </p>
                                <div className="absolute -bottom-1.5 left-4 w-3 h-3 bg-slate-900/95 border-r border-b border-slate-700/50 rotate-45"></div>
                            </div>
                        </div>,
                        document.body
                    )}
                </aside>
            );
        };

        // --- View Components ---

        const HomeView = ({ setActiveTab, themeColor, currentLevel }) => {
            const [selectedTag, setSelectedTag] = useState("전체");
            const [searchQuery, setSearchQuery] = useState("");
            const [latestTooltip, setLatestTooltip] = useState({ show: false, x: 0, y: 0 });

            const LEVEL_TITLES = {
                "B2": "중급 수준 학습 자료", "B2+": "중급(상) 수준 학습 자료",
                "C1": "고급 수준 학습 자료", "C1+": "고급(상) 수준 학습 자료", "C2": "최상급 수준 학습 자료"
            };

            const LEVEL_SUBTITLES = {
            "B2": "Intermediate Level Learning Content", "B2+": "Upper Intermediate Level Learning Content",
            "C1": "Advanced Level Learning Content", "C1+": "Upper Advanced Level Learning Content", "C2": "Proficient Level Learning Content"
        };

        const MATERIALS_DATA = [
            { level: "C2", tags: ["경제", "정치"], title: "코스피 5000 시대, 앞으로 어떤 길을 가야 하는가?", link: "c2-kospi-5000-era.html" },

                { level: "C2", tags: ["언어", "철학"], title: "지루함이란 무엇일까?", link: "https://drive.google.com/open?id=1c8xO_94F86boeEHFUJmbvJLxymwP8deg-ghScXvlB9w&usp=drive_copy" },
                { level: "C2", tags: ["역사"], title: "백 투 더 퓨쳐 : 정말로 새로운 시대인가?", link: "https://drive.google.com/open?id=1yc75Dq5CynluVaOpiQiQo6eL0NQuOpMFTObmt0sqNu8&usp=drive_copy" },

                { level: "C2", tags: ["인문"], title: "무소유(無所有, simatiga) - 법정(法頂) 스님", link: "https://drive.google.com/open?id=1h39ygnoizqxMdWRdxVIhWhGz19S1Vuyj4FqMHeqAYrc&usp=drive_copy" },
                { level: "C2", tags: ["인문", "철학"], title: "자유의지와 결정론에 대한 고찰", link: "https://drive.google.com/open?id=1Ki-fa1K9ffu27j1A8MCUDp7ky-B0QKNVe3frAxjwDIc&usp=drive_copy" },
                { level: "C2", tags: ["인문학", "철학"], title: "흔들리지 않는 마음 - 아파테이아(apatheia) & 부동심(不動心)", link: "https://drive.google.com/open?id=1QPxvpNit8hpzojZe4OX2CitJHj3QLj15DyS9coA2KAg&usp=drive_copy" },
                { level: "C2", tags: ["정치"], title: "\"소수집단 우대 정책\"은 폐지되어야 할까요? 유지되어야 할까요?", link: "https://drive.google.com/open?id=1siLQ6k4sX6chTANTjRO7NM2TUHMBzMYa1v8HtJ0Bj0A&usp=drive_copy" },
                { level: "C2", tags: ["정치"], title: "한국 정당의 후보 공천에서 나타나는 문제점", link: "https://drive.google.com/open?id=1rhYprUabOdjILDAaiPNqjgsdiCmZ70er5e-HWLoKsuM&usp=drive_copy" },
                { level: "C2", tags: ["정치"], title: "Z세대 남자들: 그들은 왜 자신들이 차별 받고 있다고 생각할까요?", link: "https://drive.google.com/open?id=1b9QM5A-L1zFfUgk--7BwQ9pMW0Y63uHyQZkBH_JKR_M&usp=drive_copy" },
                { level: "C2", tags: ["정치", "법"], title: "한국에서 낙태죄 불법인가? 합법인가? - 2019년 낙태죄 헌법불합치 판결 이후", link: "https://drive.google.com/open?id=1dEXiWPpuLnoZQ_8PuMW1mKi5vbXj7QYJWdBMR_iXMnw&usp=drive_copy" },
                { level: "C2", tags: ["정치", "사회"], title: "북한 이탈 주민의 정체성", link: "https://drive.google.com/open?id=1PN6lqGr2G9dFeAtGi85WwBGfIW9Uk8Q1h8Mr-u-5HpQ&usp=drive_copy" },
                { level: "C2", tags: ["정치", "철학"], title: "민족주의는 무엇일까요?", link: "https://drive.google.com/open?id=1faF0N-kEg0tycSdT3dcYnnRRXQPyVPGKErx-bpxe1Kw&usp=drive_copy" },
                { level: "C2", tags: ["철학"], title: "<피로사회> - 면역학에서 신경증으로 패러다임의 전환", link: "https://drive.google.com/open?id=1IxMLe0W0yznTTWoReid6zTaygi7j0BOhKX3xmaB1C5w&usp=drive_copy" },
                { level: "C2", tags: ["철학"], title: "맹자 - 마음(心) : 도덕적 자유의 의지", link: "https://drive.google.com/open?id=1VWGo8V-vtHLIaEkQOyppI70En2BUUJAYGVkF2pQa6G8&usp=drive_copy" },
                { level: "C2", tags: ["철학"], title: "맹자와 아리스토텔레스 비교 - 맹자의 덕과 덕 윤리학", link: "https://drive.google.com/open?id=1DQ3O7Uho0EtkeVNAVanMtCZJekUgZk0AA0L8SsEqQpo&usp=drive_copy" },
                { level: "C2", tags: ["철학"], title: "부끄러움에 대한 이해: 수치심과 염치는 어떻게 다를까요?", link: "https://drive.google.com/open?id=1w_E0MVH7c350N6O9c_0BHsNwGkLwirv6K7WDfSHeJr4&usp=drive_copy" },
                { level: "C2", tags: ["철학"], title: "사단칠정 논쟁- 인간의 본성은 선한가 악한가?", link: "https://drive.google.com/open?id=1dezqn5JOsSKpIz9_YDlp_fOJmwRXxj-oUbShTjMYN7w&usp=drive_copy" },
                { level: "C2", tags: ["철학"], title: "오직 이성만으로 도덕적 선과 악을 구별할 수 있을까? - 데이비드 흄(David Hume )", link: "https://drive.google.com/open?id=1ZnCen6dN88cDMjEK0yad34M1-NxG2HyH6ahpBgrW5OE&usp=drive_copy" },
                { level: "C2", tags: ["철학"], title: "존 스튜어트 밀 «자유론»", link: "https://drive.google.com/open?id=1HK0MK3RLgUghzKaRymbTXcJajK0QBxF0VeNFI-04enU&usp=drive_copy" },
                { level: "C2", tags: ["철학"], title: "타인의 도덕적 잘못을 심판해야 할까요?", link: "https://drive.google.com/open?id=1ZVK1QITTWTudvDwC3dm8-yWIW8-kiatisQJFHzr4vis&usp=drive_copy" },
                { level: "C2", tags: ["철학", "과학"], title: "📚 단 한 번의 앎혁명", link: "https://drive.google.com/open?id=1ISxowjHOeoDNEKiBqMK8gWdr7R92KjSZn3OY9FswpWo&usp=drive_copy" },
                { level: "C2", tags: ["철학", "과학"], title: "과학과 철학 그리고 언어 - 철학으로 보는 과학", link: "https://drive.google.com/open?id=1NDDNBUuj2RRPPBOrwpSV3gWTRrbMG5QhHyxTSv_ENKQ&usp=drive_copy" },
                { level: "C2", tags: ["철학", "과학"], title: "시간에 대한 태도와 무시제적 시간 이론", link: "https://drive.google.com/open?id=1yX5y4-ugi7mewufTKc8LRIRDaBcVgq6UybVSBe_XzsE&usp=drive_copy" },
                { level: "C2", tags: ["철학", "교육"], title: "<메논>과 <무지한 스승>을 통해 알아보는 배움의 정의: 설명 없이 배울 수 있을까?", link: "https://drive.google.com/open?id=1ZKkboh1LzYDRC3HW1--1zcfWmpcTEVQ8RmCjURXuIXM&usp=drive_copy" },
                { level: "C2", tags: ["철학", "언어"], title: "말할 수 없는 것은 침묵해야 한다 : 언어와 삶", link: "https://drive.google.com/open?id=14rzpxQAEauYPqTUUD91io6gqhxgMpYedlrdBcD7xJx0&usp=drive_copy" },
                { level: "C2", tags: ["철학", "언어"], title: "표상과 현상은 무엇일까요?", link: "https://drive.google.com/open?id=1e2mKtmrd3gN2EIVVQ4oWjC3c4PHYJHZqyY5DAHKkAOU&usp=drive_copy" },
                { level: "C2", tags: ["철학", "언어", "역사"], title: "<역사를 읽는 방법> - 1장 서론：그들의 방식으로 바라보기", link: "https://drive.google.com/open?id=1bWysDNo3szA9MIWAv0Ud-oPGGG3ovkop6YMa4pnTLLU&usp=drive_copy" }
            ];

            const allTags = useMemo(() => {
                const tags = new Set(["전체", "최신"]);
                MATERIALS_DATA.forEach(item => {
                    if (currentLevel !== 'home' && item.level !== currentLevel) return;
                    if (item.tags) item.tags.forEach(t => tags.add(t));
                });
                return Array.from(tags);
            }, [currentLevel]);

            // Filter logic
            const filteredMaterials = useMemo(() => {
                let result = MATERIALS_DATA;
                // Level filter
                if (currentLevel !== 'home') result = result.filter(item => item.level === currentLevel);
                // Tag filter
                if (selectedTag === "최신") {
                    result = result.slice(0, 5);
                } else if (selectedTag !== "전체") {
                    result = result.filter(item => item.tags && item.tags.includes(selectedTag));
                }
                // Search filter
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter(item => item.title.toLowerCase().includes(q) || (item.tags && item.tags.some(t => t.toLowerCase().includes(q))));
                }
                return result;
            }, [selectedTag, currentLevel, searchQuery]);

            useEffect(() => { setSelectedTag("전체"); setSearchQuery(""); }, [currentLevel]);

            const pageTitle = currentLevel === 'home' ? '전체 학습 자료' : (LEVEL_TITLES[currentLevel] || `Level ${currentLevel} 학습 자료`);
            const pageSubtitle = currentLevel === 'home' ? 'All Learning Content' : (LEVEL_SUBTITLES[currentLevel] || `Learning Content for ${currentLevel}`);
            const getPageBadgeText = (level) => (level === 'home' || level === 'ALL') ? 'All Levels' : `Level ${level}`;

            return (
                <div className="space-y-12 animate-fade-in max-w-7xl mx-auto pt-8">
                    <div className="space-y-4 text-center md:text-left">
                        <div className="flex items-center gap-2 justify-center md:justify-start">
                            <span className={`px-3 py-1 bg-white border border-slate-200 text-[1.05rem] rounded-lg tracking-wider shadow-sm font-juache text-slate-950 ${currentLevel === 'home' || currentLevel === 'ALL' ? 'font-black' : ''}`}>{getPageBadgeText(currentLevel)}</span>
                        </div>
                        <h1 className="text-[3.15rem] leading-tight font-black text-slate-900 tracking-tight font-cafe24-surround">{pageTitle}</h1>
                        <p className="text-slate-500 text-[1.575rem] font-cafe24-surround">{pageSubtitle}</p>
                    </div>

                    <div className="relative w-full md:w-[30rem]">
                        <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><SearchIcon className="w-5 h-5" /></div>
                        <input type="text" placeholder="제목 또는 태그로 검색..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className={`w-full pl-12 pr-12 py-3.5 rounded-2xl border border-slate-200 bg-white text-slate-800 text-[1.1rem] placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-${themeColor}-500 focus:border-transparent transition-all shadow-sm font-basic`} />
                        {searchQuery && (<button onClick={() => setSearchQuery("")} className="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors"><XIcon className="w-5 h-5" /></button>)}
                    </div>

                    <div className="flex flex-wrap gap-3 justify-center md:justify-start">
                        {allTags.map(tag => (
                            <button key={tag} onClick={() => setSelectedTag(tag)}
                                onMouseEnter={(e) => { if (tag === '최신') { const rect = e.target.getBoundingClientRect(); setLatestTooltip({ show: true, x: rect.left + rect.width / 2, y: rect.bottom + 10 }); } }}
                                onMouseLeave={() => { if (tag === '최신') setLatestTooltip(prev => ({ ...prev, show: false })); }}
                                className={`px-6 py-3 rounded-2xl text-[1.4rem] font-bold transition-all duration-200 ${selectedTag === tag ? `bg-slate-900 text-white shadow-md transform scale-105 font-cafe24-surround` : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50 hover:text-slate-800 font-cafe24'}`}
                            >{tag}</button>
                        ))}
                    </div>

                    {latestTooltip.show && createPortal(
                        <div className="fixed z-[100] pointer-events-none animate-fade-in" style={{ left: latestTooltip.x, top: latestTooltip.y }}>
                            <div className="relative bg-slate-900/95 backdrop-blur text-white text-[0.9rem] rounded-xl px-4 py-2.5 shadow-xl transform -translate-x-1/2 border border-slate-700/50 font-medium whitespace-nowrap">최근에 업데이트된 학습자료 5개<div className="absolute -top-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-slate-900/95 border-t border-l border-slate-700/50 rotate-45"></div></div>
                        </div>, document.body
                    )}

                    <div className="grid grid-cols-1 gap-6">
                        {filteredMaterials.map((item, index) => {
                            let hoverColorClass = '';
                            if (['C1', 'C1+', 'C2'].includes(item.level)) { hoverColorClass = 'group-hover:text-violet-600'; } 
                            else if (['B2', 'B2+'].includes(item.level)) { hoverColorClass = 'group-hover:text-blue-600'; } 
                            else { const itemTheme = getLevelTheme(item.level); hoverColorClass = itemTheme === 'slate' ? 'group-hover:text-black' : `group-hover:text-${itemTheme}-600`; }

                            return (
                                <a key={index} href={item.link} className="group block bg-white rounded-3xl border border-gray-100 p-7 shadow-sm hover:shadow-lg transition-all duration-300 hover:-translate-y-1">
                                    <div className="flex flex-col md:flex-row md:items-center gap-6">
                                        <div className="flex flex-wrap items-center gap-3">
                                            <LevelBadge levelCode={item.level} />
                                            {item.tags && item.tags.map(tag => (
                                                <CategoryBadge key={tag} tag={tag} onClick={(e) => { e.preventDefault(); setSelectedTag(tag); }} isSelected={selectedTag === tag} />
                                            ))}
                                        </div>
                                        <h3 className={`text-[1.75rem] font-bold text-slate-800 transition-colors font-ocarina leading-tight flex-1 group-hover:font-black ${hoverColorClass}`}>{item.title}</h3>
                                        <div className={`ml-auto opacity-0 group-hover:opacity-100 transition-opacity hidden md:block ${hoverColorClass}`}><span className="text-[2rem]">→</span></div>
                                    </div>
                                </a>
                            );
                        })}
                    </div>
                    {filteredMaterials.length === 0 && (<div className="text-center py-12 text-slate-400 text-[1.4rem] font-cafe24-anemone bg-white rounded-3xl border border-dashed border-gray-200">해당 레벨/카테고리에 자료가 없습니다.</div>)}
                    <div className="text-center text-slate-400 text-[1.05rem] mt-16 font-cafe24-anemone"><p>© Open Korean Learning Lab. All rights reserved.</p></div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
            const userLevel = activeTab === 'home' ? 'ALL' : activeTab;
            const themeColor = useMemo(() => getLevelTheme(userLevel), [userLevel]);

            useEffect(() => {
                const handleResize = () => setIsSidebarCollapsed(window.innerWidth < 1024);
                window.addEventListener('resize', handleResize); handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return (
                <div className="flex min-h-screen bg-[#f9fafb]">
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} isCollapsed={isSidebarCollapsed} toggleSidebar={() => setIsSidebarCollapsed(!isSidebarCollapsed)} userLevel={userLevel} themeColor={themeColor} />
                    <div className={`flex-1 flex flex-col transition-all duration-300 ease-in-out ${isSidebarCollapsed ? 'md:ml-[5.5rem]' : 'md:ml-[18.4rem]'}`}>
                        <main className="flex-1 p-[1.25rem] overflow-y-auto flex flex-col"><HomeView setActiveTab={setActiveTab} themeColor={themeColor} currentLevel={activeTab} /></main>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
