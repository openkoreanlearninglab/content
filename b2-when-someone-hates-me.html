            { id: 's14', speaker: '김규남 (30대)', kor: '그치? 내가 신경 쓰이면 전화라도 한번 해 보는 게 낫겠지?', time: [47.0, 50.41], eng: "Right? If I'm bothered, it'd be better to just call once, right?" },

            { id: 's40', speaker: '김규남 (20대)', kor: '잘 모르겠습니다 선배님...', time: [120.3, 122.99], eng: "I'm not sure, sunbae-nim..." },
            { id: 's41', speaker: '대학교 선배 (20대)', kor: '몰라? 너 어제 9시 수업 갈 때 엘리베이터 탔지?', time: [123.08, 129.05], eng: "You don't know? You took the elevator yesterday when you went to your 9 AM class, right?" },

            { id: 's49', speaker: '대학교 선배 (20대)', kor: '아니, 너는 못 봤는데 내가 봤다고 거짓말하고 있다는 거네?', time: [145.1, 148.6], eng: "No, you didn't see me, but I'm lying that I did?" },

            { id: 's65', speaker: '직장 상사 (30대)', kor: '그래 누가! 누가 업무 지시를 그렇게... 하라고 했다고 그래?', time: [200.075, 203.7], eng: "Yes, who! Who said to... give work instructions like that?" },

        const callGeminiWithBackoff = async (prompt, maxRetries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            const apiKey = ""; // API Key is injected by the environment
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        if (response.status === 401 || response.status === 403 || response.status === 400) {
                             throw new Error(`API Auth/Request Error (${response.status}): ${errorText}`);
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    return data.candidates[0].content.parts[0].text;
                } catch (error) {
                    if (error.message.includes("API Auth/Request Error") || i === maxRetries) {
                        throw error;
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        const LearnView = ({ updateProgress }) => {

            const [layoutMode, setLayoutMode] = useState('split');
            const [autoScroll, setAutoScroll] = useState(true);
            const [showVocab, setShowVocab] = useState(false);
            const [playbackRate, setPlaybackRate] = useState(1.0);

            useEffect(() => {

                            events: {
                                'onReady': (event) => { playerRef.current = event.target; setVideoState(prev => ({ ...prev, player: event.target, duration: event.target.getDuration() })); setIsLoading(false); },
                                'onStateChange': (event) => { if (event.data === window.YT.PlayerState.PLAYING) { startInterval(); updateProgress('learn'); setVideoState(prev => ({ ...prev, isPlaying: true })); } else { stopInterval(); if (event.data === window.YT.PlayerState.PAUSED || event.data === window.YT.PlayerState.ENDED) { setVideoState(prev => ({ ...prev, isPlaying: false })); } } }
                            }
                        });
                    }
                };
                if (!window.YT) { const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; const firstScriptTag = document.getElementsByTagName('script')[0]; firstScriptTag.parentNode.insertBefore(tag, firstScriptTag); window.onYouTubeIframeAPIReady = loadVideo; } else { loadVideo(); }
                return () => stopInterval();
            }, []);

            useEffect(() => { if (videoState.player && videoState.player.setPlaybackRate) videoState.player.setPlaybackRate(playbackRate); }, [playbackRate, videoState.player]);

            const handleGlobalClick = useCallback(() => { if (popup.fixed) setPopup(prev => ({ ...prev, show: false, fixed: false })); }, [popup.fixed]);
            useEffect(() => { if (popup.fixed) window.addEventListener('click', handleGlobalClick); return () => window.removeEventListener('click', handleGlobalClick); }, [popup.fixed, handleGlobalClick]);

            useEffect(() => {
                const handleKeyPress = (e) => {
                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                    if (e.code === 'Space') { e.preventDefault(); const player = videoState.player; if (player && typeof player.getPlayerState === 'function') { if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); } }
                    if (e.code === 'ArrowLeft') { e.preventDefault(); const currentIndex = VIDEO_SCRIPT_DATA.findIndex(line => line.id === activeLine); if (currentIndex > 0) handleLineClick(VIDEO_SCRIPT_DATA[currentIndex - 1].time[0]); }
                    if (e.code === 'ArrowRight') { e.preventDefault(); const currentIndex = VIDEO_SCRIPT_DATA.findIndex(line => line.id === activeLine); if (currentIndex !== -1 && currentIndex < VIDEO_SCRIPT_DATA.length - 1) handleLineClick(VIDEO_SCRIPT_DATA[currentIndex + 1].time[0]); else if (currentIndex === -1 && VIDEO_SCRIPT_DATA.length > 0) handleLineClick(VIDEO_SCRIPT_DATA[0].time[0]); }
                };
                window.addEventListener('keydown', handleKeyPress); return () => window.removeEventListener('keydown', handleKeyPress);
            }, [videoState.player, activeLine]);

            const startInterval = () => { 
                stopInterval(); 
                intervalRef.current = setInterval(() => {
                    const p = playerRef.current;

                        const time = p.getCurrentTime(); 
                        setVideoState(prev => ({ ...prev, currentTime: time })); 
                        const currentLine = VIDEO_SCRIPT_DATA.find(line => time >= line.time[0] && time < line.time[1]); 
                        if (currentLine) setActiveLine(currentLine.id);

            const stopInterval = () => { 
                if (intervalRef.current) { 
                    clearInterval(intervalRef.current); 
                    intervalRef.current = null;

            useEffect(() => { 
                if (popup.show) return; 
                if (activeLine && autoScroll && scriptRefs.current[activeLine]) {
                    scriptRefs.current[activeLine].scrollIntoView({ behavior: 'smooth', block: 'center' });

            }, [activeLine, autoScroll, popup.show, layoutMode]);

            const handleLineClick = (time) => { const player = videoState.player; if (player) { player.seekTo(time, true); player.playVideo(); } };
            const toggleTranslation = (id) => setTranslations(prev => ({...prev, [id]: !prev[id]}));
            const scrollToVocab = (term) => { const element = sidebarVocabRefs.current[term]; if (element) element.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
            
            const handleVocabEnter = (e, wordData) => { if (popup.fixed) return; const rect = e.target.getBoundingClientRect(); setPopup({ show: true, fixed: false, data: wordData, x: rect.left + rect.width / 2, y: rect.bottom }); if (showVocab) { setActiveVocabTerm(wordData.term); scrollToVocab(wordData.term); } };
            const handleVocabLeave = () => { if (popup.fixed) return; setPopup(prev => ({ ...prev, show: false })); };
            const handleVocabClick = (e, wordData) => { e.stopPropagation(); if (popup.fixed && popup.data && popup.data.term === wordData.term) { setPopup(prev => ({ ...prev, show: false, fixed: false })); return; } const rect = e.target.getBoundingClientRect(); setPopup({ show: true, fixed: true, data: wordData, x: rect.left + rect.width / 2, y: rect.bottom }); if (showVocab) { setActiveVocabTerm(wordData.term); scrollToVocab(wordData.term); } };

            const handleSeek = (e) => { const time = parseFloat(e.target.value); if (videoState.player) videoState.player.seekTo(time, true); setVideoState(prev => ({ ...prev, currentTime: time })); };

            const rewind2 = () => { const player = videoState.player; if (player) { const newTime = Math.max(0, videoState.currentTime - 1.5); player.seekTo(newTime, true); setVideoState(prev => ({ ...prev, currentTime: newTime })); } };
            const forward2 = () => { const player = videoState.player; if (player) { const newTime = Math.min(videoState.duration, videoState.currentTime + 1.5); player.seekTo(newTime, true); setVideoState(prev => ({ ...prev, currentTime: newTime })); } };
            const formatTime = (seconds) => { if (isNaN(seconds)) return "00:00"; const date = new Date(seconds * 1000); const mm = date.getUTCMinutes(); const ss = date.getUTCSeconds(); return `${mm.toString().padStart(2, '0')}:${ss.toString().padStart(2, '0')}`; };

            const allVocabTerms = useMemo(() => { return VOCAB_DATA.flatMap(vocab => { const terms = [vocab.term]; if (vocab.variants) terms.push(...vocab.variants); if (vocab.subDefs) terms.push(...vocab.subDefs.map(s => s.subTerm)); return [...new Set(terms)].filter(t => t).map(term => ({ term, vocab })); }).sort((a, b) => b.term.length - a.term.length); }, []);

            const renderTextWithVocab = (text) => {
                if (!text) return [""];
                const matches = [];
                allVocabTerms.forEach(({ term, vocab }) => { let index = 0; while ((index = text.indexOf(term, index)) !== -1) { const end = index + term.length; const overlaps = matches.some(m => (index >= m.start && index < m.end) || (end > m.start && end <= m.end) || (index <= m.start && end >= m.end)); if (!overlaps) matches.push({ start: index, end, term, vocab }); index += 1; } });
                matches.sort((a, b) => a.start - b.start);
                const result = []; let lastIndex = 0;
                matches.forEach((match, idx) => { if (match.start > lastIndex) result.push(text.substring(lastIndex, match.start)); const isActive = (popup.show && popup.data && popup.data.term === match.vocab.term) || (showVocab && activeVocabTerm === match.vocab.term); 
                result.push(<span key={`${match.term}-${idx}`} className={`cursor-pointer border-b border-dotted transition-all duration-200 font-medium inline-block leading-tight ${isActive ? 'border-black bg-white text-black border-solid' : 'border-gray-400 text-gray-800 hover:border-black hover:text-black'}`} onMouseEnter={(e) => handleVocabEnter(e, match.vocab)} onMouseLeave={handleVocabLeave} onClick={(e) => handleVocabClick(e, match.vocab)}>{match.term}</span>); lastIndex = match.end; });
                if (lastIndex < text.length) result.push(text.substring(lastIndex));
                return result;

                                        <div className="absolute left-0 top-1/2 -translate-y-1/2 h-[2px] bg-black" style={{ width: `${(videoState.currentTime/videoState.duration)*100}%` }}></div>
                                    </div>

    {
      "original": "학습자가 쓴 원래 문장",
      "corrected": "자연스럽게 교정된 문장",
      "explanation": "수정한 이유, 문법적 설명, 그리고 도움이 신는 간단한 예시 (한국어)",
      "explanationEng": "Explanation translated in English"
    }
  ]
}
`;
                try {
                    const resultText = await callGeminiWithBackoff(prompt);
                    const cleanedText = resultText.replace(/^```json/m, '').replace(/```$/m, '').trim();
                    const parsedData = JSON.parse(cleanedText);
                    setFeedbackData(parsedData);
                } catch (error) {
                    console.error(error);
                    setErrorMsg('피드백을 가져오는 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
                    if (error.message.includes('401') || error.message.includes('403')) {
                        setErrorMsg('API 인증 오류(HTTP 401/403)입니다. 유효한 API 키가 필요합니다.');
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="mb-16 group print:mb-8">
                    <div className="flex items-center gap-4 mb-6 print:mb-2">
                        <span className="text-4xl font-serif font-bold text-gray-200 group-hover:text-gray-900 transition-colors duration-300 print:text-[14px] print:text-gray-900">{item.id < 10 ? '0' + item.id : item.id}</span>
                        <h3 className="text-xl font-serif font-bold text-gray-900 leading-normal print:text-[12px]">{item.questionKor}</h3>
                    </div>
                    <div className="pl-0 md:pl-14 print:pl-6">
                        <div className="flex gap-2 mb-4 print:hidden"><TranslateButton onClick={() => setShowTranslation(!showTranslation)} isShowing={showTranslation} />{showTranslation && (<p className="text-sm font-sans text-gray-500 animate-fade-in">{item.questionEng}</p>)}</div>
                        
                        {item.vocab && item.vocab.length > 0 && (
                            <div className="bg-gray-50 p-5 mb-6 border-l-2 border-black print:bg-white print:p-2 print:mb-2 print:border-l-gray-300">
                                <span className="text-xs font-bold font-sans text-gray-400 uppercase mb-2 block print:text-[10px] print:mb-1">핵심 어휘</span>
                                <div className="space-y-3 print:space-y-1">
                                    {item.vocab.map((v, i) => (
                                        <div key={i} className="flex flex-col">
                                            <p className="text-sm font-serif text-gray-700 print:text-[10px]"><span className="font-bold text-black mr-2 print:text-[10px]">{v.term}</span>{v.def}</p>
                                            {/* 화면 번역 (인쇄 시 숨김) */}
                                            {showTranslation && v.termEng && v.defEng && (
                                                <p className="text-[13px] font-sans text-gray-500 mt-1.5 pt-1.5 border-t border-gray-200 border-dashed animate-fade-in print:hidden"><span className="font-bold mr-2">{v.termEng}</span>{v.defEng}</p>
                                            )}
                                            {/* 인쇄용 번역 (항상 보임) */}
                                            {v.termEng && v.defEng && (
                                                <p className="hidden print:block print:text-[10px] font-sans text-gray-500 print:mt-0 print:pt-0"><span className="font-bold mr-2">{v.termEng}</span>{v.defEng}</p>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="여기에 생각을 적어보세요..." className="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300 print:hidden"></textarea>
                        <div className="flex justify-end print:hidden">
                            <button 
                                onClick={handleGetFeedback}
                                disabled={!text.trim() || isLoading} 
                                className={`px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors ${(!text.trim() || isLoading) ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}`}
                            >
                                {isLoading ? '분석 중...' : 'AI 피드백 받기'}
                            </button>
                        </div>

                        {errorMsg && (
                            <div className="mt-4 p-4 bg-red-50 text-red-600 text-sm font-sans print:hidden">{errorMsg}</div>
                        )}

                        {feedbackData && (
                            <div className="mt-8 relative animate-fade-in print:mt-4">
                                <div className="flex items-center gap-2 mb-6 print:mb-3">
                                    <SparklesIcon className="w-5 h-5 text-black print:w-4 print:h-4" />
                                    <h4 className="text-lg font-bold font-sans text-black print:text-[14px]">AI 한국어 도우미</h4>
                                </div>

                                <div className="bg-gray-50 border-l-2 border-black p-6 mb-8 print:p-3 print:mb-4 print:border-l-gray-300 print:bg-white">
                                    <h5 className="text-xs font-bold font-sans text-gray-500 mb-3 print:text-[10px] print:mb-2">총평 및 잘한 점</h5>
                                    <p className="text-[15px] font-serif text-gray-900 leading-relaxed print:text-[11px]">{feedbackData.overallPraise}</p>
                                    {showFeedbackTrans && feedbackData.overallPraiseEng && (
                                        <p className="text-[13px] font-serif text-gray-500 mt-3 pt-3 border-t border-gray-200 animate-fade-in print:hidden">{feedbackData.overallPraiseEng}</p>
                                    )}
                                </div>

                                <h5 className="text-xs font-bold font-sans text-gray-500 mb-4 print:text-[10px] print:mb-2">문장별 교정 및 설명</h5>
                                <div className="space-y-6 print:space-y-3">
                                    {feedbackData.corrections.map((corr, idx) => (
                                        <div key={idx} className="border border-gray-200 p-6 bg-white print:p-3 print:border-gray-300">
                                            <div className="flex flex-col gap-3 mb-5 print:mb-3">
                                                <div className="flex items-start gap-3 print:gap-2">
                                                    <span className="shrink-0 px-2 py-1 bg-gray-100 text-gray-500 text-[10px] font-bold font-sans rounded-sm mt-0.5 print:text-[8px] print:px-1.5 print:py-0.5">수정 전</span>
                                                    <p className="text-[15px] font-serif text-gray-400 line-through leading-relaxed print:text-[11px]">{corr.original}</p>
                                                </div>
                                                <div className="flex items-start gap-3 print:gap-2">
                                                    <span className="shrink-0 px-2 py-1 bg-blue-50 text-blue-600 text-[10px] font-bold font-sans rounded-sm mt-0.5 print:text-[8px] print:px-1.5 print:py-0.5">수정 후</span>
                                                    <p className="text-[15px] font-serif text-black font-medium leading-relaxed print:text-[11px]">{corr.corrected}</p>
                                                </div>
                                            </div>
                                            <div className="pt-4 border-t border-gray-100 print:pt-2 print:border-gray-200">
                                                <p className="text-[14px] font-serif text-gray-700 leading-relaxed print:text-[10px]">
                                                    <span className="text-yellow-500 mr-1 opacity-90">💡</span>
                                                    <span className="font-bold text-gray-500 text-[11px] mr-2 print:text-[9px]">설명</span>
                                                    {corr.explanation}
                                                </p>
                                                {showFeedbackTrans && corr.explanationEng && (
                                                    <p className="text-[13px] font-serif text-gray-500 mt-2 animate-fade-in print:hidden">{corr.explanationEng}</p>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* 하단 우측 미니멀 번역 버튼 (Nudge 디자인) */}
                                <div className="flex justify-end mt-4 opacity-40 hover:opacity-100 transition-opacity duration-300 print:hidden">
                                    <TranslateButton onClick={() => setShowFeedbackTrans(!showFeedbackTrans)} isShowing={showFeedbackTrans} />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        const DiscussView = ({ updateProgress }) => (
            <div className="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in print:py-0">
                <div className="mb-6 pb-6 text-center print:mb-4 print:pb-2">
                    <h2 className="text-[32px] md:text-[36px] font-serif font-bold text-gray-900 mb-2 print:text-[18px] print:mb-1">생각해 보기</h2>
                    <p className="text-sm font-sans text-gray-500 print:text-[12px]">학습 자료에 대해 심층적으로 생각해 보세요.</p>
                </div>
                
                <div className="mb-10 px-5 py-4 bg-[#f8f9fa] border border-gray-200 flex items-center gap-3 text-[15px] text-[#444444] font-sans print:hidden rounded-sm">
                    <SparklesIcon className="w-4 h-4 text-gray-400 shrink-0" />
                    <div className="flex flex-wrap items-center">
                        <span>AI 피드백은 현재 Gemini 웹에서만 가능합니다.&nbsp;</span>
                        <a href="https://gemini.google.com/share/3505314a3127" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-0.5 border-b border-[#444444] hover:border-black hover:text-black transition-colors pb-px">
                            Gemini에서 열기 <ExternalLinkIcon className="w-4 h-4 ml-0.5" />
                        </a>
                    </div>
                </div>

                {DISCUSS_DATA.map((item) => (<DiscussQuestionItem key={item.id} item={item} />))}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home'); const [userLevel] = useState("B2"); const [showVocab, setShowVocab] = useState(false); const [progress, setProgress] = useState({ learn: false, vocab: false, quiz: 0, discuss: false });
            const [isHeaderExpanded, setIsHeaderExpanded] = useState(true); // Default to open

            // Add this useEffect to manage header state based on tab
            useEffect(() => {
                if (activeTab === 'video') {
                    setIsHeaderExpanded(false); // Collapse for immersive learning
                } else {
                    setIsHeaderExpanded(true); // Expand for navigation/home
                }
            }, [activeTab]);

            const updateProgress = useCallback((key, value = true) => { setProgress(prev => { if (prev[key] === value) return prev; return { ...prev, [key]: value }; }); }, []);
            
            const renderContent = () => { 
                switch(activeTab) { 
                    case 'home': return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; 
                    case 'video': return <LearnView updateProgress={updateProgress} />;
                    case 'vocab': return <VocabView updateProgress={updateProgress} />; 
                    case 'quiz': return <QuizView updateProgress={updateProgress} />; 
                    case 'discuss': return <DiscussView updateProgress={updateProgress} />; 
                    default: return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />; 
                } 
            };
            
            const isVideoTab = activeTab === 'video';
            return (
                <div className={`flex flex-col bg-white text-gray-900 selection:bg-gray-200 selection:text-black font-sans ${isVideoTab ? 'h-screen overflow-hidden' : 'min-h-screen'} print:h-auto print:min-h-0 print:overflow-visible print:block`}>
                    <Header isExpanded={isHeaderExpanded} setIsExpanded={setIsHeaderExpanded} activeTab={activeTab} setActiveTab={setActiveTab} />
                    <div className="lg:hidden h-14 border-b border-gray-100 flex items-center justify-center sticky top-0 bg-white z-40 print:hidden"><span className="text-lg font-bold font-sans tracking-tighter">OpenKoreanLearningLab</span></div>
                    <main className={`flex-1 relative flex flex-col ${isVideoTab ? 'overflow-x-hidden lg:overflow-hidden lg:h-full' : ''} print:overflow-visible print:h-auto print:block`}>{renderContent()}</main>
                    <nav className="lg:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 z-50 print:hidden">{NAV_ITEMS.map((item) => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 ${activeTab === item.id ? 'text-black' : 'text-gray-300'}`}><item.icon className="w-6 h-6" /></button>))}</nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
