        // --- Core Data Arrays ---
        const SCRIPT_DATA = [
            { id: 's1', speaker: '한민 (문화심리학자)', kor: '안녕하세요. 문화심리학자 한민희입니다.', time: [0, 2.780], eng: "" },
            { id: 's2', speaker: '한민 (문화심리학자)', kor: '요즘 웹소설이라든지. 웹툰에서 굉장히 크게 다루어지고 있는 회귀물이라는 장르에 대해서 말씀을 나눠보도록 하겠습니다.', time: [2.780, 11.880], eng: "" },
            { id: 's3', speaker: '한민 (문화심리학자)', kor: '회귀물이라는 거는 현생에 있는 어떤 사람이 우연한 계기로 예를 들어서 사고가 난다든가 자고 일어났는데 다른 시대 또는 다른 세계로 가서 일어나는 일들을 얘기하는데요.', time: [13.680, 26.920], eng: "" },
            { id: 's4', speaker: '한민 (문화심리학자)', kor: '회귀물의 특징은 현실에서는 별거 아니던 사람이 자기가 간 새롭게 간 그 세계에서는 굉장히 많은 능력을 갖고 있거나 번치킨이라고 그러죠 굉장히 훌륭한 능력을 갖고 있거나 아니면 시대를 다른 시대로 갔을 경우에는 이제 시대적 장점 재벌집 막내아들이 좀 그런 스타일이었죠.', time: [26.920, 48.520], eng: "" },
            { id: 's5', speaker: '한민 (문화심리학자)', kor: '내가 쭉 살아오면서 알고 있었던 그런 사건들을 과거에서 내 이점으로 활용할 수 있는 이런 식으로 적용이 됩니다.', time: [48.520, 58.120], eng: "" },
            { id: 's6', speaker: '한민 (문화심리학자)', kor: '쉽게 말씀드리면, 현실에서는 별거 아닌 사람이 새롭게 간 현실에서는 굉장히 뛰어난 능력을 가지고 역량을 펼친다 라는 것이 이제 회귀물의 골자라고 볼 수가 있겠죠.', time: [58.660, 69.120], eng: "" },
            { id: 's7', speaker: '한민 (문화심리학자)', kor: '회귀물의 원조는 사실 일본입니다.', time: [69.120, 71.500], eng: "" },
            { id: 's8', speaker: '한민 (문화심리학자)', kor: '이세계물이라는 용어가 있는데요.', time: [71.500, 73.400], eng: "" },
            { id: 's9', speaker: '한민 (문화심리학자)', kor: '현 세계가 아니라 이 세계에서 깨어나는 거예요.', time: [73.400, 76.460], eng: "" },
            { id: 's10', speaker: '한민 (문화심리학자)', kor: '현실에서 여고생이던 내가 거꾸로인가 이런 제목입니다.', time: [76.460, 80.300], eng: "" },
            { id: 's11', speaker: '한민 (문화심리학자)', kor: '평범한 여고생이던 내가 이 세계에서는 기사 이런 식의 제목들인데 이런 유행이 어느 시점부터인가 그렇게 오래는 안 됐는데 우리나라에서는 56년 이렇게쯤 됐을 것 같은데요.', time: [80.300, 90.140], eng: "" },
            { id: 's12', speaker: '한민 (문화심리학자)', kor: '한국에서도 자꾸 많이 발견되기 시작해요. 했어요.', time: [92.540, 95.160], eng: "" },
            { id: 's13', speaker: '한민 (문화심리학자)', kor: '웹소설이라든지. 웹툰 최근에 이제 그런 플랫폼들이 많아지지 않았습니까?', time: [95.160, 99.680], eng: "" },
            { id: 's14', speaker: '한민 (문화심리학자)', kor: '그런 플랫폼들에 주로 올라오는 콘텐츠들이 주로 이제 이세계물 회귀물 종류들인 것이죠.', time: [99.680, 107.780], eng: "" },
            { id: 's15', speaker: '한민 (문화심리학자)', kor: '이런 회귀물의 배경에는 일단 현 시기를 살아가는 청년들의 욕망이 반영이 돼 있다고 생각이 됩니다.', time: [107.780, 116.760], eng: "" },
            { id: 's16', speaker: '한민 (문화심리학자)', kor: '현재 이제 청년 연령대 계시는 분들은 사실 과거보다 좀 삶의 가능성이 많이 제한을 받는 경우가 많죠.', time: [116.760, 125.760], eng: "" },
            { id: 's17', speaker: '한민 (문화심리학자)', kor: '내가 이제 가질 수 있는 뭐 직업 내가 벌 수 있는 돈 살 수 있는 집 이런 그 범위들이 사회가 계속 발달하고 있었던 경제적으로 성장하고 있었던 시기에 젊은 시절을 보내셨던 분들에 비해서는 많이 제한된 경우란 말이에요.', time: [125.760, 142.560], eng: "" },
            { id: 's18', speaker: '한민 (문화심리학자)', kor: '그래서 이 사람들이 이제 대학 공부를 하고 생각해보면서 내가 이번 삶에서는 이룰 수 있는 부분이 제한이 있고 한계가 있고 그러다 보니까 이 세상이 아닌 현생이 아닌 다른 세계에서의 또 다른 나를 꿈꾸는 것이 아닌가 생각이 됩니다.', time: [142.560, 160.940], eng: "" },
            { id: 's19', speaker: '한민 (문화심리학자)', kor: '이런 측면은 일본의 문화적 방어기제인 환상이라고 볼 수가 있는데, 그래서 일본의 콘텐츠들이 대부분 현실이 아닌 이 세계를 다루는 것들이 굉장히 많죠.', time: [160.940, 172.820], eng: "" },
            { id: 's20', speaker: '한민 (문화심리학자)', kor: '배경 자체가 이제 지구가 아니라든가 지금 시대가 아니고 뭐 일본이 아니고 이런 식의 콘텐츠들이 굉장히 많은데 그중에서도 2010년 이후에 이색의 물이라는 본격적으로 지금 현실에서의 내가 다른 시대 다른 공간에서 태어나서 원치킨적인 능력을 발휘하는 콘텐츠들이 등장하기 시작했다는 거예요.', time: [172.820, 193.220], eng: "" },
            { id: 's21', speaker: '한민 (문화심리학자)', kor: '그래서 이제 두 가지 측면이 결합이 된 것 같습니다.', time: [193.220, 196.940], eng: "" },
            { id: 's22', speaker: '한민 (문화심리학자)', kor: '일본의 그런 문화적 콘텐츠의 토양에서 현대를 살아가는 청년들의 충족하기 어려운 억눌린 욕망이 나타난 것이 이색의 무리였고 문화적 방어기제 측면에서는 한국인들은 일본하고는 좀 차이가 있습니다마는 최근 젊은이들의 충족되기 어려운 욕구라는 측면이 이제 이세계물을 통해서 한국에서도 유행을 하는 것 같습니다.', time: [196.940, 220.160], eng: "" },
            { id: 's23', speaker: '사피랜드 Sapiland', kor: '최근 회귀물들을 보면 재벌집 막내아들도 그렇고 환원도 그렇고 몸이 바뀌거나 하는데 이게 기억이 그대로 가잖아요.', time: [220.160, 230.100], eng: "" },
            { id: 's24', speaker: '사피랜드 Sapiland', kor: '다 잊어버리고 정말 리셋이 아니라 인생 2회차 3회차에 사실 느낌으로 흘러가고', time: [230.100, 235.480], eng: "" },
            { id: 's25', speaker: '한민 (문화심리학자)', kor: '내 정체성을 그대로 가지고 가는 거죠.', time: [240.500, 243.020], eng: "" },
            { id: 's26', speaker: '한민 (문화심리학자)', kor: '내 지식과 정체성을 그대로 가지고 가야 이 세상에서는 별로 쓸모가 없고 그렇게 독특하지 않은 정체성이 그쪽에서는 큰 이득이 될 수 있는 그런 쪽으로 작용을 하는 거죠.', time: [243.020, 254.840], eng: "" },
            { id: 's27', speaker: '한민 (문화심리학자)', kor: '현세에 만족할 수 없는 자기상이 반영된 모습이라고 생각이 됩니다.', time: [254.840, 261.100], eng: "" },
            { id: 's28', speaker: '사피랜드 Sapiland', kor: '치트키를 달고 싶은 어떤 욕구 같은 걸까요?', time: [261.100, 264.060], eng: "" },
            { id: 's29', speaker: '한민 (문화심리학자)', kor: '기억나는 웹툰 제목 중에 나 혼자만 레벨업 뭐 이런 제목이 있었는데, 현실은 이런데 나만이라도 좀 그런 곳에서 벗어나서 그런 삶을 살고 싶다.', time: [264.060, 275], eng: "" },
            { id: 's30', speaker: '한민 (문화심리학자)', kor: '그래서 아마 일본식 이세계물하고 한국식 이세계물의 차이가 그래도 이게 좀 한국적이다라는 특징은 재벌집 막내아들에서 보여진 게 대표적이었어요.', time: [275, 284.040], eng: "" },
            { id: 's31', speaker: '한민 (문화심리학자)', kor: '이 세계로 가는 게 아니라 같은 나라의 다른 시간대로 간 거죠.', time: [284.040, 287.440], eng: "" },
            { id: 's32', speaker: '한민 (문화심리학자)', kor: '그리고 이제 내가 다른 관계로 만나긴 하지만 현실에서 만났던 사람들을 그대로 만납니다.', time: [287.440, 294.580], eng: "" },
            { id: 's33', speaker: '한민 (문화심리학자)', kor: '또 내가 이제 현생에서 생각했던 그런 것들 문제점이라든가 이제 그런 부분들을 새로운 삶에서 그걸 해결하려는 모습을 보여요.', time: [294.580, 304.660], eng: "" },
            { id: 's34', speaker: '한민 (문화심리학자)', kor: '이런 게 이제 일본 쪽 콘텐츠랑 구별되는 지점이 아닌가 싶은데 일본 문화에서는 현실에서의 문제를 현실에서 직접 내가 해결한다는 게 조금 어렵거든요.', time: [304.660, 315.660], eng: "" },
            { id: 's35', speaker: '한민 (문화심리학자)', kor: '문화 콘텐츠의 그런 부분이 좀처럼 발견되기가 쉽지 않습니다.', time: [316.860, 320.460], eng: "" },
            { id: 's36', speaker: '한민 (문화심리학자)', kor: '한국 사람들의 심리에는 한국인들의 욕구에는 윤도준의 행동을 통해서 내가 이제 그런 모습을 보고 싶다는 거죠.', time: [320.460, 328.100], eng: "" },
            { id: 's37', speaker: '한민 (문화심리학자)', kor: '더 좋지 않은 기업을 바꿔가고 그런 모습을 현실에서 보고 싶다는 욕망 그런 게 중요한 차이가 아닐까 싶습니다.', time: [328.100, 336.240], eng: "" },
            { id: 's38', speaker: '사피랜드 Sapiland', kor: '이생망이라는 단어 혹시 들어보셨나요?', time: [336.240, 339.140], eng: "" },

            const apiKey = ""; const apiUrl = `${CONFIG.GEMINI_API_URL}?key=${apiKey}`; const delays = CONFIG.API_RETRY_DELAYS;
            for (let i = 0; i <= delays.length; i++) {
                try {
                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) {
                        const errorText = await response.text();
                        if (response.status === 400 || response.status === 401 || response.status === 403) {

                    case 'home': return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />;
                    case 'video': return <VideoLearningView updateProgress={updateProgress} />;
                    case 'reading': return <ReadingView updateProgress={updateProgress} showVocab={showVocab} setShowVocab={setShowVocab} userLevel={userLevel} />;
                    case 'vocab': return <VocabView updateProgress={updateProgress} />;
                    case 'quiz': return <QuizView updateProgress={updateProgress} />;
                    case 'discuss': return <DiscussView updateProgress={updateProgress} />;
                    default: return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />;
                }
            };

            const isFullscreenTab = activeTab === 'reading' || activeTab === 'video';

            return (
                <div className={`flex flex-col bg-white text-gray-900 selection:bg-gray-200 selection:text-black font-sans ${isFullscreenTab ? 'h-screen overflow-hidden print:h-auto print:overflow-visible' : 'min-h-screen'}`}>
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} isExpanded={isHeaderExpanded} setIsExpanded={setIsHeaderExpanded} />
                    <div className="lg:hidden h-14 border-b border-gray-100 flex items-center justify-center sticky top-0 bg-white z-40 print:hidden"><span className="text-lg font-bold font-sans tracking-tighter">OpenKoreanLearningLab</span></div>
                    <main className={`flex-1 relative flex flex-col ${isFullscreenTab ? 'overflow-x-hidden lg:overflow-hidden lg:h-full print:h-auto print:overflow-visible' : ''}`}>{renderContent()}</main>
                    <nav className="lg:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 z-50 print:hidden">{NAV_ITEMS.map((item) => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 ${activeTab === item.id ? 'text-black' : 'text-gray-300'}`}><item.icon className="w-6 h-6" /></button>))}</nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>

</html>
