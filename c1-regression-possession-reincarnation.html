        // --- Core Data Arrays ---
        const SCRIPT_DATA = [
            { id: 's1', speaker: '한민 (문화심리학자)', kor: '안녕하세요. 문화심리학자 한민희입니다.', time: [0, 2.780], eng: "" },
            { id: 's2', speaker: '한민 (문화심리학자)', kor: '요즘 웹소설이라든지. 웹툰에서 굉장히 크게 다루어지고 있는 회귀물이라는 장르에 대해서 말씀을 나눠보도록 하겠습니다.', time: [2.780, 11.880], eng: "" },
            { id: 's3', speaker: '한민 (문화심리학자)', kor: '회귀물이라는 거는 현생에 있는 어떤 사람이 우연한 계기로 예를 들어서 사고가 난다든가 자고 일어났는데 다른 시대 또는 다른 세계로 가서 일어나는 일들을 얘기하는데요.', time: [13.680, 26.920], eng: "" },
            { id: 's4', speaker: '한민 (문화심리학자)', kor: '회귀물의 특징은 현실에서는 별거 아니던 사람이 자기가 간 새롭게 간 그 세계에서는 굉장히 많은 능력을 갖고 있거나 번치킨이라고 그러죠 굉장히 훌륭한 능력을 갖고 있거나 아니면 시대를 다른 시대로 갔을 경우에는 이제 시대적 장점 재벌집 막내아들이 좀 그런 스타일이었죠.', time: [26.920, 48.520], eng: "" },
            { id: 's5', speaker: '한민 (문화심리학자)', kor: '내가 쭉 살아오면서 알고 있었던 그런 사건들을 과거에서 내 이점으로 활용할 수 있는 이런 식으로 적용이 됩니다.', time: [48.520, 58.120], eng: "" },
            { id: 's6', speaker: '한민 (문화심리학자)', kor: '쉽게 말씀드리면, 현실에서는 별거 아닌 사람이 새롭게 간 현실에서는 굉장히 뛰어난 능력을 가지고 역량을 펼친다 라는 것이 이제 회귀물의 골자라고 볼 수가 있겠죠.', time: [58.660, 69.120], eng: "" },
            { id: 's7', speaker: '한민 (문화심리학자)', kor: '회귀물의 원조는 사실 일본입니다.', time: [69.120, 71.500], eng: "" },
            { id: 's8', speaker: '한민 (문화심리학자)', kor: '이세계물이라는 용어가 있는데요.', time: [71.500, 73.400], eng: "" },
            { id: 's9', speaker: '한민 (문화심리학자)', kor: '현 세계가 아니라 이 세계에서 깨어나는 거예요.', time: [73.400, 76.460], eng: "" },
            { id: 's10', speaker: '한민 (문화심리학자)', kor: '현실에서 여고생이던 내가 거꾸로인가 이런 제목입니다.', time: [76.460, 80.300], eng: "" },
            { id: 's11', speaker: '한민 (문화심리학자)', kor: '평범한 여고생이던 내가 이 세계에서는 기사 이런 식의 제목들인데 이런 유행이 어느 시점부터인가 그렇게 오래는 안 됐는데 우리나라에서는 56년 이렇게쯤 됐을 것 같은데요.', time: [80.300, 90.140], eng: "" },
            { id: 's12', speaker: '한민 (문화심리학자)', kor: '한국에서도 자꾸 많이 발견되기 시작해요. 했어요.', time: [92.540, 95.160], eng: "" },
            { id: 's13', speaker: '한민 (문화심리학자)', kor: '웹소설이라든지. 웹툰 최근에 이제 그런 플랫폼들이 많아지지 않았습니까?', time: [95.160, 99.680], eng: "" },
            { id: 's14', speaker: '한민 (문화심리학자)', kor: '그런 플랫폼들에 주로 올라오는 콘텐츠들이 주로 이제 이세계물 회귀물 종류들인 것이죠.', time: [99.680, 107.780], eng: "" },
            { id: 's15', speaker: '한민 (문화심리학자)', kor: '이런 회귀물의 배경에는 일단 현 시기를 살아가는 청년들의 욕망이 반영이 돼 있다고 생각이 됩니다.', time: [107.780, 116.760], eng: "" },
            { id: 's16', speaker: '한민 (문화심리학자)', kor: '현재 이제 청년 연령대 계시는 분들은 사실 과거보다 좀 삶의 가능성이 많이 제한을 받는 경우가 많죠.', time: [116.760, 125.760], eng: "" },
            { id: 's17', speaker: '한민 (문화심리학자)', kor: '내가 이제 가질 수 있는 뭐 직업 내가 벌 수 있는 돈 살 수 있는 집 이런 그 범위들이 사회가 계속 발달하고 있었던 경제적으로 성장하고 있었던 시기에 젊은 시절을 보내셨던 분들에 비해서는 많이 제한된 경우란 말이에요.', time: [125.760, 142.560], eng: "" },
            { id: 's18', speaker: '한민 (문화심리학자)', kor: '그래서 이 사람들이 이제 대학 공부를 하고 생각해보면서 내가 이번 삶에서는 이룰 수 있는 부분이 제한이 있고 한계가 있고 그러다 보니까 이 세상이 아닌 현생이 아닌 다른 세계에서의 또 다른 나를 꿈꾸는 것이 아닌가 생각이 됩니다.', time: [142.560, 160.940], eng: "" },
            { id: 's19', speaker: '한민 (문화심리학자)', kor: '이런 측면은 일본의 문화적 방어기제인 환상이라고 볼 수가 있는데, 그래서 일본의 콘텐츠들이 대부분 현실이 아닌 이 세계를 다루는 것들이 굉장히 많죠.', time: [160.940, 172.820], eng: "" },
            { id: 's20', speaker: '한민 (문화심리학자)', kor: '배경 자체가 이제 지구가 아니라든가 지금 시대가 아니고 뭐 일본이 아니고 이런 식의 콘텐츠들이 굉장히 많은데 그중에서도 2010년 이후에 이색의 물이라는 본격적으로 지금 현실에서의 내가 다른 시대 다른 공간에서 태어나서 원치킨적인 능력을 발휘하는 콘텐츠들이 등장하기 시작했다는 거예요.', time: [172.820, 193.220], eng: "" },
            { id: 's21', speaker: '한민 (문화심리학자)', kor: '그래서 이제 두 가지 측면이 결합이 된 것 같습니다.', time: [193.220, 196.940], eng: "" },
            { id: 's22', speaker: '한민 (문화심리학자)', kor: '일본의 그런 문화적 콘텐츠의 토양에서 현대를 살아가는 청년들의 충족하기 어려운 억눌린 욕망이 나타난 것이 이색의 무리였고 문화적 방어기제 측면에서는 한국인들은 일본하고는 좀 차이가 있습니다마는 최근 젊은이들의 충족되기 어려운 욕구라는 측면이 이제 이세계물을 통해서 한국에서도 유행을 하는 것 같습니다.', time: [196.940, 220.160], eng: "" },
            { id: 's23', speaker: '사피랜드 Sapiland', kor: '최근 회귀물들을 보면 재벌집 막내아들도 그렇고 환원도 그렇고 몸이 바뀌거나 하는데 이게 기억이 그대로 가잖아요.', time: [220.160, 230.100], eng: "" },
            { id: 's24', speaker: '사피랜드 Sapiland', kor: '다 잊어버리고 정말 리셋이 아니라 인생 2회차 3회차에 사실 느낌으로 흘러가고', time: [230.100, 235.480], eng: "" },
            { id: 's25', speaker: '한민 (문화심리학자)', kor: '내 정체성을 그대로 가지고 가는 거죠.', time: [240.500, 243.020], eng: "" },
            { id: 's26', speaker: '한민 (문화심리학자)', kor: '내 지식과 정체성을 그대로 가지고 가야 이 세상에서는 별로 쓸모가 없고 그렇게 독특하지 않은 정체성이 그쪽에서는 큰 이득이 될 수 있는 그런 쪽으로 작용을 하는 거죠.', time: [243.020, 254.840], eng: "" },
            { id: 's27', speaker: '한민 (문화심리학자)', kor: '현세에 만족할 수 없는 자기상이 반영된 모습이라고 생각이 됩니다.', time: [254.840, 261.100], eng: "" },
            { id: 's28', speaker: '사피랜드 Sapiland', kor: '치트키를 달고 싶은 어떤 욕구 같은 걸까요?', time: [261.100, 264.060], eng: "" },
            { id: 's29', speaker: '한민 (문화심리학자)', kor: '기억나는 웹툰 제목 중에 나 혼자만 레벨업 뭐 이런 제목이 있었는데, 현실은 이런데 나만이라도 좀 그런 곳에서 벗어나서 그런 삶을 살고 싶다.', time: [264.060, 275], eng: "" },
            { id: 's30', speaker: '한민 (문화심리학자)', kor: '그래서 아마 일본식 이세계물하고 한국식 이세계물의 차이가 그래도 이게 좀 한국적이다라는 특징은 재벌집 막내아들에서 보여진 게 대표적이었어요.', time: [275, 284.040], eng: "" },
            { id: 's31', speaker: '한민 (문화심리학자)', kor: '이 세계로 가는 게 아니라 같은 나라의 다른 시간대로 간 거죠.', time: [284.040, 287.440], eng: "" },
            { id: 's32', speaker: '한민 (문화심리학자)', kor: '그리고 이제 내가 다른 관계로 만나긴 하지만 현실에서 만났던 사람들을 그대로 만납니다.', time: [287.440, 294.580], eng: "" },
            { id: 's33', speaker: '한민 (문화심리학자)', kor: '또 내가 이제 현생에서 생각했던 그런 것들 문제점이라든가 이제 그런 부분들을 새로운 삶에서 그걸 해결하려는 모습을 보여요.', time: [294.580, 304.660], eng: "" },
            { id: 's34', speaker: '한민 (문화심리학자)', kor: '이런 게 이제 일본 쪽 콘텐츠랑 구별되는 지점이 아닌가 싶은데 일본 문화에서는 현실에서의 문제를 현실에서 직접 내가 해결한다는 게 조금 어렵거든요.', time: [304.660, 315.660], eng: "" },
            { id: 's35', speaker: '한민 (문화심리학자)', kor: '문화 콘텐츠의 그런 부분이 좀처럼 발견되기가 쉽지 않습니다.', time: [316.860, 320.460], eng: "" },
            { id: 's36', speaker: '한민 (문화심리학자)', kor: '한국 사람들의 심리에는 한국인들의 욕구에는 윤도준의 행동을 통해서 내가 이제 그런 모습을 보고 싶다는 거죠.', time: [320.460, 328.100], eng: "" },
            { id: 's37', speaker: '한민 (문화심리학자)', kor: '더 좋지 않은 기업을 바꿔가고 그런 모습을 현실에서 보고 싶다는 욕망 그런 게 중요한 차이가 아닐까 싶습니다.', time: [328.100, 336.240], eng: "" },
            { id: 's38', speaker: '사피랜드 Sapiland', kor: '이생망이라는 단어 혹시 들어보셨나요?', time: [336.240, 339.140], eng: "" },

                        new window.YT.Player('youtube-player', {
                            videoId: CONFIG.YOUTUBE_VIDEO_ID, width: '100%', height: '100%',
                            playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'disablekb': 1 },
                            events: {
                                'onReady': (event) => { playerRef.current = event.target; setVideoState(prev => ({ ...prev, player: event.target, duration: event.target.getDuration() })); setIsLoading(false); },
                                'onStateChange': (event) => { if (event.data === window.YT.PlayerState.PLAYING) { startInterval(); updateProgress('video'); setVideoState(prev => ({ ...prev, isPlaying: true })); } else { stopInterval(); if (event.data === window.YT.PlayerState.PAUSED || event.data === window.YT.PlayerState.ENDED) { setVideoState(prev => ({ ...prev, isPlaying: false })); } } }
                            }
                        });
                    }
                };
                if (!window.YT) { const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; const firstScriptTag = document.getElementsByTagName('script')[0]; firstScriptTag.parentNode.insertBefore(tag, firstScriptTag); window.onYouTubeIframeAPIReady = loadVideo; } else { loadVideo(); }
                return () => stopInterval();
            }, []);

            useEffect(() => { if (videoState.player && videoState.player.setPlaybackRate) videoState.player.setPlaybackRate(playbackRate); }, [playbackRate, videoState.player]);

            const handleGlobalClick = useCallback(() => { if (popup.fixed) setPopup(prev => ({ ...prev, show: false, fixed: false })); }, [popup.fixed]);
            useEffect(() => { if (popup.fixed) window.addEventListener('click', handleGlobalClick); return () => window.removeEventListener('click', handleGlobalClick); }, [popup.fixed, handleGlobalClick]);

            useEffect(() => {
                const handleKeyPress = (e) => {
                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                    if (e.code === 'Space') { e.preventDefault(); const player = videoState.player; if (player && typeof player.getPlayerState === 'function') { if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); } }
                    if (e.code === 'ArrowLeft') { e.preventDefault(); const currentIndex = SCRIPT_DATA.findIndex(line => line.id === activeLine); if (currentIndex > 0) handleLineClick(SCRIPT_DATA[currentIndex - 1].time[0]); }
                    if (e.code === 'ArrowRight') { e.preventDefault(); const currentIndex = SCRIPT_DATA.findIndex(line => line.id === activeLine); if (currentIndex !== -1 && currentIndex < SCRIPT_DATA.length - 1) handleLineClick(SCRIPT_DATA[currentIndex + 1].time[0]); else if (currentIndex === -1 && SCRIPT_DATA.length > 0) handleLineClick(SCRIPT_DATA[0].time[0]); }
                };
                window.addEventListener('keydown', handleKeyPress); return () => window.removeEventListener('keydown', handleKeyPress);
            }, [videoState.player, activeLine]);

            const startInterval = () => {
                stopInterval();
                intervalRef.current = setInterval(() => {
                    const p = playerRef.current;
                    if (p && p.getCurrentTime) {
                        const time = p.getCurrentTime();
                        setVideoState(prev => ({ ...prev, currentTime: time }));
                        const currentLine = SCRIPT_DATA.find(line => time >= line.time[0] && time < line.time[1]);
                        if (currentLine) setActiveLine(currentLine.id);
                    }
                }, 200);
            };

            const stopInterval = () => {
                if (intervalRef.current) {
                    clearInterval(intervalRef.current);
                    intervalRef.current = null;
                }
            };

            useEffect(() => {
                if (popup.show) return;
                if (activeLine && autoScroll && scriptRefs.current[activeLine]) {
                    scriptRefs.current[activeLine].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [activeLine, autoScroll, popup.show, layoutMode]);

            const handleLineClick = (time) => { const player = videoState.player; if (player) { player.seekTo(time, true); player.playVideo(); } };
            const toggleTranslation = (id) => setTranslations(prev => ({ ...prev, [id]: !prev[id] }));
            const scrollToVocab = (term) => { const element = sidebarVocabRefs.current[term]; if (element) element.scrollIntoView({ behavior: 'smooth', block: 'center' }); };

            const handleVocabEnter = (e, wordData) => { if (popup.fixed) return; const rect = e.target.getBoundingClientRect(); setPopup({ show: true, fixed: false, data: wordData, x: rect.left + rect.width / 2, y: rect.bottom }); if (showVocab) { setActiveVocabTerm(wordData.term); scrollToVocab(wordData.term); } };
            const handleVocabLeave = () => { if (popup.fixed) return; setPopup(prev => ({ ...prev, show: false })); };
            const handleVocabClick = (e, wordData) => { e.stopPropagation(); if (popup.fixed && popup.data && popup.data.term === wordData.term) { setPopup(prev => ({ ...prev, show: false, fixed: false })); return; } const rect = e.target.getBoundingClientRect(); setPopup({ show: true, fixed: true, data: wordData, x: rect.left + rect.width / 2, y: rect.bottom }); if (showVocab) { setActiveVocabTerm(wordData.term); scrollToVocab(wordData.term); } };

            const handleSeek = (e) => { const time = parseFloat(e.target.value); if (videoState.player) videoState.player.seekTo(time, true); setVideoState(prev => ({ ...prev, currentTime: time })); };
            const togglePlay = () => { const player = videoState.player; if (player) { if (videoState.isPlaying) player.pauseVideo(); else player.playVideo(); } };
            const rewind2 = () => { const player = videoState.player; if (player) { const newTime = Math.max(0, videoState.currentTime - 1.5); player.seekTo(newTime, true); setVideoState(prev => ({ ...prev, currentTime: newTime })); } };
            const forward2 = () => { const player = videoState.player; if (player) { const newTime = Math.min(videoState.duration, videoState.currentTime + 1.5); player.seekTo(newTime, true); setVideoState(prev => ({ ...prev, currentTime: newTime })); } };
            const formatTime = (seconds) => { if (isNaN(seconds)) return "00:00"; const date = new Date(seconds * 1000); const mm = date.getUTCMinutes(); const ss = date.getUTCSeconds(); return `${mm.toString().padStart(2, '0')}:${ss.toString().padStart(2, '0')}`; };

            const allVocabTerms = useMemo(() => { return VIDEO_VOCAB_DATA.flatMap(vocab => { const terms = [vocab.term]; if (vocab.variants) terms.push(...vocab.variants); if (vocab.subDefs) terms.push(...vocab.subDefs.map(s => s.subTerm)); return [...new Set(terms)].filter(t => t).map(term => ({ term, vocab })); }).sort((a, b) => b.term.length - a.term.length); }, []);

            const renderTextWithVocab = (text) => {
                if (!text) return [""];
                const matches = [];
                allVocabTerms.forEach(({ term, vocab }) => { let index = 0; while ((index = text.indexOf(term, index)) !== -1) { const end = index + term.length; const overlaps = matches.some(m => (index >= m.start && index < m.end) || (end > m.start && end <= m.end) || (index <= m.start && end >= m.end)); if (!overlaps) matches.push({ start: index, end, term, vocab }); index += 1; } });
                matches.sort((a, b) => a.start - b.start);
                const result = []; let lastIndex = 0;
                matches.forEach((match, idx) => {
                    if (match.start > lastIndex) result.push(text.substring(lastIndex, match.start)); const isActive = (popup.show && popup.data && popup.data.term === match.vocab.term) || (showVocab && activeVocabTerm === match.vocab.term);
                    result.push(<span key={`${match.term}-${idx}`} className={`cursor-pointer border-b border-dotted transition-all duration-200 font-medium inline-block leading-tight ${isActive ? 'border-black bg-white text-black border-solid' : 'border-gray-400 text-gray-800 hover:border-black hover:text-black'}`} onMouseEnter={(e) => handleVocabEnter(e, match.vocab)} onMouseLeave={handleVocabLeave} onClick={(e) => handleVocabClick(e, match.vocab)}>{match.term}</span>); lastIndex = match.end;
                });
                if (lastIndex < text.length) result.push(text.substring(lastIndex));
                return result;

                            <div className={`flex-1 overflow-y-auto ${isScriptMode ? 'bg-white' : 'bg-white'} print:overflow-visible print:h-auto`}>

                                        return (

                                                </div>

                                <div className={`p-8 space-y-8 ${!isScriptMode ? 'block' : 'hidden'} print:hidden`}>

                                                <div className={`flex items-center gap-2 mb-2 justify-start`}>

                                                        <button onClick={(e) => { e.stopPropagation(); handleLineClick(line.time[0]); }} className="w-4 h-4 rounded-full border border-gray-300 flex items-center justify-center hover:bg-black hover:border-black hover:text-white transition-all text-gray-400 shrink-0">
                                                            <PlayIconSolid className="w-2 h-2 ml-[1px]" />
                                                        </button>
                                                        <TranslateBtn onClick={() => toggleTranslation(line.id)} isShowing={translations[line.id]} />
                                                    </div>
                                                </div>
                                            </div>

                                </div>
                            </div>
                        </div>
                        {/* Video Vocab Sidebar - Always print in 8:2 layout */}
                        <div className={`w-80 flex-col bg-white border-l border-gray-200 animate-fade-in ${showVocab ? (isScriptMode ? 'fixed right-0 top-[64px] h-[calc(100vh-64px)] xl:flex' : 'h-full hidden xl:flex') : 'hidden'} print:flex print:w-[20%] print:static print:border-l-0 print:h-auto print:overflow-visible`}>
                            <div className="p-5 border-b border-gray-100 flex items-center justify-between bg-white print:p-2 print:border-b-0">
                                <span className="font-ui text-xs font-bold uppercase tracking-widest text-gray-900 print:text-[10px]">핵심 어휘</span>
                                <span className="text-xs font-serif text-gray-500 italic print:hidden">{VIDEO_VOCAB_DATA.length}개</span>
                            </div>
                            <div className="flex-1 overflow-y-auto bg-white print:overflow-visible print:h-auto">
                                {VIDEO_VOCAB_DATA.map((word, idx) => (<VideoSidebarVocabCard key={idx} word={word} activeVocabTerm={activeVocabTerm} sidebarVocabRefs={sidebarVocabRefs} />))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Header = ({ activeTab, setActiveTab, isExpanded, setIsExpanded }) => (
            <div className="hidden lg:block relative z-50 print:hidden">
                <header className={`fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100 flex items-center justify-between px-8 pr-20 transition-all duration-500 ease-in-out overflow-hidden ${isExpanded ? 'h-16 opacity-100' : 'h-0 opacity-0 border-none'}`}>
                    <div className="flex items-center cursor-pointer text-left" onClick={() => setActiveTab('home')}>
                        <span className="text-lg font-bold font-sans tracking-tighter text-black whitespace-nowrap">OpenKoreanLearningLab</span>
                    </div>
                    <nav className="flex items-center gap-8">
                        {NAV_ITEMS.map((menu) => (
                            <button key={menu.id} onClick={() => setActiveTab(menu.id)} className={`text-sm font-medium transition-colors font-sans relative ${activeTab === menu.id ? 'text-black' : 'text-gray-400 hover:text-gray-600'}`}>{menu.label}{activeTab === menu.id && <div className="absolute -bottom-6 left-0 w-full h-0.5 bg-black"></div>}</button>

        const HomeView = ({ setActiveTab, userLevel }) => {
            const levelInfo = LEVEL_DEFINITIONS[userLevel] || { title: "Unknown" };
            return (
                <div className="animate-fade-in max-w-5xl mx-auto w-full px-6 lg:px-0 pt-44 pb-16 flex flex-col items-center print:pt-0 print:pb-0">
                    <div className="flex flex-col items-center justify-center min-h-[40vh] md:min-h-[50vh] text-center mb-16 pb-10 w-full print:min-h-0 print:mb-4 print:pb-4">
                        <div className="flex items-center gap-3 mb-8 print:mb-2">
                            <span className="px-3 py-1 bg-gray-900 text-white text-[10px] font-sans font-bold tracking-widest uppercase print:text-[12px]">문화</span>
                            <span className="px-3 py-1 bg-gray-900 text-white text-[10px] font-sans font-bold tracking-widest uppercase print:text-[12px]">사회</span>

            const [attempts, setAttempts] = useState({}); const [shuffledChoices, setShuffledChoices] = useState(ANSWER_CHOICES); const totalQuestions = QUIZ_LIST.length; const correctCount = Object.values(attempts).filter(v => v).length; const currentScore = Math.round((correctCount / totalQuestions) * 100);
            useEffect(() => { const totalAttempts = Object.keys(attempts).length; if (totalAttempts === 0) return; updateProgress('quiz', currentScore); }, [attempts, currentScore, updateProgress]);
            const handleAttempt = (quizId, isCorrect) => { setAttempts(prev => { if (prev.hasOwnProperty(quizId)) return prev; const newAttempts = { ...prev, [quizId]: isCorrect }; return newAttempts; }); };
            const shuffleChoices = useCallback(() => { setShuffledChoices(prev => { const newArray = [...prev]; for (let i = newArray.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[newArray[i], newArray[j]] = [newArray[j], newArray[i]]; } return newArray; }); }, []);
            return (
                <div className="max-w-4xl mx-auto w-full px-6 pt-40 pb-20 flex flex-col md:flex-row gap-12 animate-fade-in print:pt-0 print:pb-0 print:flex-col print:gap-4">
                    <div className="w-full md:w-64 shrink-0 print:w-full">
                        <div className="sticky top-24 print:static">
                            <div className="md:sticky md:top-24 print:static">
                                <h2 className="text-[32px] md:text-[36px] font-serif font-bold text-[#1a1a1a] mb-2 print:text-[18px] print:mb-1">내용 확인 퀴즈</h2><p className="text-sm font-sans text-gray-500 mb-6 print:text-[12px] print:mb-2">학습 자료에 대한 이해도를 확인해 보세요.</p><div className="border-t border-gray-200 pt-4 mb-8 print:hidden"><span className="text-xs font-bold font-sans text-black uppercase block mb-2">정답률</span><span className="text-4xl font-serif font-bold text-gray-900">{currentScore}%</span></div><div className="bg-gray-50 p-4 border border-gray-100 print:p-0 print:bg-transparent print:border-0"><h4 className="text-xs font-bold font-sans text-gray-500 uppercase mb-3 border-b border-gray-200 pb-2 print:text-[12px] print:mb-1 print:border-0">정답 목록</h4><div className="flex flex-wrap gap-2">{shuffledChoices.map((choice, idx) => (<span key={idx} className="text-xs font-serif text-gray-600 bg-white border border-gray-200 px-2 py-1 select-all print:text-[10px] print:border-0 print:p-0 print:mr-2">{choice}</span>))}</div></div>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1">{QUIZ_LIST.map((quiz) => (<QuizSentence key={quiz.id} quiz={quiz} onAttempt={handleAttempt} onShuffle={shuffleChoices} />))}</div>
                </div>
            );
        };

        const DiscussView = ({ updateProgress }) => (
            <div className="max-w-3xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in print:pt-0 print:pb-0">
                <div className="mb-6 pb-6 text-center print:mb-4 print:pb-0 print:text-left">
                    <h2 className="text-[32px] md:text-[36px] font-serif font-bold text-[#1a1a1a] mb-2 print:text-[18px] print:mb-1">생각해 보기</h2><p className="text-sm font-sans text-gray-500 print:text-[12px]">학습 자료에 대해 심층적으로 생각해 보세요.</p>
                </div>
                <div className="bg-gray-50 border border-gray-200 p-4 mb-10 flex items-start gap-3 print:hidden"><div className="shrink-0 mt-0.5"><SparklesIcon className="w-4 h-4 text-gray-400" /></div><p className="text-xs font-sans text-gray-600 leading-relaxed">AI 피드백은 현재 Gemini 웹에서만 가능합니다. <a href="https://gemini.google.com/share/92143eec7b84" target="_blank" rel="noreferrer" className="underline decoration-gray-400 underline-offset-2 hover:text-black inline-flex items-center gap-1">Gemini에서 열기 <ExternalLinkIcon className="w-3 h-3" /></a></p></div>
                {DISCUSS_DATA.map((item) => (<DiscussQuestionItem key={item.id} item={item} />))}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [userLevel] = useState("C1");
            const [showVocab, setShowVocab] = useState(false);
            const [progress, setProgress] = useState({ learn: false, vocab: false, quiz: 0, discuss: false });
            const [isHeaderExpanded, setIsHeaderExpanded] = useState(true);

            useEffect(() => {
                if (activeTab === 'video' || activeTab === 'reading') setIsHeaderExpanded(false);
                else setIsHeaderExpanded(true);
            }, [activeTab]);

            const updateProgress = useCallback((key, value = true) => { setProgress(prev => { if (prev[key] === value) return prev; return { ...prev, [key]: value }; }); }, []);

            const renderContent = () => {
                switch (activeTab) {
                    case 'home': return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />;
                    case 'video': return <VideoLearningView updateProgress={updateProgress} />;
                    case 'reading': return <ReadingView updateProgress={updateProgress} showVocab={showVocab} setShowVocab={setShowVocab} userLevel={userLevel} />;
                    case 'vocab': return <VocabView updateProgress={updateProgress} />;
                    case 'quiz': return <QuizView updateProgress={updateProgress} />;
                    case 'discuss': return <DiscussView updateProgress={updateProgress} />;
                    default: return <HomeView setActiveTab={setActiveTab} userLevel={userLevel} />;
                }
            };

            const isFullscreenTab = activeTab === 'reading' || activeTab === 'video';

            return (
                <div className={`flex flex-col bg-white text-gray-900 selection:bg-gray-200 selection:text-black font-sans ${isFullscreenTab ? 'h-screen overflow-hidden print:h-auto print:overflow-visible' : 'min-h-screen'}`}>
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} isExpanded={isHeaderExpanded} setIsExpanded={setIsHeaderExpanded} />
                    <div className="lg:hidden h-14 border-b border-gray-100 flex items-center justify-center sticky top-0 bg-white z-40 print:hidden"><span className="text-lg font-bold font-sans tracking-tighter">OpenKoreanLearningLab</span></div>
                    <main className={`flex-1 relative flex flex-col ${isFullscreenTab ? 'overflow-x-hidden lg:overflow-hidden lg:h-full print:h-auto print:overflow-visible' : ''}`}>{renderContent()}</main>
                    <nav className="lg:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 z-50 print:hidden">{NAV_ITEMS.map((item) => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 ${activeTab === item.id ? 'text-black' : 'text-gray-300'}`}><item.icon className="w-6 h-6" /></button>))}</nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>

</html>
